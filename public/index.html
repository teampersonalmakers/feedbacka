<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalmakers AI</title>
<style>
:root { --bg:#f6f7f9; --panel:#ffffff; --border:#e5e8ee; --ink:#1a1d23; --ink-mid:#4a5160; --ink-soft:#8a91a0; --accent:#2f6bff; --accent-soft:#eef3ff; --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:var(--font); background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:10px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; }
.logo { background:var(--accent); color:#fff; font-size:11px; font-weight:800; padding:4px 9px; border-radius:6px; letter-spacing:.3px; }
.htitle { font-weight:700; font-size:14px; }
.hsub { font-size:11px; color:var(--ink-soft); }
.hspace { flex:1; }
.hbtn { border:1px solid var(--border); background:#fff; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--ink-mid); cursor:pointer; font-family:var(--font); white-space:nowrap; transition:all .15s; }
.hbtn:hover { border-color:var(--accent); color:var(--accent); }
main { flex:1; overflow-y:auto; }
.chatwrap { max-width:820px; margin:0 auto; padding:28px 20px 20px; display:flex; flex-direction:column; gap:22px; }
.empty { text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty .big { font-size:34px; margin-bottom:14px; }
.empty h3 { color:var(--ink); font-size:18px; margin-bottom:8px; font-weight:700; }
.empty p { font-size:13.5px; line-height:1.7; }
.sugs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
.sug { border:1px solid var(--border); background:#fff; border-radius:20px; padding:8px 14px; font-size:12.5px; color:var(--ink-mid); cursor:pointer; transition:all .15s; }
.sug:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.msg-u { align-self:flex-end; max-width:78%; background:var(--accent); color:#fff; padding:12px 16px; border-radius:16px 16px 4px 16px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
.msg-u .att { display:block; font-size:11.5px; opacity:.85; margin-top:6px; }
.msg-a { align-self:stretch; display:flex; gap:12px; }
.avatar { width:30px; height:30px; border-radius:8px; background:var(--accent); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
.bubble { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:4px 16px 16px 16px; padding:16px 20px; min-width:0; }
.atext { font-size:14.2px; line-height:1.75; word-break:break-word; }
.atext b { font-weight:700; }
.atext h4 { font-size:14.5px; margin:14px 0 6px; }
.cursor { display:inline-block; width:8px; height:16px; background:var(--accent); border-radius:2px; animation:blink 1s infinite; vertical-align:text-bottom; }
/* ─── 메모: 답변 옆 (넓은 화면) / 아래 (좁은 화면) ─── */
.msg-a { flex-wrap:wrap; }
.notes { width:232px; display:flex; flex-direction:column; gap:8px; align-self:flex-start; }
.notes:empty { display:none; }
.note { background:#fff8db; border:1px solid #f0dc8a; border-radius:10px; padding:9px 11px; font-size:12px; line-height:1.55; color:#3d3410; position:relative; }
.note .nq { font-size:11px; color:#8a7a2a; border-left:2px solid #e2c85a; padding-left:7px; margin-bottom:5px; white-space:pre-wrap; word-break:break-word; }
.note .nt { white-space:pre-wrap; word-break:break-word; }
.note .nx { position:absolute; top:5px; right:7px; border:0; background:none; color:#a8963c; cursor:pointer; font-size:12px; opacity:0; }
.note:hover .nx { opacity:1; }
.note .nm { font-size:10px; color:#a8963c; margin-top:5px; }
@media (max-width:1180px) { .notes { width:100%; margin-left:42px; } }
#memoBtn { position:absolute; z-index:60; display:none; border:0; background:var(--accent); color:#fff; font-size:13px; font-weight:700; padding:8px 14px; border-radius:9px; box-shadow:0 8px 24px rgba(47,107,255,.35); cursor:pointer; font-family:var(--font); }
#memoBtn:hover { background:var(--accent-hover, #2358e0); }
.memo-pop { position:absolute; z-index:61; width:min(340px, calc(100vw - 32px)); background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 40px rgba(16,24,40,.18); padding:12px; font-family:var(--font); }
.memo-pop .mq { font-size:11.5px; color:var(--ink-mid); background:#fff8db; border-left:2px solid #e2c85a; padding:6px 9px; border-radius:6px; margin-bottom:8px; max-height:72px; overflow:auto; white-space:pre-wrap; }
.memo-pop textarea { width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; font-family:var(--font); line-height:1.55; resize:vertical; min-height:64px; }
.memo-pop textarea:focus { outline:none; border-color:var(--accent); }
.memo-pop .row { display:flex; gap:6px; justify-content:flex-end; margin-top:8px; }
.memo-pop .row button { border:1px solid var(--border); background:#fff; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:var(--font); color:var(--ink-mid); }
.memo-pop .row button.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
/* 메모 모아보기 */
.memo-back { position:fixed; inset:0; z-index:200; background:rgba(26,29,35,.45); display:flex; align-items:center; justify-content:center; padding:20px; }
.memo-modal { background:#fff; border-radius:14px; width:min(720px,100%); max-height:88vh; overflow:auto; box-shadow:0 24px 70px rgba(16,24,40,.22); }
.memo-modal .mh { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:#fff; }
.memo-modal .mh h3 { font-size:15px; flex:1; }
.memo-modal .mb { padding:14px 20px; display:flex; flex-direction:column; gap:10px; }
.memo-modal .mi { border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:13px; }
.memo-modal .mi .k { font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
.memo-modal .mi .nq { font-size:12px; color:#8a7a2a; border-left:2px solid #e2c85a; padding-left:8px; margin:4px 0; white-space:pre-wrap; }
.memo-modal .mi .nt { white-space:pre-wrap; }
.memo-modal .mf { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; position:sticky; bottom:0; background:#fff; }
.memo-modal .mf button, .memo-modal .mh button { border:1px solid var(--border); background:#fff; border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font); color:var(--ink-mid); }
.memo-modal .mf button.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
@keyframes blink { 50% { opacity:.2; } }
</style>
</head>
<style>
.srcs { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
/* 롤모델 채널 리서치 — 어떤 채널의 실제 데이터를 보고 답했는지. 모든 계정에 보인다. */
.research { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:12px; font-size:11.5px; color:var(--ink-soft); }
.research .rlabel { font-weight:600; color:var(--ink-mid); }
.research a, .research span.ch { background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:3px 8px; color:var(--ink-mid); text-decoration:none; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.research a:hover { border-color:var(--accent); color:var(--accent); }
.research span.ch.miss { color:var(--ink-soft); border-style:dashed; }
.stat { font-size:12px; color:var(--ink-soft); margin-top:6px; }
.src { font-size:10.5px; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:3px 8px; color:var(--ink-soft); max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acts { display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); flex-wrap:wrap; }
.evid { margin-top:10px; border:1px solid var(--border); border-radius:10px; background:var(--bg); padding:10px 12px; font-size:12px; color:var(--ink-mid); }
.evid h5 { margin:8px 0 5px; font-size:11px; color:var(--ink-soft); letter-spacing:.3px; text-transform:uppercase; }
.evid h5:first-child { margin-top:0; }
.evid details { margin:3px 0; }
.evid summary { cursor:pointer; font-weight:600; color:var(--ink); list-style:none; }
.evid summary::before { content:'▸ '; color:var(--accent); }
.evid details[open] summary::before { content:'▾ '; }
.evid .snip { white-space:pre-wrap; margin:4px 0 6px 14px; line-height:1.6; color:var(--ink-mid); font-size:11.5px; border-left:2px solid var(--border); padding-left:8px; }
.evid .meta { font-weight:400; color:var(--ink-soft); font-size:11px; margin-left:4px; }
.evid .none { color:var(--ink-soft); }
.act { border:1px solid var(--border); background:#fff; border-radius:8px; padding:5px 12px; font-size:12px; font-weight:600; color:var(--ink-mid); cursor:pointer; font-family:var(--font); white-space:nowrap; transition:all .15s; }
.act:hover { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
/* 마우스를 올리면 작은 창으로 무엇을 하는 버튼인지 알려준다 (헷갈림 방지) */
.act[data-tip] { position:relative; }
.act[data-tip]::after { content:attr(data-tip); position:absolute; left:0; top:calc(100% + 8px); z-index:20;
  background:#1a1d23; color:#fff; font-size:12px; font-weight:500; line-height:1.5; padding:8px 11px; border-radius:8px;
  white-space:nowrap; box-shadow:0 8px 24px rgba(16,24,40,.18); opacity:0; transform:translateY(4px); pointer-events:none;
  transition:opacity .12s, transform .12s; }
.act[data-tip]::before { content:''; position:absolute; left:14px; top:calc(100% + 3px); border:5px solid transparent; border-bottom-color:#1a1d23;
  opacity:0; pointer-events:none; transition:opacity .12s; }
.act[data-tip]:hover::after, .act[data-tip]:hover::before { opacity:1; transform:none; transition-delay:.25s; }
.act:disabled[data-tip]::after, .act:disabled[data-tip]::before { display:none; }
.act:disabled { opacity:.55; cursor:default; }
footer { background:var(--panel); border-top:1px solid var(--border); padding:10px 16px 14px; }
.composer { max-width:820px; margin:0 auto; }
.chips { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
.chip-in { border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12px; font-family:var(--font); color:var(--ink); background:var(--bg); width:130px; }
.chip-in:focus { outline:none; border-color:var(--accent); background:#fff; }
.chip-sel { width:auto; padding-right:8px; }
.tstamp { display:block; font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right; }
.msg-u .tstamp { color:rgba(255,255,255,.7); }
select.chip-in { width:auto; cursor:pointer; }
.mode-tg { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.mode-tg button { border:0; background:var(--bg); padding:6px 11px; font-size:12px; font-family:var(--font); color:var(--ink-soft); cursor:pointer; font-weight:600; }
.mode-tg button.on { background:var(--accent); color:#fff; }
.attbtn { border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
.attbtn.has { border-color:var(--accent); background:var(--accent-soft); }
.att-label { font-size:11.5px; color:var(--accent); font-weight:600; display:none; align-items:center; gap:6px; }
.att-label .x { cursor:pointer; font-weight:800; }
.inrow { display:flex; gap:10px; align-items:flex-end; }
textarea#inp { flex:1; border:1.5px solid var(--border); border-radius:14px; padding:12px 16px; font-size:14px; font-family:var(--font); line-height:1.6; resize:none; max-height:180px; background:#fff; }
textarea#inp:focus { outline:none; border-color:var(--accent); }
#sendBtn { width:44px; height:44px; border-radius:12px; border:0; background:var(--accent); color:#fff; font-size:17px; cursor:pointer; transition:all .15s; flex-shrink:0; }
#sendBtn:disabled { background:#b9c6e8; cursor:default; }
.err { background:#fdf0ef; border:1px solid #f2c4bf; color:#c0392b; border-radius:10px; padding:10px 14px; font-size:12.5px; margin-top:8px; }
#pwGate { position:fixed; inset:0; z-index:9999; background:var(--bg); display:flex; align-items:center; justify-content:center; }
/* firebase.js 가 로그인 창을 채우기 전까지 잠깐 보이는 로딩 표시 */
.gate-loading { display:flex; flex-direction:column; align-items:center; gap:12px; color:var(--ink-soft); font-size:12.5px; }
.gate-loading .spin { width:22px; height:22px; border:2.5px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:gspin .8s linear infinite; }
@keyframes gspin { to { transform:rotate(360deg); } }
@media (max-width:640px) { .chip-in { width:104px; } .msg-u { max-width:88%; } .chatwrap { padding:18px 12px; } }
</style>
<body>
<div id="pwGate">
  <div class="gate-loading"><div class="spin"></div><div>Personalmakers AI · 로그인 준비 중</div></div>
</div>

<header>
  <span class="logo">Personalmakers AI</span>
  <div>
    <div class="htitle">피드백 어시스턴트</div>
    <div class="hsub">무엇이든 물어보세요 · 커밍쏜의 지식과 기준으로 답합니다</div>
  </div>
  <div class="hspace"></div>
  <button class="hbtn" onclick="newChat()">＋ 새 대화</button>
</header>

<main id="main">
  <div class="chatwrap" id="msgs">
    <div class="empty" id="empty">
      <div class="big">💬</div>
      <h3>무엇을 도와드릴까요?</h3>
      <p>수강생 미션 붙여넣기, 브랜딩 로드맵 점검, 운영 질문 —<br>커밍쏜의 코칭 기록과 팀 플레이북을 근거로 답변합니다.</p>
      <div class="sugs">
        <div class="sug" onclick="useSug(this)">수강생 로드맵 붙여넣고 피드백 받기</div>
        <div class="sug" onclick="useSug(this)">주제가 너무 넓다는데 어떻게 좁혀줘야 할까?</div>
        <div class="sug" onclick="useSug(this)">조회수가 안 나오는 수강생, 뭘 먼저 봐야 해?</div>
        <div class="sug" onclick="useSug(this)">수익화 시작 시점은 어떻게 판단해?</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <div class="chips">
      <input class="chip-in" id="stuName" placeholder="수강생 이름 (선택)">
      <select class="chip-in chip-sel" id="stuCohort" title="기수">
        <option value="5기">5기</option>
        <option value="6기" selected>6기</option>
        <option value="7기">7기</option>
      </select>
      <div class="mode-tg">
        <button id="mConv" class="on" onclick="setMode('conv')">구어체</button>
        <button id="mRep" onclick="setMode('report')">문어체</button>
      </div>
      <button class="attbtn" id="attBtn" title="워크시트 캡처 첨부 (OCR)" onclick="document.getElementById('file').click()">📎</button>
      <input type="file" id="file" accept="image/*" style="display:none" onchange="onFile(this)">
      <span class="att-label" id="attLabel"><span id="attName"></span><span class="x" onclick="clearAtt()">✕</span></span>
      <span style="flex:1"></span>
      <button class="attbtn" id="memoAll" type="button" title="이 대화의 메모를 한 곳에 모아 보기" onclick="openMemoAll()" style="display:none;font-size:12px;font-weight:600">📝 메모 0</button>
    </div>
    <div class="inrow">
      <textarea id="inp" rows="1" placeholder="무엇이든 물어보세요… (Shift+Enter 줄바꿈)"></textarea>
      <button id="sendBtn" onclick="send()">➤</button>
    </div>
  </div>
</footer>
<script src="/img-resize.js"></script>
<script type="module" src="/firebase.js"></script>
<script>
// ─── 접근 통제 ───────────────────────────────────────────────────────────────
// 비밀번호 게이트는 제거됐다. 구글 로그인 + 디렉터 화이트리스트를 firebase.js 가
// 담당한다. 게이트는 닫힌 채로 두고, 인증이 끝나야만 firebase.js 가 연다.
// (firebase.js 가 못 뜨면 게이트가 그대로 남아 아무도 못 들어간다 — 의도된 동작)
(function() {
  window.checkPW = function() {};   // 옛 onclick 핸들러 무력화
  var gate = document.querySelector('#pwGate, #pwOverlay');
  if (gate) gate.style.display = 'flex';
})();

// ─── State ───
var turns = [];   // {q, a}
var mode = 'conv';
var busy = false;
var ocrText = '';
var attMeta = null;   // { url, name } — Storage 에 올라간 워크시트 캡처본

function setMode(m) {
  mode = m;
  document.getElementById('mConv').classList.toggle('on', m === 'conv');
  document.getElementById('mRep').classList.toggle('on', m === 'report');
}
function useSug(el) { var t = document.getElementById('inp'); t.value = el.textContent; t.focus(); autoGrow(); }
function newChat() { turns = []; ocrText = ''; clearAtt(); localStorage.removeItem('pm_chat_v1'); renderAll(); }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function md(s) {
  var h = esc(s);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^### (.+)$/gm, '<h4>$1</h4>').replace(/^## (.+)$/gm, '<h4>$1</h4>');
  h = h.replace(/^---+$/gm, '<hr style="border:0;border-top:1px solid var(--border);margin:12px 0">');
  return h.replace(/\n/g, '<br>');
}
function autoGrow() { var t = document.getElementById('inp'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }
document.getElementById('inp').addEventListener('input', autoGrow);
document.getElementById('inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
function scrollBottom() { var m = document.getElementById('main'); m.scrollTop = m.scrollHeight; }

// ─── 이미지 첨부 (OCR) ───
function onFile(input) {
  var f = input.files[0];
  if (!f) return;
  (async function() {
    document.getElementById('attBtn').classList.add('has');
    document.getElementById('attLabel').style.display = 'inline-flex';
    document.getElementById('attName').textContent = '🖼 ' + f.name + ' 준비 중…';
    // Vercel 본문 한도(4.5MB) 때문에 큰 사진은 줄여서 보낸다. 글자 인식엔 영향 없음.
    var shrunk;
    try { shrunk = await window.pmShrinkImage(f); }
    catch (e) { document.getElementById('attName').textContent = '이미지를 읽을 수 없어요'; return; }
    var b64 = shrunk.base64, mediaType = shrunk.mediaType;
    document.getElementById('attName').textContent = '🖼 ' + f.name + ' 인식 중…';

    // 원본 캡처본은 Storage 에 보관 — OCR 과 동시에 진행해서 체감 속도를 유지한다.
    var uploading = window.PMFire
      ? window.PMFire.uploadImage(f, 'chat').catch(function(e) {
          console.warn('[PMFire] 이미지 업로드 실패(무시):', e.message); return null;
        })
      : Promise.resolve(null);

    try {
      var r = await fetch('/api/ocr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: b64, mediaType: mediaType }) });
      var d = await r.json();
      if (d.error) throw new Error(d.error);
      ocrText = d.text || '';
      document.getElementById('attName').textContent = '🖼 ' + f.name + ' ✓';
    } catch(e) {
      ocrText = '';
      document.getElementById('attName').textContent = '이미지 인식 실패';
    }

    var up = await uploading;
    if (up) attMeta = { url: up.url, name: f.name };
  })();
}
function clearAtt() {
  ocrText = '';
  attMeta = null;
  document.getElementById('file').value = '';
  document.getElementById('attBtn').classList.remove('has');
  document.getElementById('attLabel').style.display = 'none';
}
</script>
<script>

    turns.slice(-6).forEach(function(x) {
      extra += 'Q: ' + x.q.slice(0, 700) + '\nA: ' + (x.a || '').slice(0, 1400) + '\n---\n';
    });
  }

  var turn = { q: text || '워크시트 첨부', att: hadAtt, attUrl: (attMeta && attMeta.url) || '', attName: (attMeta && attMeta.name) || '', a: null, sources: [], evidence: null, ts: Date.now() };
  turns.push(turn);
  saveChat();   // 질문을 먼저 저장 — 답변 도중 탭이 닫혀도 질문은 남는다
  document.getElementById('msgs').appendChild(userBubble(turn.q, hadAtt, turn.attUrl, turn.attName, turn.ts));
  var b = aiBubble(); b.wrap._turn = turn;
  b.text.innerHTML = '<span class="cursor"></span>';
  scrollBottom();
  t.value = ''; autoGrow(); clearAtt();

  // 이어지는 질문("그럼 썸네일은요?")은 그 자체로 검색이 안 된다 — 직전 질문을 검색어에 붙인다.
  var prevQ = turns.length > 1 ? (turns[turns.length - 2].q || '').slice(0, 300) : '';
  var body = { question: question, chat: true, searchQuery: ((prevQ ? prevQ + ' ' : '') + (text || question)).slice(0, 1000), studentName: student, cohort: student ? cohortVal() : '', extraContext: extra, mode: mode, stream: true };
  if (turns.length > 1) body.contextQ = '1';

  try {
    var r = await fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var ct = r.headers.get('content-type') || '';
    if (ct.indexOf('text/event-stream') < 0) {
      var d = await r.json();
      if (d.error) throw new Error(d.error);
      turn.a = d.feedback || ''; turn.sources = d.sources || []; turn.evidence = d.evidence || null;
      b.text.innerHTML = md(turn.a); addActions(b, question, turn.a, turn.sources, turn.evidence);
    } else {
      var reader = r.body.getReader(); var dec = new TextDecoder();
      var buf = '', acc = '';
      while (true) {
        var x = await reader.read();
        if (x.done) break;
        buf += dec.decode(x.value, { stream: true });
        var evs = buf.split('\n\n'); buf = evs.pop();
        for (var i = 0; i < evs.length; i++) {
          var ev = '', data = '';
          var lines = evs[i].split('\n');
          for (var j = 0; j < lines.length; j++) {
            var l = lines[j];
            if (l.indexOf('event:') === 0) ev = l.slice(6).trim();
            else if (l.indexOf('data:') === 0) data += l.slice(5).trim();
          }
          if (!data) continue;
          var o; try { o = JSON.parse(data); } catch(e) { continue; }
          if (ev === 'meta') { turn.sources = o.sources || []; turn.evidence = o.evidence || null; }
          else if (ev === 'delta' && o.t) { acc += o.t; b.text.innerHTML = md(acc) + '<span class="cursor"></span>'; scrollBottom(); }
          else if (ev === 'status' && o.t) { b.text.innerHTML = md(acc) + '<span class="cursor"></span><div class="stat">' + o.t + '</div>'; scrollBottom(); }
          else if (ev === 'error') throw new Error(o.message || '스트리밍 오류');
        }
      }
      turn.a = acc;
      b.text.innerHTML = md(acc);
      addActions(b, question, acc, turn.sources, turn.evidence);
    }
    saveChat();
  } catch(e) {
    var ed = document.createElement('div'); ed.className = 'err'; ed.textContent = '⚠️ ' + e.message;
    b.bubble.appendChild(ed);
    b.text.innerHTML = b.text.innerHTML.replace('<span class="cursor"></span>', '');
    turns.pop();
    saveChat();
  }
  busy = false;
  document.getElementById('sendBtn').disabled = false;
  scrollBottom();
}

// ─── 자동 기록 (노션 히스토리) ───
(function() {
  var _f = window.fetch;
  function logH(p) { try { _f('/api/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) }); } catch(e) {} }
  window.fetch = function(url, opt) {
    var p = _f.apply(this, arguments);
    try {
      if (typeof url === 'string' && url.indexOf('/api/feedback') === 0 && opt && opt.method === 'POST') {
        var b = JSON.parse(opt.body || '{}');
        p = p.then(function(res) {
          try {
            var isFu = typeof b.contextQ !== 'undefined';
            var base = { student: b.studentName || '', cohort: b.cohort || '', missionType: b.missionType || '', mode: b.mode || '', type: isFu ? 'followup' : 'feedback', question: b.question || '' };
            var ct = (res.headers.get('content-type') || '');
            if (ct.indexOf('text/event-stream') >= 0) {
              var reader = res.clone().body.getReader(); var dec = new TextDecoder(); var buf = ''; var txt = '';
              (function pump() { reader.read().then(function(x) {
                if (x.done) { if (txt) logH(Object.assign({ answer: txt }, base)); return; }
                buf += dec.decode(x.value, { stream: true });
                var evs = buf.split('\n\n'); buf = evs.pop();
                for (var i = 0; i < evs.length; i++) {
                  var ev = '', data = '';
                  var lines = evs[i].split('\n');
                  for (var j = 0; j < lines.length; j++) { var l = lines[j]; if (l.indexOf('event:') === 0) ev = l.slice(6).trim(); else if (l.indexOf('data:') === 0) data += l.slice(5).trim(); }
                  if (ev === 'delta' && data) { try { var o = JSON.parse(data); if (o.t) txt += o.t; } catch(err) {} }
                }
                pump();
              }).catch(function() { if (txt) logH(Object.assign({ answer: txt }, base)); }); })();
            } else if (ct.indexOf('application/json') >= 0) {
              res.clone().json().then(function(d) { if (d && d.feedback) logH(Object.assign({ answer: d.feedback }, base)); }).catch(function() {});
            }
          } catch(e) {}
          return res;
        });
      }
    } catch(e) {}
    return p;
  };
})();

// ─── Init ───
EMPTY_HTML = document.getElementById('empty').outerHTML;
loadChat();
renderAll();
</script>

<script>
// ─── v2: 대화 목록 + 수강생별 세션 + 붙여넣기/드래그 ───
var convs = [], activeId = null;
function loadConvs() { try { convs = JSON.parse(localStorage.getItem('pm_convs_v2') || '[]'); } catch(e) { convs = []; } }
function persistConvs() { try { localStorage.setItem('pm_convs_v2', JSON.stringify(convs.slice(0, 60))); } catch(e) {} }
function activeConv() { return convs.find(function(c) { return c.id === activeId; }); }

saveChat = function() {
  var c = activeConv();
  if (!c) { c = { id: String(Date.now()), title: '', student: '', turns: [], ts: 0 }; convs.unshift(c); activeId = c.id; }
  c.turns = turns; c.ts = Date.now();
  c.student = document.getElementById('stuName').value.trim();
  c.cohort = cohortVal();
  try { localStorage.setItem('pm_cohort', c.cohort); } catch(e) {}
  if (!c.title && turns.length) c.title = turns[0].q.slice(0, 34);
  convs.sort(function(a, b) { return b.ts - a.ts; });
  persistConvs(); renderSide();
};
newChat = function() { turns = []; activeId = null; clearAtt(); document.getElementById('stuName').value = ''; renderAll(); renderSide(); document.body.classList.remove('side-open'); };
function openConv(id) {
  var c = convs.find(function(x) { return x.id === id; });
  if (!c) return;
  activeId = id; turns = c.turns || [];
  // 답변을 못 받은 질문(전송 중 닫힘)은 대화에서 빼고 입력창에 되돌려 놓는다.
  var pending = turns.filter(function(t) { return t.a == null; });
  if (pending.length) {
    turns = c.turns = turns.filter(function(t) { return t.a != null; });
    var last = pending[pending.length - 1], inp = document.getElementById('inp');
    if (inp && !inp.value.trim() && last.q && last.q !== '워크시트 첨부') { inp.value = last.q; if (typeof autoGrow === 'function') autoGrow(); }
    persistConvs();
  }
  document.getElementById('stuName').value = c.student || '';
  setCohort(c.cohort || localStorage.getItem('pm_cohort') || '6기');
  renderAll(); renderSide(); document.body.classList.remove('side-open');
}
function delConv(id, ev) {
  ev.stopPropagation();
  if (!confirm('이 대화를 삭제할까요?')) return;
  convs = convs.filter(function(c) { return c.id !== id; });
  if (activeId === id) { activeId = null; turns = []; renderAll(); }
  persistConvs(); renderSide();
}
function renderSide() {
  var list = document.getElementById('sList');
  if (!list) return;
  list.innerHTML = '';
  convs.forEach(function(c) {
    var d = document.createElement('div');
    d.className = 's-item' + (c.id === activeId ? ' on' : '');
    d.onclick = function() { openConv(c.id); };
    var t = document.createElement('span'); t.className = 't'; t.textContent = c.title || '새 대화'; d.appendChild(t);
    if (c.student) { var s = document.createElement('span'); s.className = 'stu'; s.textContent = c.student + (c.cohort ? ' · ' + c.cohort : ''); d.appendChild(s); }
    var x = document.createElement('span'); x.className = 'del'; x.textContent = '✕'; x.onclick = function(ev) { delConv(c.id, ev); }; d.appendChild(x);
    list.appendChild(d);
  });
}
// 사이드바 DOM 구성
(function() {
  var aside = document.createElement('aside'); aside.id = 'side';
  aside.innerHTML = '<button class="s-new" onclick="newChat()">＋ 새 대화</button><div class="s-head">대화 목록</div><div class="s-list" id="sList"></div>';
  document.body.appendChild(aside);
  document.body.classList.add('has-side');
  var tg = document.createElement('button'); tg.className = 'hbtn'; tg.id = 'sideTg'; tg.textContent = '☰';
  tg.onclick = function() { document.body.classList.toggle('side-open'); };
  var hdr = document.querySelector('header');
  hdr.insertBefore(tg, hdr.firstChild);
})();
// 이미지 붙여넣기 (Ctrl+V) + 드래그앤드롭
function handleImageFile(f) {
  if (!f || f.type.indexOf('image') !== 0) return;
  var dt = new DataTransfer(); dt.items.add(f);
  var input = document.getElementById('file');
  input.files = dt.files;
  onFile(input);
}
document.addEventListener('paste', function(e) {
  var items = (e.clipboardData || {}).items || [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') === 0) { handleImageFile(items[i].getAsFile()); e.preventDefault(); return; }
  }
});
document.addEventListener('dragover', function(e) { e.preventDefault(); document.body.classList.add('dragging'); });
document.addEventListener('dragleave', function(e) { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', function(e) {
  e.preventDefault(); document.body.classList.remove('dragging');
  var f = (e.dataTransfer.files || [])[0];
  handleImageFile(f);
});
// v2 init: 구버전 마이그레이션 + 최근 대화 열기
(function() {
  loadConvs();
  try {
    var old = JSON.parse(localStorage.getItem('pm_chat_v1') || '[]');
    if (old.length && !convs.length) { convs.push({ id: String(Date.now()), title: old[0].q.slice(0, 34), student: '', turns: old, ts: Date.now() }); persistConvs(); localStorage.removeItem('pm_chat_v1'); }
  } catch(e) {}
  try { setCohort(localStorage.getItem('pm_cohort') || '6기'); } catch(e) {}
  if (convs.length) { openConv(convs[0].id); } else { turns = []; renderAll(); renderSide(); }
})();

// ─── Firestore 동기화 ────────────────────────────────────────────────────────
// localStorage 는 즉시 렌더용 캐시, Firestore 가 진짜 저장소.
// 앱을 열 때마다 서버 유지보수를 조용히 돌린다. 실패해도 화면에는 아무 영향이 없다.
//   1) /api/backfill      — 승인됐지만 아직 검색 자산(벡터)으로 안 올라간 사례·Q&A·문서를 올린다. 누구나, 10분에 1회.
//   2) /api/distill?prereview=1 — (커밍쏜 로그인 때만) 초안 판단 카드를 녹취와 대조해 AI 가 사전 검수한다.
//      카드에 점수·판정·문제점이 붙는다(상태는 바꾸지 않음 — 승인은 커밍쏜만). 남은 게 없을 때까지 최대 30번 반복.
window.addEventListener('pmfire:ready', async function() {
  try { fetch('/api/backfill').catch(function() {}); } catch(e) {}
  try {
    if (!(window.PMFire && window.PMFire.isOwner && window.PMFire.isOwner())) return;
    if (sessionStorage.getItem('pm_prereview_done')) return;   // 탭당 한 번만
    var total = { reviewed: 0, approved: 0 };
    for (var i = 0; i < 30; i++) {
      var tok = await window.PMFire.idToken();
      var r = await fetch('/api/distill?prereview=1&docs=6', { headers: { Authorization: 'Bearer ' + tok } });
      var d = await r.json();
      var p = d && d.prereview; if (!p) break;
      total.reviewed += p.reviewed || 0; total.approved += p.approved || 0;
      console.info('[PMFire] AI 사전 검수:', JSON.stringify(p));
      if (!p.docs || p.remaining <= 0) break;
      await new Promise(function(ok) { setTimeout(ok, 1500); });
    }
    sessionStorage.setItem('pm_prereview_done', '1');
    if (total.approved) { var tok2 = await window.PMFire.idToken(); fetch('/api/distill?backfill=1', { headers: { Authorization: 'Bearer ' + tok2 } }).catch(function() {}); }
  } catch(e) { console.warn('[PMFire] 사전 검수 중단(무시):', e && e.message); }
});
// PMFire 가 없으면(설정 누락/네트워크 차단) 아래는 전부 no-op 이고 기존 동작 그대로다.
(function() {
  var _persist = persistConvs;
  var _saveChat = saveChat;
  var _delConv = delConv;
  var _openConv = openConv;
  var cloudBusy = false;

  function warn(e) { console.warn('[PMFire] 동기화 실패(로컬은 정상):', e && e.message ? e.message : e); }

  // 대화 메타 + 아직 안 올라간 턴을 Firestore 로 밀어 올린다.
  async function pushConv(c) {
    if (!window.PMFire || !c) return;
    await window.PMFire.saveConvMeta(c);
    var list = c.turns || [];
    // 마지막 동기화 지점부터. 직전 턴은 답변이 채워졌을 수 있어 한 칸 되돌려 다시 쓴다.
    var start = Math.max(0, Math.min(c._syncedUpTo || 0, list.length - 1));
    for (var i = start; i < list.length; i++) await window.PMFire.saveTurn(c.id, i, list[i]);
    c._syncedUpTo = list.length;
  }

  saveChat = function() {
    _saveChat();
    var c = activeConv();
    if (!window.PMFire || !c) return;
    pushConv(c).catch(warn);
  };

  delConv = function(id, ev) {
    var before = convs.length;
    _delConv(id, ev);
    if (window.PMFire && convs.length < before) window.PMFire.deleteConv(id).catch(warn);
  };

  // 클라우드에만 있는 대화는 turns 가 없다 — 열 때 그때 가져온다.
  openConv = function(id) {
    var c = convs.find(function(x) { return x.id === id; });
    if (!c) return;
    if (c.turns || !window.PMFire) return _openConv(id);
    activeId = id;
    turns = [];
    document.getElementById('stuName').value = c.student || '';
    document.getElementById('msgs').innerHTML = '<div class="msg-a"><div class="avatar">P</div><div class="bubble"><div class="atext">대화를 불러오는 중…</div></div></div>';
    renderSide();
    document.body.classList.remove('side-open');
    window.PMFire.loadTurns(id).then(function(t) {
      c.turns = t; c._syncedUpTo = t.length;
      if (activeId === id) { turns = t; renderAll(); }
      _persist();
    }).catch(function(e) { warn(e); c.turns = []; if (activeId === id) { turns = []; renderAll(); } });
  };

  // 최초 1회: 클라우드 목록과 로컬 목록을 합친다.
  async function syncOnce() {
    if (cloudBusy) return;
    cloudBusy = true;
    try {
      var remote = await window.PMFire.listConvs(60);
      var localById = {};
      convs.forEach(function(c) { localById[c.id] = c; });

      // 클라우드에만 있는 대화 → 목록에 추가 (turns 는 열 때 로드)
      remote.forEach(function(r) {
        var c = localById[r.id];
        if (!c) { convs.push({ id: r.id, title: r.title, student: r.student, cohort: r.cohort || '', ts: r.ts, turnCount: r.turnCount }); }
        else { c._syncedUpTo = c._syncedUpTo || r.turnCount || 0; if (r.ts > (c.ts || 0)) { c.title = r.title || c.title; c.student = r.student || c.student; c.cohort = r.cohort || c.cohort; c.ts = r.ts; } }
      });

      convs.sort(function(a, b) { return (b.ts || 0) - (a.ts || 0); });
      _persist();
      renderSide();

      // 로컬에만 있던 대화 → 클라우드로 올린다 (기존 사용자 마이그레이션)
      var remoteIds = {};
      remote.forEach(function(r) { remoteIds[r.id] = 1; });
      for (var i = 0; i < convs.length; i++) {
        var c = convs[i];
        if (!remoteIds[c.id] && c.turns && c.turns.length) { try { await pushConv(c); } catch(e) { warn(e); } }
      }
      _persist();

      // 새 기기: 열려 있는 대화의 턴이 아직 없거나 아무것도 안 열려 있으면 최신 대화를 연다.
      var cur = activeConv();
      if (activeId && cur && !cur.turns) openConv(activeId);
      else if (!activeId && convs.length) openConv(convs[0].id);
    } catch(e) { warn(e); }
    cloudBusy = false;
  }

  window.addEventListener('pmfire:ready', function() { syncOnce(); });
  if (window.PMFire) syncOnce();
})();
</script>

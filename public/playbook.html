<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>플레이북 · Personalmakers AI</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f9f7f4; --paper: #fff; --border: #ebe6dc; --border-dark: #d4cdc0;
  --ink: #1c1a17; --ink-mid: #4a4540; --ink-light: #9a9288;
  --accent: #c8622a; --accent-soft: #faf0ea; --accent-border: #e8c4a8;
  --warm-dark: #3d2e22; --ok: #2d7a4a; --ok-soft: #eaf5ee;
  --font: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  --serif: 'Noto Serif KR', Georgia, serif;
  --shadow: 0 2px 8px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.04);
}
body { background: var(--bg); color: var(--ink); font-family: var(--font); min-height: 100vh; }

/* ─── Gate (firebase.js 가 내용을 채운다) ─── */
#pwGate { position: fixed; inset: 0; z-index: 9999; background: #1c1a17;
  display: flex; align-items: center; justify-content: center; }

/* ─── Header ─── */
.header { background: var(--warm-dark); padding: 16px 28px; display: flex; align-items: center; gap: 14px; }
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-avatar { width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #e8885a); display: grid; place-items: center; font-size: 15px; }
.header-name { font-family: var(--serif); font-size: 16px; color: #f5f0e8; }
.header-sub { font-size: 10.5px; color: rgba(255,255,255,.42); margin-top: 1px; }
.header .spacer { flex: 1; }
.header a.home { color: rgba(255,255,255,.55); font-size: 11.5px; font-weight: 700;
  text-decoration: none; border: 1px solid rgba(255,255,255,.14); border-radius: 20px;
  padding: 5px 12px; }
.header a.home:hover { color: #e8a878; border-color: rgba(200,98,42,.5); }

/* ─── Layout ─── */
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 60px; }
.intro { margin-bottom: 18px; }
.intro h1 { font-family: var(--serif); font-size: 21px; letter-spacing: -.3px; margin-bottom: 6px; }
.intro p { font-size: 13px; color: var(--ink-mid); line-height: 1.7; }
.intro .hint { font-size: 12px; color: var(--ink-light); margin-top: 6px; }

/* ─── Toolbar ─── */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 7px 13px; border-radius: 18px; border: 1px solid var(--border);
  background: var(--paper); color: var(--ink-mid); font-family: var(--font);
  font-size: 12px; font-weight: 600; cursor: pointer; }
.tab:hover { border-color: var(--accent-border); }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab .n { opacity: .65; margin-left: 4px; font-size: 11px; }
.grow { flex: 1; }
.search { border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px;
  font-family: var(--font); font-size: 12.5px; width: 200px; background: var(--paper); color: var(--ink); }
.search:focus { outline: none; border-color: var(--accent); }
.pill.rate { background: #fdecea; color: #c0392b; border: 1px solid #f5c6c0; }
.pill.like { background: var(--ok-soft); color: var(--ok); }
.ev-row { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 13px; }
.ev-row .sc { display: inline-block; min-width: 34px; text-align: center; font-weight: 800; border-radius: 8px; padding: 2px 8px; margin-right: 8px; }
.sc5, .sc4 { background: #e8f5ec; color: #2d7a4a; } .sc3 { background: #fff4e0; color: #a86400; } .sc2, .sc1, .sc0 { background: #fdecea; color: #c0392b; }
.ev-row .rs { color: var(--ink-mid); margin: 6px 0; line-height: 1.6; }
.ev-row details { margin-top: 6px; font-size: 12.5px; } .ev-row summary { cursor: pointer; color: var(--ink-mid); }
.ev-row pre { white-space: pre-wrap; font-family: inherit; background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; line-height: 1.6; }
.ev-opts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
.mine { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-mid); white-space: nowrap; cursor: pointer; }
.mine input { accent-color: var(--accent); }
.btn { border: 0; border-radius: 9px; padding: 9px 15px; font-family: var(--font);
  font-size: 12.5px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #b8551f; }
.btn-ghost { background: var(--paper); border: 1px solid var(--border); color: var(--ink-mid); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-ok:hover:not(:disabled) { background: #24603a; }
.btn-danger { background: none; border: 1px solid var(--border); color: #b04a3c; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ─── List ─── */
.list { background: var(--paper); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: 1fr 150px 96px 92px 88px 72px;
  gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border);
  align-items: center; cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--bg); }
.row.head { background: var(--bg); font-size: 11px; font-weight: 700; color: var(--ink-light);
  letter-spacing: .4px; cursor: default; text-transform: uppercase; }
.row.head:hover { background: var(--bg); }
.q { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q .sub { display: block; font-size: 11.5px; font-weight: 400; color: var(--ink-light);
  margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell { font-size: 11.5px; color: var(--ink-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 3px 8px; white-space: nowrap; }
.st-대기 { background: #f0eee9; color: #7a746c; }
.st-답변작성 { background: #eaf0f8; color: #3b6699; }
.st-승인 { background: var(--ok-soft); color: var(--ok); }
.st-보류 { background: #fbeae7; color: #b04a3c; }
.st-자동기록 { background: #fdf4e3; color: #97731f; }
.cat { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
.empty { padding: 48px 20px; text-align: center; color: var(--ink-light); font-size: 13px; line-height: 1.8; }
.empty .icon { font-size: 30px; margin-bottom: 10px; }

/* ─── Editor ─── */
.back { position: fixed; inset: 0; z-index: 200; background: rgba(28,26,23,.5);
  display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--paper); border-radius: 14px; width: min(760px, 100%);
  max-height: 90vh; overflow: auto; box-shadow: 0 24px 70px rgba(0,0,0,.28); }
.modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--paper); z-index: 1; }
.modal-head h3 { font-family: var(--serif); font-size: 16px; flex: 1; }
.modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-light);
  margin-bottom: 6px; letter-spacing: .3px; }
.field label .req { color: var(--accent); }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px;
  font-family: var(--font); font-size: 13.5px; color: var(--ink); background: var(--bg); }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--accent); background: var(--paper); }
.field textarea { resize: vertical; line-height: 1.75; }
.field .help { font-size: 11px; color: var(--ink-light); margin-top: 5px; line-height: 1.6; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-foot { padding: 16px 22px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center; position: sticky; bottom: 0; background: var(--paper); }
.msg { font-size: 12px; min-height: 16px; }
.msg.err { color: #b04a3c; }
.msg.ok { color: var(--ok); }
.locked { background: var(--ok-soft); border: 1px solid #cfe6d8; border-radius: 9px;
  padding: 11px 13px; font-size: 12px; color: var(--ok); line-height: 1.6; }

@media (max-width: 820px) {
  .row { grid-template-columns: 1fr 80px; gap: 8px; }
  .row .hide-sm { display: none; }
  .two { grid-template-columns: 1fr; }
}
</style>
<link rel="stylesheet" href="/theme.css" />
</head>
<body>

<div id="pwGate"></div>

<header class="header">
  <div class="header-brand">
    <div class="header-avatar">📒</div>
    <div>
      <div class="header-name">플레이북</div>
      <div class="header-sub">팀 퍼스널메이커스 · Q&amp;A 자산</div>
    </div>
  </div>
  <div class="spacer"></div>
  <a class="home" href="/">← 코치로 돌아가기</a>
</header>

<div class="wrap">
  <div class="intro">
    <h1>디렉터가 쌓고, 커밍쏜이 승인합니다</h1>
    <p>수강생에게 받은 질문과 답변을 여기에 기록하세요. 커밍쏜이 검수해 <b>승인</b>하면 AI 피드백에 반영됩니다.</p>
    <p class="hint">승인된 Q&amp;A만 AI가 참고합니다 · 저장 후 5분 안에 반영</p>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="grow"></div>
    <select class="search" id="catFilter" title="카테고리"><option value="">카테고리 전체</option></select>
    <select class="search" id="coFilter" title="기수" style="width:auto"><option value="">기수 전체</option><option>5기</option><option>6기</option><option>7기</option></select>
    <label class="mine"><input type="checkbox" id="mineOnly"> 내 항목만</label>
    <input class="search" id="search" placeholder="질문·답변·수강생 검색" />
    <button class="btn btn-ghost" id="evalBtn" hidden title="승인 Q&A 로 AI 답변을 자동 채점합니다">🧪 자동 평가</button>
    <button class="btn btn-primary" id="newBtn">＋ 새 질문 등록</button>
  </div>

  <div class="list" id="list">
    <div class="empty"><div class="icon">📒</div>불러오는 중…</div>
  </div>
</div>

<script>
// ─── 접근 통제 ───────────────────────────────────────────────────────────────
// 구글 로그인 + 디렉터 화이트리스트를 firebase.js 가 담당한다.
// 게이트는 닫힌 채로 두고, 인증이 끝나야만 firebase.js 가 연다.
(function() {
  var gate = document.getElementById('pwGate');
  if (gate) gate.style.display = 'flex';
})();

var STATUSES = ['답변작성', '승인', '대기', '보류', '자동기록'];
var CATEGORIES = ['유튜브 브랜딩(로드맵)', '채널운영(콘텐츠관점)', '광고&협업(외부 상품)', '수익화(본인 상품)', '팀퍼메스운영'];

var rows = [];        // 플레이북 전체
var filter = '전체';
var keyword = '';
var catFilter = '';
var coFilter = '';
var mineOnly = false;
var editing = null;   // 편집 중인 행 (null 이면 새 항목)

function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function shortDate(ts) {
  if (!ts) return '';
  var d = new Date(ts); if (isNaN(d)) return '';
  return String(d.getFullYear()).slice(2) + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
}
function isAdmin() { return !!(window.PMFire && window.PMFire.isAdmin()); }

// ─── 목록 ───────────────────────────────────────────────────────────────────
function visible() {
  var kw = keyword.trim().toLowerCase();
  var me = (window.PMFire && window.PMFire.profile && window.PMFire.profile.nickname) || '';
  return rows.filter(function(r) {
    if (filter !== '전체' && (r.status || '') !== filter) return false;
    if (catFilter && (r.category || '') !== catFilter) return false;
    if (coFilter && (r.cohort || '') !== coFilter) return false;
    if (mineOnly && (r.director || '') !== me) return false;
    if (!kw) return true;
    return ((r.question || '') + ' ' + (r.originalQuestion || '') + ' ' +
            (r.answer || '') + ' ' + (r.student || '') + ' ' + (r.director || '')
           ).toLowerCase().indexOf(kw) >= 0;
  });
}

function renderTabs() {
  var counts = { 전체: rows.length };
  STATUSES.forEach(function(s) { counts[s] = 0; });
  rows.forEach(function(r) { if (counts[r.status] != null) counts[r.status]++; });

  var el = document.getElementById('tabs');
  el.innerHTML = '';
  ['전체'].concat(STATUSES).forEach(function(s) {
    var b = document.createElement('button');
    b.className = 'tab' + (filter === s ? ' on' : '');
    b.innerHTML = esc(s) + '<span class="n">' + (counts[s] || 0) + '</span>';
    b.onclick = function() { filter = s; render(); };
    el.appendChild(b);
  });
}

function renderList() {
  var el = document.getElementById('list');
  var list = visible().slice().sort(function(a, b) { return (b.updatedAtMs || b.createdAt || 0) - (a.updatedAtMs || a.createdAt || 0); });
  el.innerHTML = '';

  var head = document.createElement('div');
  head.className = 'row head';
  head.innerHTML = '<div>질문</div><div class="hide-sm">카테고리</div>' +
    '<div class="hide-sm">디렉터</div><div class="hide-sm">수강생</div><div>상태</div><div class="hide-sm">상담일</div>';
  el.appendChild(head);

  if (!list.length) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = rows.length
      ? '<div class="icon">🔍</div>조건에 맞는 항목이 없습니다.'
      : '<div class="icon">📒</div>아직 등록된 질문이 없습니다.<br>수강생에게 받은 질문과 답변을 남겨주세요.';
    el.appendChild(e);
    return;
  }

  list.forEach(function(r) {
    var d = document.createElement('div');
    d.className = 'row';
    d.onclick = function() { openEditor(r); };
    d.innerHTML =
      '<div class="q">' + (r.fromRating ? '<span class="pill rate" title="디렉터가 👎 를 눌러 올린 수정 후보">👎 아쉬움</span> ' : '') +
        (r.fromLike ? '<span class="pill like" title="디렉터가 👍 를 눌러 올린 승인 후보">👍 추천</span> ' : '') +
        esc(r.question || '(제목 없음)') +
        (r.originalQuestion && r.originalQuestion !== r.question ? '<span class="sub">' + esc(r.originalQuestion) + '</span>' : '') + '</div>' +
      '<div class="cell hide-sm">' + (r.category ? '<span class="pill cat">' + esc(r.category) + '</span>' : '') + '</div>' +
      '<div class="cell hide-sm">' + esc(r.director || '') + '</div>' +
      '<div class="cell hide-sm">' + esc(r.student || '') + (r.student && r.cohort ? ' <span class="pill" style="background:#f0f2f5;color:var(--ink-mid);font-size:10px;padding:2px 6px">' + esc(r.cohort) + '</span>' : '') + '</div>' +
      '<div><span class="pill st-' + esc(r.status || '대기') + '">' + esc(r.status || '대기') + '</span></div>' +
      '<div class="cell hide-sm" title="' + (r.consultDate ? '상담일 ' + esc(r.consultDate) + ' · ' : '') + '등록 ' + esc(shortDate(r.updatedAtMs || r.createdAt)) + '">' +
        esc(r.consultDate ? r.consultDate.slice(2).replace(/-/g, '.') : shortDate(r.updatedAtMs || r.createdAt)) + '</div>';
    el.appendChild(d);
  });
}

function render() { renderTabs(); renderList(); }

// ─── 편집기 ─────────────────────────────────────────────────────────────────
function openEditor(row) {
  editing = row || null;
  var r = row || { question: '', originalQuestion: '', answer: '', status: '답변작성',
                   category: '', student: '', director: (window.PMFire && window.PMFire.profile.nickname) || '' };
  var approved = r.status === '승인';
  var admin = isAdmin();
  var readOnly = approved && !admin;   // 승인된 항목은 커밍쏜만 수정 (규칙에서도 강제)

  var back = document.createElement('div');
  back.className = 'back';
  back.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head">' +
        '<h3>' + (row ? '질문 상세' : '새 질문 등록') + '</h3>' +
        '<span class="pill st-' + esc(r.status || '대기') + '">' + esc(r.status || '대기') + '</span>' +
        '<button class="btn btn-ghost" id="pbClose">닫기</button>' +
      '</div>' +
      '<div class="modal-body">' +
        (readOnly ? '<div class="locked">✅ 승인된 항목입니다. 이미 AI 피드백에 반영되고 있어요.<br>수정과 승인 해제는 커밍쏜만 할 수 있습니다.</div>' : '') +
        (r.fromRating ? '<div class="locked">👎 디렉터가 아쉬움을 표시한 AI 답변입니다. 아래 답변을 커밍쏜 기조로 고쳐 승인하면 다음부터 그 답이 반영됩니다.' +
          (r.ratingComment ? '<br><b>아쉬운 점:</b> ' + esc(r.ratingComment) : '') + '</div>' : '') +
        (r.fromLike ? '<div class="locked">👍 디렉터가 "좋다"고 올린 AI 답변입니다. 검수 후 승인하면 비슷한 질문에 이 기조가 반영됩니다.' +
          (r.likeNote ? '<br><b>좋았던 점:</b> ' + esc(r.likeNote) : '') + (r.director ? '<br><b>올린 디렉터:</b> ' + esc(r.director) : '') + '</div>' : '') +
        '<div class="field"><label>질문 <span class="req">*</span></label>' +
          '<input id="pbQ" maxlength="500" placeholder="예: 조회수가 잘 안 나와요, 뭐가 문제일까요"></div>' +
        '<div class="field"><label>원본 질문</label>' +
          '<textarea id="pbOQ" rows="2" placeholder="수강생이 실제로 한 표현 그대로 (보존용)"></textarea></div>' +
        '<div class="two">' +
          '<div class="field"><label>카테고리</label><select id="pbCat"></select></div>' +
          '<div class="field"><label>수강생</label><div style="display:flex;gap:8px"><input id="pbStu" maxlength="100" placeholder="선택" style="flex:1">' +
            '<select id="pbCo" style="width:84px"><option value="">기수</option><option>5기</option><option>6기</option><option>7기</option></select></div></div>' +
        '</div>' +
        '<div class="two">' +
          '<div class="field"><label>디렉터</label><div style="display:flex;gap:8px"><input id="pbDir" maxlength="50" style="flex:1">' +
            '<input id="pbDate" type="date" title="상담일 — 질문을 실제로 받은 날" style="width:150px"></div></div>' +
          '<div class="field"><label>상태</label><select id="pbSt"></select>' +
            '<div class="help" id="pbStHelp"></div></div>' +
        '</div>' +
        '<div class="field"><label>답변 <span class="req">*</span></label>' +
          '<textarea id="pbA" rows="12" placeholder="커밍쏜 관점으로 어떻게 답했는지 그대로 적어주세요."></textarea>' +
          '<div class="help">승인되면 이 답변이 AI 시스템 프롬프트에 그대로 들어갑니다.</div></div>' +
      '</div>' +
      '<div class="modal-foot">' +
        (row && admin ? '<button class="btn btn-danger" id="pbDel">삭제</button>' : '') +
        '<div class="msg" id="pbMsg"></div>' +
        '<div class="grow"></div>' +
        (admin && !approved ? '<button class="btn btn-ok" id="pbApprove">✅ 승인하기</button>' : '') +
        (admin && approved ? '<button class="btn btn-ghost" id="pbUnapprove">승인 해제</button>' : '') +
        '<button class="btn btn-primary" id="pbSave">저장</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(back);

  var $ = function(id) { return back.querySelector('#' + id); };
  var catSel = $('pbCat'), stSel = $('pbSt');
  catSel.innerHTML = '<option value="">(없음)</option>' +
    CATEGORIES.map(function(c) { return '<option>' + esc(c) + '</option>'; }).join('');
  // 일반 디렉터에게는 '승인' 선택지를 아예 주지 않는다. 규칙에서도 막힌다.
  stSel.innerHTML = STATUSES
    .filter(function(s) { return admin || s !== '승인'; })
    .map(function(s) { return '<option>' + esc(s) + '</option>'; }).join('');

  $('pbQ').value = r.question || '';
  $('pbOQ').value = r.originalQuestion || '';
  $('pbA').value = r.answer || '';
  catSel.value = r.category || '';
  $('pbStu').value = r.student || '';
  $('pbCo').value = r.cohort || (row ? '' : '6기');
  $('pbDate').value = r.consultDate || (row ? '' : new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10));
  $('pbDir').value = r.director || '';
  stSel.value = (!admin && r.status === '승인') ? '답변작성' : (r.status || '답변작성');
  $('pbStHelp').textContent = admin ? '' : '승인은 커밍쏜만 할 수 있습니다.';

  if (readOnly) {
    ['pbQ', 'pbOQ', 'pbA', 'pbStu', 'pbDir', 'pbCo', 'pbDate'].forEach(function(id) { $(id).disabled = true; });
    catSel.disabled = stSel.disabled = true;
    $('pbSave').disabled = true;
  }

  var close = function() { back.remove(); editing = null; };
  $('pbClose').onclick = close;
  back.onclick = function(e) { if (e.target === back) close(); };

  function collect(statusOverride) {
    return {
      question: $('pbQ').value, originalQuestion: $('pbOQ').value, answer: $('pbA').value,
      category: catSel.value, student: $('pbStu').value, cohort: $('pbCo').value, consultDate: $('pbDate').value, director: $('pbDir').value,
      status: statusOverride || stSel.value,
      type: (r.type || '수동등록'),
    };
  }

  async function save(statusOverride, btn) {
    var msg = $('pbMsg');
    msg.className = 'msg'; msg.textContent = '';
    var data = collect(statusOverride);
    if (!data.question.trim()) { msg.className = 'msg err'; msg.textContent = '질문을 입력해주세요'; return; }
    if (!data.answer.trim())   { msg.className = 'msg err'; msg.textContent = '답변을 입력해주세요'; return; }
    if (btn) btn.disabled = true;
    try {
      await window.PMFire.savePlaybook(editing && editing.id, data);
      close();
      await reload();
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = /permission|PERMISSION/i.test(e.message)
        ? '권한이 없습니다. 승인은 커밍쏜만 할 수 있어요.'
        : '저장 실패: ' + e.message;
      if (btn) btn.disabled = false;
    }
  }

  $('pbSave').onclick = function() { save(null, $('pbSave')); };
  if ($('pbApprove')) $('pbApprove').onclick = function() {
    if (!confirm('승인하면 이 Q&A가 AI 피드백에 반영됩니다. 진행할까요?')) return;
    save('승인', $('pbApprove'));
  };
  if ($('pbUnapprove')) $('pbUnapprove').onclick = function() {
    if (!confirm('승인을 해제하면 AI 참조에서 빠집니다. 진행할까요?')) return;
    save('답변작성', $('pbUnapprove'));
  };
  if ($('pbDel')) $('pbDel').onclick = async function() {
    if (!confirm('이 항목을 삭제할까요? 되돌릴 수 없습니다.')) return;
    try { await window.PMFire.deletePlaybook(editing.id); close(); await reload(); }
    catch (e) { $('pbMsg').className = 'msg err'; $('pbMsg').textContent = '삭제 실패: ' + e.message; }
  };

  $('pbQ').focus();
}

// ─── 로드 ───────────────────────────────────────────────────────────────────
async function reload() {
  try {
    rows = await window.PMFire.listPlaybook(300);
    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      '<div class="empty"><div class="icon">⚠️</div>불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
  }
}

document.getElementById('newBtn').onclick = function() {
  if (!window.PMFire) return;
  openEditor(null);
};
document.getElementById('search').addEventListener('input', function(e) {
  keyword = e.target.value; renderList();
});
(function() {
  var sel = document.getElementById('catFilter');
  CATEGORIES.forEach(function(c) { var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
  sel.addEventListener('change', function() { catFilter = sel.value; renderList(); });
  document.getElementById('coFilter').addEventListener('change', function(e) { coFilter = e.target.value; renderList(); });
  document.getElementById('mineOnly').addEventListener('change', function(e) { mineOnly = e.target.checked; renderList(); });
})();

// ─── 자동 평가 (커밍쏜 전용, /api/eval) ────────────────────────────────────
function scoreClass(n) { return 'sc sc' + Math.max(0, Math.min(5, Number(n) || 0)); }
function evalRowHtml(r) {
  return '<div class="ev-row">' +
    '<span class="' + scoreClass(r.score) + '">' + (r.score || '–') + '</span>' +
    '<b>' + esc(r.question || '') + '</b>' +
    '<span class="sub" style="display:inline;margin-left:8px;color:var(--ink-soft)">' + esc(r.verdict || '') +
      (r.skipPlaybook ? ' · 플레이북 제외' : '') + (r.createdAt ? ' · ' + new Date(r.createdAt).toLocaleString('ko-KR') : '') + '</span>' +
    '<div class="rs">' + esc(r.reason || '') + '</div>' +
    '<details><summary>AI 답변 / 승인 답변 보기</summary>' +
      '<div style="font-weight:700;margin-top:6px">AI 답변</div><pre>' + esc(r.actual || '(없음)') + '</pre>' +
      '<div style="font-weight:700">승인 답변</div><pre>' + esc(r.expected || '') + '</pre></details>' +
  '</div>';
}
async function evalApi(method, body) {
  var token = await window.PMFire.idToken();
  var res = await fetch('/api/eval', { method: method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
  var d = await res.json();
  if (!res.ok || d.error) throw new Error(d.error || ('HTTP ' + res.status));
  return d;
}
function openEval() {
  var back = document.createElement('div');
  back.className = 'back';
  back.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head"><h3>🧪 자동 평가</h3><button class="btn btn-ghost" id="evClose">닫기</button></div>' +
      '<div class="modal-body">' +
        '<div class="help" style="margin-bottom:10px">승인된 Q&amp;A 를 AI 에게 다시 묻고, 승인 답변의 기조·핵심을 지키는지 1~5점으로 채점합니다. ' +
          '<b>플레이북 제외</b>를 켜면 승인 답변을 프롬프트에서 빼고 답하게 해, 자료·지침만으로 기조가 나오는지 봅니다.</div>' +
        '<div class="ev-opts">' +
          '<label>건수 <select id="evN"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label>' +
          '<label class="mine"><input type="checkbox" id="evSkip"> 플레이북 제외</label>' +
          '<button class="btn btn-primary" id="evRun">실행</button>' +
          '<span class="msg" id="evMsg"></span>' +
        '</div>' +
        '<div id="evList"><div class="empty">불러오는 중…</div></div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(back);
  var $ = function(id) { return back.querySelector('#' + id); };
  var close = function() { back.remove(); };
  $('evClose').onclick = close;
  back.onclick = function(e) { if (e.target === back) close(); };

  function paint(list, head) {
    var el = $('evList');
    if (!list.length) { el.innerHTML = '<div class="empty">아직 평가 기록이 없습니다.</div>'; return; }
    el.innerHTML = (head || '') + list.map(evalRowHtml).join('');
  }
  async function loadPrev() {
    try { var d = await evalApi('GET'); paint(d.evals || []); }
    catch (e) { $('evList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
  }
  $('evRun').onclick = async function() {
    var btn = $('evRun'), msg = $('evMsg');
    btn.disabled = true; msg.className = 'msg ok'; msg.textContent = '평가 중… 건당 20~40초';
    try {
      var d = await evalApi('POST', { limit: Number($('evN').value), skipPlaybook: $('evSkip').checked });
      msg.textContent = '완료 · 평균 ' + d.avg + '점 (' + d.count + '건)';
      var prev = [];
      try { prev = (await evalApi('GET')).evals || []; } catch (e) {}
      paint(prev, '');
    } catch (e) { msg.className = 'msg err'; msg.textContent = '실패: ' + e.message; }
    btn.disabled = false;
  };
  loadPrev();
}
document.getElementById('evalBtn').onclick = openEval;
function showEvalBtn() { document.getElementById('evalBtn').hidden = !(window.PMFire && window.PMFire.isOwner && window.PMFire.isOwner()); }

window.addEventListener('pmfire:ready', function() { showEvalBtn(); reload(); });
if (window.PMFire) { showEvalBtn(); reload(); }
</script>

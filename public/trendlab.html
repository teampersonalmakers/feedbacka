}

function ChannelTab({apiKey}){
  const[mode,setMode]=useState("discover");
  const[query,setQuery]=useState("");
  const[channels,setChannels]=useState(()=>_restore("ct_channels",[]));
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[deepCh,setDeepCh]=useState(null);
  const[discoverChannels,setDiscoverChannels]=useState(()=>_restore("ct_discover",[]));
  const[discoverLoading,setDiscoverLoading]=useState(false);
  const[discoverErr,setDiscoverErr]=useState("");
  const[discoverStatus,setDiscoverStatus]=useState("");
  const[chSortBy,setChSortBy]=useState("relevance");

  /* ── 영속성: ChannelTab 상태 저장 ── */
  useEffect(()=>{if(discoverChannels.length)_persist("ct_discover",discoverChannels);},[discoverChannels]);
  useEffect(()=>{if(channels.length)_persist("ct_channels",channels);},[channels]);

  const search=async()=>{if(!query.trim())return;setLoading(true);setErr("");setChannels([]);try{const items=await ytSearch(query,apiKey,8,"channel");const ids=items.map(i=>i.id.channelId);if(!ids.length){setLoading(false);return;}const chs=await ytChs(ids,apiKey);setChannels(chs);}catch(e){setErr(cleanApiErr(e.message));}setLoading(false);};

  const discoverByTopic=async()=>{
    if(!query.trim())return;
    setDiscoverLoading(true);setDiscoverErr("");setDiscoverChannels([]);
    try{
      setDiscoverStatus("[1/4] 주제 관련 영상 검색 중...");
      const items=await ytSearch(query,apiKey,50,"video");
      if(!items.length){setDiscoverErr("검색 결과가 없습니다.");setDiscoverLoading(false);return;}

      const chMap={};
      items.forEach(it=>{
        const cid=it.snippet.channelId;const ctitle=it.snippet.channelTitle;
        if(!chMap[cid])chMap[cid]={id:cid,title:ctitle,videoCount:0,videoIds:[]};
        chMap[cid].videoCount++;
        if(it.id?.videoId)chMap[cid].videoIds.push(it.id.videoId);
      });
      const uniqueChs=Object.values(chMap);
      setDiscoverStatus(`[2/4] ${uniqueChs.length}개 채널 정보 수집 중...`);

      const chIds=uniqueChs.map(c=>c.id);
      const chDetails=[];
      for(let i=0;i<chIds.length;i+=50){
        const batch=chIds.slice(i,i+50);
        const chs=await ytChs(batch,apiKey);
        chDetails.push(...chs);
      }

      setDiscoverStatus(`[3/4] 채널별 최근 영상 분석 중...`);
      const enriched=[];
      for(let idx=0;idx<chDetails.length;idx++){
        const ch=chDetails[idx];
        const stats=ch.statistics||{};const subs=parseInt(stats.subscriberCount)||0;const totalViews=parseInt(stats.viewCount)||0;const vidCount=parseInt(stats.videoCount)||1;
        const info=chMap[ch.id]||{};

        let topVids=[];let avgViews=Math.round(totalViews/vidCount);let avgEng=0;let recentViews=0;
        if(idx<15){
          try{
            /* uploads 플레이리스트로 최근 영상 10개 조회 — search 100유닛 대신 playlistItems 1유닛 [API 절약] */
            const uploadsId=ch.contentDetails?.relatedPlaylists?.uploads||(String(ch.id).indexOf("UC")===0?"UU"+String(ch.id).slice(2):"");
            if(uploadsId){
              const pd=await ytFetchJson(`${YT}/playlistItems?part=contentDetails&playlistId=${uploadsId}&maxResults=10`,apiKey);
              const vIds=(pd.items||[]).map(i=>i.contentDetails?.videoId).filter(Boolean);
              if(vIds.length){
                const vd=await ytVids(vIds,apiKey);
                topVids=vd.map(v=>{
                  const views=parseInt(v.statistics?.viewCount)||0;const likes=parseInt(v.statistics?.likeCount)||0;const comments=parseInt(v.statistics?.commentCount)||0;
                  return{title:v.snippet.title,views,likes,comments,er:(views>0?((likes+comments)/views*100):0)};
                });
                avgViews=Math.round(topVids.reduce((a,v)=>a+v.views,0)/topVids.length);
                avgEng=topVids.length?parseFloat((topVids.reduce((a,v)=>a+v.er,0)/topVids.length).toFixed(2)):0;
                recentViews=topVids.reduce((a,v)=>a+v.views,0);
                /* 최근 영상 기준이므로 반응 좋은 순으로 정렬해 대표 영상 노출 */
                topVids.sort((a,b)=>b.views-a.views);
              }
            }
          }catch(e){}
        }

        const viralScore=subs>0?(avgViews/subs):0;
        enriched.push({
          id:ch.id,
          title:ch.snippet?.title||info.title,
          thumbnail:ch.snippet?.thumbnails?.medium?.url||ch.snippet?.thumbnails?.default?.url,
          description:ch.snippet?.description||"",
          subs,
          totalViews,
          videoCount:vidCount,
          avgViews,
          avgEng,
          recentViews,
          viralScore,
          topicRelevance:info.videoCount||0,
          topVids:topVids.slice(0,3),
          customUrl:ch.snippet?.customUrl||""
        });
        setDiscoverStatus(`[3/4] ${enriched.length}/${chDetails.length} 채널 분석 완료...`);
      }

      setDiscoverStatus(`[4/4] 정렬 중...`);
      enriched.sort((a,b)=>b.topicRelevance-a.topicRelevance||b.avgViews-a.avgViews);
      setDiscoverChannels(enriched);
    }catch(e){setDiscoverErr(cleanApiErr(e.message));}
    setDiscoverLoading(false);setDiscoverStatus("");
  };

  const sortedDiscover=useMemo(()=>{
    const list=[...discoverChannels];
    if(chSortBy==="relevance")list.sort((a,b)=>b.topicRelevance-a.topicRelevance||b.avgViews-a.avgViews);
    else if(chSortBy==="subs")list.sort((a,b)=>b.subs-a.subs);
    else if(chSortBy==="avgViews")list.sort((a,b)=>b.avgViews-a.avgViews);
    else if(chSortBy==="engagement")list.sort((a,b)=>b.avgEng-a.avgEng);
    else if(chSortBy==="viral")list.sort((a,b)=>b.viralScore-a.viralScore);
    return list;
  },[discoverChannels,chSortBy]);

  return(
    <div>
      <div style={{display:"flex",gap:4,marginBottom:14,background:"#F1F5F9",borderRadius:10,padding:3}}>
        {[{id:"discover",l:"주제별 채널 발굴",d:"키워드로 관련 채널 자동 발굴"},{id:"direct",l:"채널명 검색",d:"채널명으로 직접 검색"}].map(m=>(
          <button key={m.id} onClick={()=>setMode(m.id)} style={{flex:1,padding:"9px 14px",borderRadius:8,border:"none",background:mode===m.id?"#fff":"transparent",color:mode===m.id?"#1B3EC3":"#64748B",fontWeight:mode===m.id?700:500,fontSize:12,cursor:"pointer",boxShadow:mode===m.id?"0 1px 3px rgba(0,0,0,.08)":"none",transition:"all .2s"}}>{m.l}</button>
        ))}
      </div>

      {mode==="discover"?(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:20}}>
            <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&discoverByTopic()} placeholder="주제/키워드 입력 (예: 재테크, 요리, 운동, AI)" style={{flex:1,background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"11px 14px",color:"#1E293B",fontSize:13,outline:"none"}}/>
            <button onClick={discoverByTopic} style={{background:"#1B3EC3",border:"none",borderRadius:8,padding:"11px 22px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>발굴</button>
          </div>
          {discoverLoading&&(
            <div>
              {discoverStatus&&<div style={{textAlign:"center",color:"#64748B",fontSize:12,marginBottom:10}}>{discoverStatus}</div>}
              <Dots text="채널 발굴 중..."/>
            </div>
          )}
          {discoverErr&&<ErrBox msg={discoverErr}/>}
          {sortedDiscover.length>0&&(
            <div>
              <div style={{display:"flex",gap:8,marginBottom:12,overflowX:"auto",paddingBottom:4}}>
                {[{k:"relevance",l:"관련도"},{k:"subs",l:"구독자"},{k:"avgViews",l:"평균조회"},{k:"engagement",l:"반응도"},{k:"viral",l:"바이럴"}].map(opt=>(
                  <button key={opt.k} onClick={()=>setChSortBy(opt.k)} style={{padding:"6px 12px",borderRadius:6,border:chSortBy===opt.k?"2px solid #1B3EC3":"1px solid #E2E8F0",background:chSortBy===opt.k?"#EFF6FF":"#fff",color:chSortBy===opt.k?"#1B3EC3":"#64748B",fontWeight:chSortBy===opt.k?600:500,fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>{opt.l}</button>
                ))}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {sortedDiscover.map((ch)=>(

                          {ch.topVids.map((v,i)=>(
                            <div key={i} style={{color:"#78350F",fontSize:10,marginBottom:i<ch.topVids.length-1?3:0}}>{i+1}. "{v.title.slice(0,35)}..." ({fmtN(v.views)}회)</div>
                          ))}

                      )}
                      <div style={{textAlign:"center",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:6,padding:"7px 0",color:"#1B3EC3",fontSize:11,fontWeight:600}}>심층 분석 보기</div>
                    </div>
                    <a href={`https://www.youtube.com/channel/${ch.id}`} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{display:"block",textAlign:"center",background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:6,padding:"7px 0",color:"#DC2626",fontSize:11,marginTop:6,fontWeight:500}}>YouTube</a>

      ):(

            <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()} placeholder="채널 검색 (예: 재테크, 요리, 게임)" style={{flex:1,background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"11px 14px",color:"#1E293B",fontSize:13,outline:"none"}}/>
            <button onClick={search} style={{background:"#1B3EC3",border:"none",borderRadius:8,padding:"11px 22px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>검색</button>

                      <div style={{flex:1,minWidth:0}}>

                        <div key={s.l} style={{background:"#F8FAFC",borderRadius:6,padding:"7px 8px"}}>
                          <div style={{color:"#94A3B8",fontSize:9}}>{s.l}</div>

                    <div style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5}}>채널 영향력</span><span style={{color:"#1B3EC3",fontSize:10,fontFamily:"monospace"}}>{vs}</span></div><Bar value={vs} color="#3B82F6"/></div>
                    <div style={{textAlign:"center",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:6,padding:"7px 0",color:"#1B3EC3",fontSize:12,fontWeight:600}}>클릭하여 심층 분석 보기</div>
                    </div>

}

/* ── 키워드 탭 ── */
function RelatedKeywords({videos,query,apiKey}){
  const[data,setData]=useState(null);const[loading,setLoading]=useState(false);const[err,setErr]=useState("");
  const TC={"상승":"#059669","유지":"#D97706","하락":"#DC2626"};
  const VC={"상":"#1B3EC3","중":"#D97706","하":"#94A3B8"};
  const analyze=async()=>{if(!videos.length||!query)return;setLoading(true);setErr("");setData(null);try{
    /* 1. 영상 태그 수집 */
    const vIds=videos.slice(0,30).map(v=>v.videoId);
    const vFull=await ytVids(vIds,apiKey);
    const allTags=[];vFull.forEach(v=>{(v.snippet?.tags||[]).forEach(t=>allTags.push(t.toLowerCase()));});
    const tagCount={};allTags.forEach(t=>{tagCount[t]=(tagCount[t]||0)+1;});
    const topTags=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,40).map(([t,c])=>`${t}(${c})`);
    /* 2. 상위 채널들의 다른 인기 영상 주제 수집 */
    const chIds=[...new Set(videos.slice(0,20).map(v=>v.channelId))].slice(0,8);
    const otherTopics=[];
    for(const cid of chIds){try{
      const chItems=await ytSearch("",apiKey,8,"video","",{channelId:cid,order:"viewCount"});
      (chItems||[]).forEach(v=>{const t=v.snippet?.title||"";if(!t.toLowerCase().includes(query.toLowerCase()))otherTopics.push(t);});
    }catch(e){}}
    /* 3. 기본 통계 */
    const avgV=videos.length?Math.round(videos.reduce((s,v)=>s+v.views,0)/videos.length):0;
    const avgER=videos.length?(videos.reduce((s,v)=>s+parseFloat(v.engagementRate||0),0)/videos.length).toFixed(2):"0";
    const freshRatio=videos.length?Math.round(videos.filter(v=>v.uploadDays<14).length/videos.length*100):0;
    /* 4. Gemini 종합 분석 */
    const res=await gemini(`YouTube "${query}" 소재 분석 요청.\n\n[영상 태그 빈도 TOP 40]\n${topTags.join(", ")}\n\n[같은 채널의 다른 인기 영상 제목]\n${otherTopics.slice(0,20).join(" | ")}\n\n[검색 영상 제목 TOP 15]\n${videos.slice(0,15).map(v=>v.title).join(" | ")}\n\n[데이터] 영상${videos.length}개, 평균조회${fmtN(avgV)}, 평균반응도${avgER}%, 2주내비율${freshRatio}%\n\n위 태그·채널·제목 데이터를 분석해서, "${query}" 소재에 관심 있는 시청자가 함께 관심을 가질 연관 소재 키워드를 추천해줘.\n\nJSON만 반환:{"keywordDifficulty":"상|중|하","opportunity":0~100,"opportunityReason":"한줄","marketSaturation":"포화|적정|블루오션","blueOcean":"소채널진입틈새전략2줄","audienceKeywords":[{"keyword":"키워드","relation":"이소재와의연결고리한줄","searchVolume":"상|중|하","competition":"높음|보통|낮음","trend":"상승|유지|하락","score":0~100,"source":"태그분석|채널교차|제목패턴"}],"contentIdeas":["영상제목아이디어"]}\naudienceKeywords 15개(실제태그데이터와채널데이터기반으로, 억지추천X), contentIdeas 10개`,apiKey);
    setData({...res,avgViews:avgV,avgER,freshRatio,tagCount:topTags.length,channelsCrawled:chIds.length,otherTopicCount:otherTopics.length});
  }catch(e){setErr(cleanApiErr(e.message));}setLoading(false);};
  useEffect(()=>{if(videos.length&&query&&!data&&!loading)analyze();},[videos,query]);
  if(loading)return <Dots text={`"${query}" 연관 키워드 분석 중... (태그 수집 → 채널 교차 → AI 종합)`}/>;
  if(err)return <ErrBox msg={err}/>;
  if(!data)return <div style={{color:"#94A3B8",textAlign:"center",padding:20,fontSize:13}}>검색 후 자동 분석됩니다</div>;
  return(
    <div>
      <div style={{color:"#64748B",fontSize:11,marginBottom:10}}>태그 {data.tagCount}개 수집 · 채널 {data.channelsCrawled}개 교차분석 · 인접소재 {data.otherTopicCount}건 참조</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
        {(()=>{const dc=data.keywordDifficulty==="상"?"#DC2626":data.keywordDifficulty==="중"?"#D97706":"#059669";const mc=data.marketSaturation==="포화"?"#DC2626":data.marketSaturation==="적정"?"#D97706":"#059669";const oc=(data.opportunity||0)>=70?"#059669":(data.opportunity||0)>=40?"#D97706":"#DC2626";return[
          {l:"키워드 난이도",v:data.keywordDifficulty||"-",c:dc},{l:"시장 포화도",v:data.marketSaturation||"-",c:mc},{l:"기회 점수",v:(data.opportunity||0)+"/100",c:oc},{l:"평균 조회수",v:fmtN(data.avgViews),c:"#1B3EC3"}
        ];})().map(s=>(
          <div key={s.l} style={{textAlign:"center",padding:"10px 8px",background:s.c+"10",border:`1px solid ${s.c}30`,borderRadius:10}}>
            <div style={{color:"#94A3B8",fontSize:10,marginBottom:4}}>{s.l}</div>
            <div style={{color:s.c,fontWeight:800,fontSize:16}}>{s.v}</div>
          </div>
        ))}
      </div>
      {data.opportunityReason&&<div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:8,padding:"8px 14px",color:"#166534",fontSize:12,marginBottom:10}}>{data.opportunityReason}</div>}
      {data.blueOcean&&<div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:"8px 14px",color:"#1E40AF",fontSize:12,marginBottom:14}}>소채널 진입 전략: {data.blueOcean}</div>}
      <div style={{display:"grid",gridTemplateColumns:"3fr 2fr",gap:14}}>
        <div>
          <div style={{color:"#64748B",fontSize:11,marginBottom:10,fontWeight:600}}>시청자 관심 연관 키워드 {data.audienceKeywords?.length||0}개</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {data.audienceKeywords?.map((kw,i)=>(
              <div key={i} style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"10px 12px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                  <span style={{color:"#0F172A",fontSize:13,fontWeight:600,flex:1}}>{kw.keyword}</span>
                  <span style={{fontSize:9,padding:"2px 6px",borderRadius:10,background:kw.source==="태그분석"?"#DBEAFE":kw.source==="채널교차"?"#F5F8FF":"#FEF3C7",color:kw.source==="태그분석"?"#1B3EC3":kw.source==="채널교차"?"#1D4ED8":"#D97706"}}>{kw.source}</span>
                  <span style={{color:VC[kw.searchVolume],fontSize:10}}>검색 {kw.searchVolume}</span>
                  <span style={{color:TC[kw.trend],fontSize:13,fontWeight:700}}>{kw.trend==="상승"?"↑":kw.trend==="하락"?"↓":"→"}</span>
                  <span style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5}}>경쟁 {kw.competition}</span>
                  <div style={{minWidth:45,textAlign:"right"}}><span style={{color:"#1B3EC3",fontFamily:"monospace",fontSize:11}}>{kw.score}</span></div>
                </div>
                <div style={{color:"#64748B",fontSize:11,lineHeight:1.4}}>↳ {kw.relation}</div>
              </div>
            ))}
          </div>
        </div>
        <div>
          <div style={{color:"#64748B",fontSize:11,marginBottom:10,fontWeight:600}}>콘텐츠 아이디어</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {data.contentIdeas?.map((idea,i)=>(
              <div key={i} style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:7,padding:"9px 12px",display:"flex",alignItems:"center",gap:8}}>
                <span style={{color:"#1D4ED8",fontFamily:"monospace",fontSize:10,flexShrink:0}}>{String(i+1).padStart(2,"0")}</span>
                <span style={{color:"#1E293B",fontSize:12,flex:1,lineHeight:1.4}}>{idea}</span>
                <CopyBtn text={idea}/>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Feature 4: 내 채널 성장 트래커 + 전략 분석 ── */
/* ── Google 연동 카드 - YouTube Analytics 실측 데이터 ── */
function OAuthCard(){
  const[clientId,setClientId]=useState(()=>_oauth.clientId||"");
  const[connected,setConnected]=useState(()=>oauthReady());
  const[busy,setBusy]=useState(false);
  const[oErr,setOErr]=useState("");
  const[guideOpen,setGuideOpen]=useState(false);
  const isFile=oauthIsFile();
  const saveClientId=v=>{setClientId(v);_oauth.clientId=v;try{localStorage.setItem("oauth_client_id",v);}catch(e){}};
  const doLogin=async()=>{
    if(busy||isFile)return;
    setBusy(true);setOErr("");
    try{await oauthLogin(clientId.trim());setConnected(true);}
    catch(e){setOErr(e.message||"로그인에 실패했습니다");}
    setBusy(false);
  };
  const doLogout=()=>{oauthLogout();setConnected(false);};
  if(connected)return(
    <Card style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:28,height:28,background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{width:8,height:8,borderRadius:"50%",background:"#059669",display:"block"}}/></div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:13,color:"#059669"}}>연동됨 — 실측 데이터 사용 가능</div>
          <div style={{fontSize:11,color:"#94A3B8"}}>영상을 클릭하면 YouTube Analytics 실측 일별 조회수·시청시간이 표시됩니다</div>
        </div>
        <button onClick={doLogout} style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:"7px 14px",color:"#64748B",cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>로그아웃</button>
      </div>
    </Card>
  );
  return(
    <Card style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <div style={{width:28,height:28,background:"linear-gradient(135deg,#0A1F75,#1A3BC0)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{width:8,height:8,borderRadius:"50%",background:"#fff",display:"block"}}/></div>
        <div><div style={{fontWeight:700,fontSize:13,color:"#0F172A"}}>실측 데이터 연동</div>
        <div style={{fontSize:11,color:"#94A3B8"}}>Google 계정으로 로그인하면 추정치가 아닌 실제 일별 조회수·시청시간을 볼 수 있습니다</div></div>
      </div>
      {isFile?(
        <div style={{background:"#FFF7ED",border:"1px solid #FDBA74",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#EA580C",lineHeight:1.6}}>Google 로그인은 https 주소에서만 작동합니다. 배포된 주소에서 열면 이 기능을 사용할 수 있습니다.</div>
      ):(
        <>
          <div style={{display:"flex",gap:8}}>
            <input value={clientId} onChange={e=>saveClientId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()} placeholder="OAuth 클라이언트 ID (xxxx.apps.googleusercontent.com)" style={{flex:1,border:"1px solid #E2E8F0",borderRadius:8,padding:"9px 12px",fontSize:12,outline:"none",background:"#F8FAFC",color:"#1E293B"}}/>
            <button onClick={doLogin} disabled={busy||!clientId.trim()} style={{background:busy||!clientId.trim()?"#E2E8F0":"linear-gradient(135deg,#0A1F75,#1A3BC0)",color:busy||!clientId.trim()?"#94A3B8":"#fff",border:"none",borderRadius:8,padding:"9px 16px",cursor:busy||!clientId.trim()?"not-allowed":"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>{busy?"연결 중...":"Google 로그인"}</button>
          </div>
          {oErr&&<div style={{marginTop:8,background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:"8px 12px",fontSize:11,color:"#DC2626"}}>{oErr}</div>}
          <button onClick={()=>setGuideOpen(!guideOpen)} style={{marginTop:8,background:"none",border:"none",color:"#1B3EC3",fontSize:11,cursor:"pointer",padding:0,fontWeight:600}}>{guideOpen?"▾":"▸"} 클라이언트 ID 발급 방법</button>
          {guideOpen&&<div style={{marginTop:6,background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:"10px 14px",fontSize:11,color:"#64748B",lineHeight:1.9}}>
            <div>[1] Google Cloud Console → API 및 서비스 → 사용자 인증 정보</div>
            <div>[2] OAuth 클라이언트 ID 만들기 → 유형: 웹 애플리케이션</div>
            <div>[3] 승인된 JavaScript 원본에 이 앱의 https 주소 추가</div>
            <div>[4] API 라이브러리에서 YouTube Analytics API 사용 설정</div>
            <div>[5] OAuth 동의 화면 → 테스트 사용자에 본인 Google 계정 추가</div>
          </div>}
        </>
      )}
    </Card>
  );
}

/* 니즈 기반 소재 추천 — 내 채널 데이터 + 시청자 댓글로 지금 수요 있는 소재 도출 */
function TopicNeedsCard({channelData,topVideos,recentVideos,apiKey}){
  const[needs,setNeeds]=useState(null);
  const[loading,setLoading]=useState(false);
  const run=async()=>{
    if(loading||!topVideos.length)return;
    setLoading(true);setNeeds(null);
    try{
      const topInfo=topVideos.slice(0,10).map((v,i)=>`${i+1}. "${v.title}" 조회 ${fmtN(v.views)}`).join("\n");
      const recentInfo=recentVideos.slice(0,10).map((v,i)=>`${i+1}. "${v.title}" 조회 ${fmtN(v.views)} (${v.uploadDays}일 전)`).join("\n");
      /* 최근 영상 3개의 댓글에서 시청자 니즈 신호 수집 — 댓글 비활성 영상은 건너뜀 */
      let commentBlock="";
      const targets=recentVideos.slice(0,3);
      for(const v of targets){
        const cs=(await ytComments(v.videoId,getKey()||apiKey,50)).slice(0,12);
        if(cs.length)commentBlock+=`영상 "${v.title.slice(0,40)}" 댓글:\n${cs.join("\n")}\n\n`;
      }
      const prompt=`유튜브 채널 "${channelData?.title||""}"(구독자 ${fmtN(channelData?.subs||0)})의 다음 콘텐츠 소재를 기획해줘.\n\n[검증된 인기 영상 — 이 채널의 강점]\n${topInfo}\n\n[최근 영상 성과]\n${recentInfo}\n\n${commentBlock?`[시청자 실제 댓글 — 니즈 신호]\n${commentBlock}`:""}\n위 데이터를 근거로, 지금 이 채널의 시청자들이 실제로 필요로 하는 소재 5개를 추천해줘. 막연한 아이디어가 아니라 데이터에서 근거를 찾아서. JSON:{"audienceNeeds":["댓글과 성과 데이터에서 발견한 시청자 니즈 3가지"],"topics":[{"topic":"소재명","whyNow":"왜 지금 이 소재에 수요가 있는지 — 근거 포함","fitReason":"이 채널이 만들면 잘 되는 이유","format":"숏폼|미드폼|롱폼","titles":["제목안1","제목안2"],"hook":"첫 15초 훅 아이디어"}],"note":"종합 코멘트 2-3문장"}`;
      const res=await gemini(prompt,apiKey);
      setNeeds(res);
    }catch(e){setNeeds({_error:true,_msg:e.message});}
    setLoading(false);
  };
  return(
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:needs||loading?14:0,flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:2}}>니즈 기반 소재 추천</div>
          <div style={{fontSize:11,color:"#8A94A6"}}>인기·최신 영상 성과와 시청자 댓글에서 지금 수요 있는 소재를 찾습니다</div>
        </div>
        <button onClick={run} disabled={loading||!topVideos.length} style={{background:loading?"#F1F5F9":"#1B3EC3",border:"none",borderRadius:10,padding:"9px 18px",color:loading?"#94A3B8":"#fff",fontWeight:600,cursor:loading||!topVideos.length?"not-allowed":"pointer",fontSize:12}}>{loading?"분석 중...":"소재 추천 받기"}</button>
      </div>
      {loading&&<Dots text="시청자 니즈 분석 중..."/>}
      {needs?._error&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:10,padding:12,color:"#DC2626",fontSize:12}}>{needs._msg}</div>}
      {needs&&!needs._error&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        {needs.audienceNeeds&&<div style={{background:"#F8FAFC",border:"1px solid #EEF2F8",borderRadius:10,padding:12}}>
          <div style={{fontSize:10,fontWeight:600,color:"#8A94A6",letterSpacing:.5,marginBottom:8}}>발견된 시청자 니즈</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {needs.audienceNeeds.map((n,i)=><span key={i} style={{background:"#EFF6FF",color:"#1B3EC3",fontSize:11,padding:"5px 12px",borderRadius:14,fontWeight:500}}>{n}</span>)}
          </div>
        </div>}
        {(needs.topics||[]).map((t,i)=>(
          <div key={i} style={{border:"1px solid #EEF2F8",borderRadius:12,padding:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>

                <span style={{fontSize:13,fontWeight:700,color:"#0F172A"}}>{t.topic}</span>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                {t.format&&<span style={{fontSize:10,fontWeight:600,color:"#475569",background:"#F1F5F9",borderRadius:6,padding:"3px 8px"}}>{t.format}</span>}

            {t.fitReason&&<div style={{fontSize:11,color:"#334155",lineHeight:1.6,marginBottom:8}}><span style={{fontWeight:600,color:"#1B3EC3"}}>채널 적합성 — </span>{t.fitReason}</div>}
            {t.titles&&<div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:t.hook?8:0}}>
              {t.titles.map((title,j)=>(
                <div key={j} style={{display:"flex",alignItems:"center",gap:8,background:"#F8FAFC",borderRadius:8,padding:"7px 10px"}}>
                  <span style={{fontSize:11,color:"#0F172A",flex:1,fontWeight:500}}>{title}</span>
                  <CopyBtn text={title}/>
                </div>
              ))}
            </div>}
            {t.hook&&<div style={{fontSize:11,color:"#64748B",lineHeight:1.5}}><span style={{fontWeight:600,color:"#475569"}}>훅 — </span>{t.hook}</div>}
          </div>
        ))}
        {needs.note&&<div style={{background:"#F8FAFC",border:"1px solid #EEF2F8",borderRadius:10,padding:12,fontSize:11,color:"#475569",lineHeight:1.6}}>{needs.note}</div>}
        <div style={{fontSize:10,color:"#8A94A6"}}>추천 소재는 트렌드 소재 탭에서 검색해 모멘텀·경쟁 상황을 검증한 뒤 진행하는 것을 권장합니다</div>
      </div>}
      {!topVideos.length&&!loading&&!needs&&<div style={{fontSize:11,color:"#8A94A6",marginTop:8}}>채널 현황 탭에서 영상 데이터를 먼저 로드해주세요</div>}
    </Card>
  );
}

function MyChannelTab({apiKey}){
  const[channelHandle,setChannelHandle]=useState(()=>_restore("mychannel_handle",""));
  const[channelData,setChannelData]=useState(()=>_restore("mychannel_data",null));
  const[snapshots,setSnapshots]=useState(()=>_restore("mychannel_snapshots",[]));
  const[topVideos,setTopVideos]=useState(()=>_restore("mychannel_topvids",[]));
  const[recentVideos,setRecentVideos]=useState(()=>_restore("mychannel_recentvids",[]));
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[searchInput,setSearchInput]=useState("");
  const[strategy,setStrategy]=useState(null);
  const[stratLoading,setStratLoading]=useState(false);
  const[detailVideo,setDetailVideo]=useState(null); /* 영상 클릭 상세 분석 모달 */
  const[activeSection,setActiveSection]=useState("overview"); /* overview | strategy | snapshots */

  /* 채널 영상 데이터 가져오기 (공용) */
  const fetchChannelVideos=async(chId,subs)=>{
    const[topItems,recentItems]=await Promise.all([
      ytSearch("",apiKey,15,"video","",{channelId:chId,order:"viewCount"}),
      ytSearch("",apiKey,15,"video","",{channelId:chId,order:"date"})
    ]);
    const topIds=(topItems||[]).map(i=>i.id.videoId).filter(Boolean);
    const recentIds=(recentItems||[]).map(i=>i.id.videoId).filter(Boolean);
    const allIds=[...new Set([...topIds,...recentIds])];
    if(allIds.length){
      const vd=await ytVids(allIds,apiKey);
      const mapped=vd.map(v=>{const vi=parseInt(v.statistics?.viewCount)||0;const li=parseInt(v.statistics?.likeCount)||0;const co=parseInt(v.statistics?.commentCount)||0;const ud=daysSince(v.snippet.publishedAt);const dSec=parseSec(v.contentDetails?.duration||"");return{videoId:v.id,title:v.snippet.title,thumbnail:`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`,publishedAt:v.snippet.publishedAt,duration:parseDur(v.contentDetails?.duration||""),durationSec:dSec,videoType:getType(dSec),uploadDays:ud,views:vi,likes:li,comments:co,dailyViews:ud>0?Math.round(vi/ud):vi,engagementRate:engR(li,co,vi),viralScore:viral(vi,li,co,subs,ud)};});
      const top=mapped.filter(v=>topIds.includes(v.videoId)).sort((a,b)=>b.views-a.views).slice(0,10);
      const recent=mapped.filter(v=>recentIds.includes(v.videoId)).sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)).slice(0,10);
      setTopVideos(top);setRecentVideos(recent);
      _persist("mychannel_topvids",top);_persist("mychannel_recentvids",recent);
      /* 갱신 때마다 영상별 조회수 스냅샷 자동 기록 — 실측 일별 트래킹 데이터 축적 */
      mapped.forEach(v=>{try{trackVideoView(v.videoId,v.views);}catch(e){}});
    }
  };

  /* 기존 채널 데이터는 있지만 영상 데이터가 없으면 자동 로드 */
  const autoFetchDone=useRef(false);
  useEffect(()=>{
    if(!autoFetchDone.current&&channelData&&channelData.id&&!topVideos.length&&apiKey){
      autoFetchDone.current=true;
      setLoading(true);setErr("");
      fetchChannelVideos(channelData.id,channelData.subs||0)
        .catch(e=>{setErr(cleanApiErr(e.message));autoFetchDone.current=false;})
        .finally(()=>setLoading(false));
    }
  },[apiKey]);

  const trackChannel=async()=>{
    /* 입력 없이 클릭 = 기존 채널 영상 데이터만 갱신 */
    if(!searchInput.trim()&&channelData&&channelData.id){
      setLoading(true);setErr("");
      try{await fetchChannelVideos(channelData.id,channelData.subs||0);}
      catch(e){setErr(cleanApiErr(e.message));}
      setLoading(false);return;
    }
    if(!searchInput.trim())return;
    setLoading(true);setErr("");setStrategy(null);
    try{
      const q=searchInput.trim();
      const results=await ytSearch(q,apiKey,1,"channel");
      if(!results.length){setErr("채널을 찾을 수 없습니다.");setLoading(false);return;}
      const chId=results[0].id.channelId;
      const chs=await ytChs([chId],apiKey);
      if(!chs.length){setErr("채널 정보를 로드할 수 없습니다.");setLoading(false);return;}
      const ch=chs[0];
      const subs=parseInt(ch.statistics?.subscriberCount)||0;
      const views=parseInt(ch.statistics?.viewCount)||0;
      const videoCount=parseInt(ch.statistics?.videoCount)||0;
      const newData={id:chId,title:ch.snippet?.title,thumbnail:ch.snippet?.thumbnails?.medium?.url,handle:ch.snippet?.customUrl||q,subs,views,videoCount,description:ch.snippet?.description||""};
      _persist("mychannel_handle",q);_persist("mychannel_data",newData);
      setChannelHandle(q);setChannelData(newData);
      /* 스냅샷 저장 (최소 1시간 간격) */
      const lastTs=snapshots?.[0]?.ts||0;
      if(Date.now()-lastTs>3600000){
        const snap={ts:Date.now(),subs,views,videoCount};
        setSnapshots(prev=>{const updated=[snap,...(prev||[])].slice(0,50);_persist("mychannel_snapshots",updated);return updated;});
      }
      await fetchChannelVideos(chId,subs);
    }catch(e){setErr(cleanApiErr(e.message));}
    setLoading(false);setSearchInput("");
  };

  /* AI 채널 전략 분석 */
  const runStrategy=async()=>{
    if(stratLoading||!apiKey||!channelData)return;
    setStratLoading(true);
    try{
      /* 포맷별 데이터 분리 */
      const allVids=[...topVideos,...recentVideos];const uniq=[...new Map(allVids.map(v=>[v.videoId,v])).values()];
      const shorts=uniq.filter(v=>v.videoType.type==="shorts");
      const midVids=uniq.filter(v=>v.videoType.type==="mid");
      const longVids=uniq.filter(v=>v.videoType.type==="long");
      const fmtList=(arr,n=6)=>arr.slice(0,n).map(v=>`"${v.title}" 조회:${fmtN(v.views)} 반응:${v.engagementRate}% 일평균:${fmtN(v.dailyViews)} ${v.uploadDays}일전`).join("\n");
      const fmtSummary=(arr,label)=>{if(!arr.length)return`${label}: 해당 포맷 영상 없음`;const avg=Math.round(arr.reduce((s,v)=>s+v.views,0)/arr.length);const eng=(arr.reduce((s,v)=>s+parseFloat(v.engagementRate),0)/arr.length).toFixed(1);return`${label} (${arr.length}개): 평균조회 ${fmtN(avg)}, 평균반응도 ${eng}%`;};
      const prompt=`당신은 "커밍쏜"의 유튜브 전략 디렉터입니다. 퍼스널메이커스의 콘텐츠 전략 프레임워크를 기반으로 이 채널을 분석하고 구체적인 성장 전략을 제시하세요.

채널 정보:
- 채널명: ${channelData.title}
- 구독자: ${fmtN(channelData.subs)}
- 총조회수: ${fmtN(channelData.views)}
- 영상 수: ${channelData.videoCount}
- 채널 소개: ${channelData.description?.slice(0,200)||"없음"}

포맷별 성과 요약:
- ${fmtSummary(shorts,"숏폼(60초이하)")}
- ${fmtSummary(midVids,"미드폼(1~10분)")}
- ${fmtSummary(longVids,"롱폼(10분이상)")}

숏폼 영상:
${fmtList(shorts.sort((a,b)=>b.views-a.views))||"없음"}

미드폼 영상:
${fmtList(midVids.sort((a,b)=>b.views-a.views))||"없음"}

롱폼 영상:
${fmtList(longVids.sort((a,b)=>b.views-a.views))||"없음"}

중요: 제목과 수치 데이터만으로 분석하세요. 썸네일이나 영상 콘텐츠는 보지 못하므로 추측하지 마세요.
숏폼과 미드폼을 반드시 구분해서 각각의 전략을 제시하세요.

아래 JSON 형식으로만 답변하세요:
{
  "channelDiagnosis": {
    "grade": "B+ 등",

    },

      "performance": "미드폼 성과 분석 (조회수, 반응도, 어떤 소재가 터지는지)",

      "improvement": "미드폼 개선 포인트",

    },

  },
  "nextContent": [
    {"title": "숏폼 추천 제목","format": "숏폼","reason": "근거","hook": "후킹 포인트"},
    {"title": "숏폼 추천 제목 2","format": "숏폼","reason": "근거","hook": "후킹 포인트"},
    {"title": "미드폼 추천 제목","format": "미드폼","reason": "근거","hook": "후킹 포인트"},
    {"title": "미드폼 추천 제목 2","format": "미드폼","reason": "근거","hook": "후킹 포인트"}
  ],
  "growthStrategy": {

  };

  /* 차트 데이터 (스냅샷 2개 이상 + 실제 변화 있을 때만) */
  const chartData=useMemo(()=>{
    if(!snapshots||snapshots.length<2)return null;
    const reversed=snapshots.slice().reverse();
    let hasChange=false;
    const data=reversed.map((s,i)=>{
      const d=new Date(s.ts);
      const prev=reversed[i-1];
      const dayViews=prev?Math.max(0,s.views-prev.views):0;
      if(dayViews>0)hasChange=true;
      return{date:`${d.getMonth()+1}/${d.getDate()}`,views:dayViews,cum:s.views,day:i+1};
    });
    return hasChange?data:null;
  },[snapshots]);

  const lastSnap=snapshots?.[0];const prevSnap=snapshots?.[1];
  const subsDelta=lastSnap&&prevSnap?lastSnap.subs-prevSnap.subs:0;
  const viewsDelta=lastSnap&&prevSnap?lastSnap.views-prevSnap.views:0;

  /* 포맷별 영상 분류 */
  const[vidFilter,setVidFilter]=useState("all"); /* all | shorts | mid | long */
  const formatStats=useMemo(()=>{
    const all=[...topVideos,...recentVideos];const unique=[...new Map(all.map(v=>[v.videoId,v])).values()];
    const shorts=unique.filter(v=>v.videoType.type==="shorts");
    const mid=unique.filter(v=>v.videoType.type==="mid");
    const long=unique.filter(v=>v.videoType.type==="long");
    const calc=(arr)=>({count:arr.length,avgViews:arr.length?Math.round(arr.reduce((s,v)=>s+v.views,0)/arr.length):0,avgEng:arr.length?(arr.reduce((s,v)=>s+parseFloat(v.engagementRate),0)/arr.length).toFixed(1):"0",avgDaily:arr.length?Math.round(arr.reduce((s,v)=>s+v.dailyViews,0)/arr.length):0});
    return{shorts:calc(shorts),mid:calc(mid),long:calc(long),total:calc(unique)};
  },[topVideos,recentVideos]);
  const filteredTop=useMemo(()=>vidFilter==="all"?topVideos:topVideos.filter(v=>v.videoType.type===vidFilter),[topVideos,vidFilter]);
  const filteredRecent=useMemo(()=>vidFilter==="all"?recentVideos:recentVideos.filter(v=>v.videoType.type===vidFilter),[recentVideos,vidFilter]);

  /* 인기영상 vs 최근영상 성과 비교 */
  const perfComparison=useMemo(()=>{
    if(!topVideos.length||!recentVideos.length)return null;
    const avgTop=Math.round(topVideos.reduce((s,v)=>s+v.views,0)/topVideos.length);
    const avgRecent=Math.round(recentVideos.reduce((s,v)=>s+v.views,0)/recentVideos.length);
    const avgTopEng=(topVideos.reduce((s,v)=>s+parseFloat(v.engagementRate),0)/topVideos.length).toFixed(1);
    const avgRecentEng=(recentVideos.reduce((s,v)=>s+parseFloat(v.engagementRate),0)/recentVideos.length).toFixed(1);
    const ratio=avgTop>0?Math.round((avgRecent/avgTop)*100):0;
    return{avgTop,avgRecent,avgTopEng,avgRecentEng,ratio};
  },[topVideos,recentVideos]);

  /* 데이터 새로고침 */
  const refreshData=()=>{
    if(!channelData||!channelData.id||loading)return;
    autoFetchDone.current=false;
    setLoading(true);setErr("");
    fetchChannelVideos(channelData.id,channelData.subs||0)
      .catch(e=>{setErr(cleanApiErr(e.message));})
      .finally(()=>setLoading(false));
  };

  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {detailVideo&&<GrowthModal video={detailVideo} onClose={()=>setDetailVideo(null)} apiKey={apiKey} isOwn={true}/>}
      {/* 채널 검색/등록 */}
      <Card style={{padding:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <div style={{width:28,height:28,background:"linear-gradient(135deg,#1E3A8A,#1B3EC3)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{width:8,height:8,borderRadius:"50%",background:"#fff",display:"block"}}/></div>
          <div><div style={{fontWeight:700,fontSize:14,color:"#0F172A"}}>내 채널 트래커</div>
          <div style={{fontSize:11,color:"#94A3B8"}}>채널을 등록하고 성장 현황을 분석하세요</div></div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <input value={searchInput} onChange={e=>setSearchInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&trackChannel()} placeholder={channelData?"다른 채널로 변경하려면 입력":"채널명 또는 @핸들 입력"} style={{flex:1,border:"1px solid #E2E8F0",borderRadius:8,padding:"10px 14px",fontSize:13,outline:"none",background:"#F8FAFC",transition:"border .15s",color:"#1E293B"}} onFocus={e=>e.target.style.borderColor="#1E3A8A"} onBlur={e=>e.target.style.borderColor="#E2E8F0"}/>
          <button onClick={trackChannel} disabled={loading} style={{background:loading?"#E2E8F0":"linear-gradient(135deg,#EA580C,#F97316)",color:loading?"#94A3B8":"#fff",border:"none",borderRadius:8,padding:"10px 20px",cursor:loading?"not-allowed":"pointer",whiteSpace:"nowrap",fontWeight:600,fontSize:13,boxShadow:loading?"none":"0 2px 8px rgba(234,88,12,.3)"}}>{loading?"분석 중...":channelData?"갱신":"등록"}</button>
        </div>
        {err&&<div style={{marginTop:10,background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#DC2626",display:"flex",alignItems:"center",gap:8}}>
          <span></span><span style={{flex:1}}>{err}</span>
          <button onClick={()=>{setErr("");refreshData();}} style={{background:"#DC2626",color:"#fff",border:"none",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontSize:11,fontWeight:600,flexShrink:0}}>재시도</button>
        </div>}
      </Card>

      {/* Google 연동 - YouTube Analytics 실측 데이터 */}
      <OAuthCard/>

      {channelData&&(
        <>
          {/* 채널 프로필 카드 */}
          <Card style={{padding:0,overflow:"hidden"}}>
            <div style={{background:"linear-gradient(135deg,#0B1C3F,#1E3A8A)",padding:"16px 20px",display:"flex",gap:14,alignItems:"center"}}>
              <img src={channelData.thumbnail} alt="" style={{width:64,height:64,borderRadius:12,objectFit:"cover",border:"3px solid rgba(255,255,255,.3)",flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15,color:"#fff",marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{channelData.title}</div>
                <div style={{color:"rgba(255,255,255,.7)",fontSize:11}}>{channelData.handle||channelHandle}</div>
              </div>
              <button onClick={()=>{if(confirm("채널 데이터를 모두 삭제할까요?")){setChannelData(null);setSnapshots([]);setChannelHandle("");setTopVideos([]);setRecentVideos([]);setStrategy(null);_persist("mychannel_handle","");_persist("mychannel_data",null);_persist("mychannel_snapshots",[]);_persist("mychannel_topvids",[]);_persist("mychannel_recentvids",[]);}}} style={{background:"rgba(255,255,255,.15)",backdropFilter:"blur(8px)",border:"1px solid rgba(255,255,255,.2)",borderRadius:8,padding:"6px 12px",color:"rgba(255,255,255,.9)",cursor:"pointer",fontSize:11,whiteSpace:"nowrap",fontWeight:500}}>삭제</button>
            </div>
            <div style={{padding:"14px 20px",display:"flex",gap:0}}>
              {[{l:"구독자",v:fmtN(channelData.subs),c:"#1E3A8A",d:subsDelta},{l:"총 조회수",v:fmtN(channelData.views),c:"#1B3EC3",d:viewsDelta},{l:"영상 수",v:channelData.videoCount,c:"#60A5FA",d:0},{l:"영상당 평균",v:channelData.subs>0?fmtN(Math.round(channelData.views/Math.max(channelData.videoCount,1))):"-",c:"#059669",d:0}].map((m,i,arr)=>(
                <div key={m.l} style={{flex:1,textAlign:"center",padding:"4px 0",borderRight:i<arr.length-1?"1px solid #F1F5F9":"none"}}>
                  <div style={{color:"#94A3B8",fontSize:10,marginBottom:4,fontWeight:500}}>{m.l}</div>
                  <div style={{color:m.c,fontFamily:"'SF Mono',SFMono-Regular,Menlo,monospace",fontSize:15,fontWeight:700}}>{m.v}</div>
                  {m.d!==0&&<div style={{color:m.d>0?"#059669":"#DC2626",fontSize:10,fontWeight:600,marginTop:2}}>{m.d>0?"+":""}{fmtN(m.d)}</div>}
                </div>
              ))}
            </div>
          </Card>

          {/* 섹션 탭 - 필 스타일 */}
          <div style={{display:"flex",gap:6,background:"#F1F5F9",borderRadius:10,padding:4}}>
            {[{id:"overview",l:"채널 현황",badge:topVideos.length||null},{id:"strategy",l:"AI 전략"},{id:"snapshots",l:"성장 기록",badge:snapshots.length||null}].map(t=>(
              <button key={t.id} onClick={()=>setActiveSection(t.id)} style={{flex:1,background:activeSection===t.id?"#fff":"transparent",color:activeSection===t.id?"#0F172A":"#64748B",border:"none",borderRadius:8,padding:"9px 10px",cursor:"pointer",fontWeight:activeSection===t.id?700:500,fontSize:12,boxShadow:activeSection===t.id?"0 1px 3px rgba(0,0,0,.08)":"none",display:"flex",alignItems:"center",justifyContent:"center",gap:5,transition:"all .15s"}}>
                {t.l}
                {t.badge&&<span style={{background:activeSection===t.id?"#F97316":"#CBD5E1",color:"#fff",borderRadius:10,padding:"0 6px",fontSize:10,fontFamily:"monospace",lineHeight:"18px"}}>{t.badge}</span>}
              </button>
            ))}
          </div>

          {/* === 채널 현황 섹션 === */}
          {activeSection==="overview"&&(<div style={{display:"flex",flexDirection:"column",gap:10}}>
            {/* 로딩 스켈레톤 */}
            {loading&&<Card><div style={{padding:"8px 0"}}><Skeleton lines={4}/><div style={{marginTop:16}}><Skeleton lines={3}/></div></div></Card>}

            {/* 빈 상태 + 재시도 */}
            {!loading&&!topVideos.length&&!recentVideos.length&&<Card>
              <div style={{textAlign:"center",padding:"32px 0"}}>
                <div style={{width:56,height:56,background:"#F1F5F9",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}><span style={{width:12,height:12,borderRadius:"50%",background:"#94A3B8",display:"block"}}/></div>
                <div style={{fontSize:14,fontWeight:700,color:"#0F172A",marginBottom:4}}>영상 데이터가 없습니다</div>
                <div style={{fontSize:12,color:"#64748B",lineHeight:1.6,marginBottom:16}}>인기영상과 최신영상 데이터를 로드하면<br/>채널 성과 분석이 시작됩니다</div>
                <button onClick={refreshData} style={{background:"#1B3EC3",color:"#fff",border:"none",borderRadius:10,padding:"10px 24px",cursor:"pointer",fontWeight:600,fontSize:13,boxShadow:"0 2px 8px rgba(27,62,195,.25)"}}>영상 데이터 불러오기</button>
                {err&&<div style={{fontSize:11,color:"#DC2626",marginTop:10}}>{err}</div>}
              </div>
            </Card>}

            {/* 성과 비교 바 */}
            {perfComparison&&<Card>
              <SectionTitle sub="인기영상 대비 최근영상 퍼포먼스">성과 비교</SectionTitle>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
                <div style={{background:"#EFF6FF",borderRadius:10,padding:"14px 12px",textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#64748B",fontWeight:500}}>인기영상 평균</div>
                  <div style={{fontSize:18,fontWeight:800,color:"#1E3A8A",fontFamily:"'SF Mono',monospace",marginTop:4}}>{fmtN(perfComparison.avgTop)}</div>
                  <div style={{fontSize:10,color:"#64748B",marginTop:2}}>반응도 {perfComparison.avgTopEng}%</div>
                </div>
                <div style={{background:perfComparison.ratio>=80?"#F0FDF4":perfComparison.ratio>=50?"#FFFBEB":"#FEF2F2",borderRadius:10,padding:"14px 12px",textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#64748B",fontWeight:500}}>최근영상 평균</div>
                  <div style={{fontSize:18,fontWeight:800,color:perfComparison.ratio>=80?"#059669":perfComparison.ratio>=50?"#D97706":"#DC2626",fontFamily:"'SF Mono',monospace",marginTop:4}}>{fmtN(perfComparison.avgRecent)}</div>
                  <div style={{fontSize:10,color:"#64748B",marginTop:2}}>반응도 {perfComparison.avgRecentEng}%</div>
                </div>
                <div style={{background:"#F8FAFC",borderRadius:10,padding:"14px 12px",textAlign:"center",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center"}}>
                  <div style={{fontSize:10,color:"#64748B",fontWeight:500}}>최근 / 인기</div>
                  <div style={{fontSize:22,fontWeight:800,color:perfComparison.ratio>=80?"#059669":perfComparison.ratio>=50?"#D97706":"#DC2626",fontFamily:"'SF Mono',monospace",marginTop:2}}>{perfComparison.ratio}%</div>
                </div>
              </div>
              <div style={{background:"#E2E8F0",borderRadius:6,height:6,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:6,width:`${Math.min(perfComparison.ratio,100)}%`,background:`linear-gradient(90deg,${perfComparison.ratio>=80?"#059669,#34D399":perfComparison.ratio>=50?"#D97706,#FBBF24":"#DC2626,#F87171"})`,transition:"width .4s ease"}}/>
              </div>
              <div style={{fontSize:11,color:"#64748B",marginTop:6,textAlign:"center"}}>{perfComparison.ratio>=80?"최근 성과가 양호합니다":perfComparison.ratio>=50?"최근 성과가 평균 이하입니다":"최근 영상 성과가 크게 하락 — 전략 점검이 필요합니다"}</div>
            </Card>}

            {/* 포맷별 성과 비교 */}
            {(formatStats.shorts.count>0||formatStats.mid.count>0)&&<Card>
              <SectionTitle sub="숏폼 · 미드폼 · 롱폼 퍼포먼스 비교">포맷별 성과</SectionTitle>
              <div style={{display:"grid",gridTemplateColumns:formatStats.long.count>0?"1fr 1fr 1fr":"1fr 1fr",gap:8}}>
                {[{k:"shorts",label:"숏폼",st:formatStats.shorts,color:"#DC2626",bg:"#FEF2F2",bc:"#FEE2E2"},
                  {k:"mid",label:"미드폼",st:formatStats.mid,color:"#D97706",bg:"#FFFBEB",bc:"#FBEAB8"},
                  {k:"long",label:"롱폼",st:formatStats.long,color:"#1B3EC3",bg:"#EFF6FF",bc:"#BFDBFE"}
                ].filter(p=>p.st.count>0).map(p=>(
                  <div key={p.k} onClick={()=>setVidFilter(vidFilter===p.k?"all":p.k)} style={{background:vidFilter===p.k?p.bg:"#F8FAFC",borderRadius:10,padding:"12px 10px",textAlign:"center",cursor:"pointer",border:`1.5px solid ${vidFilter===p.k?p.bc:"#E2E8F0"}`,transition:"all .15s"}}>
                    <div style={{fontSize:11,fontWeight:700,color:p.color,marginBottom:6}}>{p.label} <span style={{fontSize:10,fontWeight:500,color:"#94A3B8"}}>({p.st.count}개)</span></div>
                    <div style={{fontSize:17,fontWeight:800,color:"#0F172A",fontFamily:"'SF Mono',monospace"}}>{fmtN(p.st.avgViews)}</div>
                    <div style={{fontSize:10,color:"#64748B",marginTop:2}}>평균조회</div>
                    <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:6}}>
                      <span style={{fontSize:10,color:"#D97706",fontWeight:500}}>{p.st.avgEng}%</span>
                      <span style={{fontSize:10,color:"#059669",fontWeight:500}}>{fmtN(p.st.avgDaily)}/일</span>
                    </div>
                  </div>
                ))}
              </div>
              {vidFilter!=="all"&&<div style={{fontSize:11,color:"#F97316",textAlign:"center",marginTop:8,fontWeight:600}}>{vidFilter==="shorts"?"숏폼":vidFilter==="mid"?"미드폼":"롱폼"} 필터 적용 중 — 클릭하면 해제</div>}
            </Card>}

            {/* TOP 인기영상 */}
            {filteredTop.length>0&&<Card>
              <SectionTitle sub={vidFilter==="all"?`채널 내 조회수 TOP ${filteredTop.length}`:`${vidFilter==="shorts"?"숏폼":vidFilter==="mid"?"미드폼":"롱폼"} 인기영상 ${filteredTop.length}개`}>인기영상</SectionTitle>
              <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:420,overflowY:"auto"}}>
                {filteredTop.map((v,i)=>(
                  <div key={v.videoId} onClick={()=>setDetailVideo({...v,channel:channelData.title,subscribers:channelData.subs||0})} style={{display:"flex",gap:10,alignItems:"center",background:i<3?"linear-gradient(135deg,#F8FAFC,#EFF6FF)":"#F8FAFC",borderRadius:10,padding:"10px 12px",transition:"background .15s",border:i<3?"1px solid #BFDBFE":"1px solid transparent",cursor:"pointer"}}>
                    <div style={{fontSize:12,fontWeight:800,color:i===0?"#1E3A8A":i===1?"#1B3EC3":i===2?"#60A5FA":"#CBD5E1",width:22,textAlign:"center",flexShrink:0}}>{i+1}</div>
                    <img src={v.thumbnail} alt="" style={{width:88,height:50,borderRadius:6,objectFit:"cover",flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,color:"#0F172A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4}}>{v.title}</div>
                      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                        <span style={{fontSize:10,color:"#1E3A8A",fontWeight:600}}>{fmtN(v.views)}</span>
                        <span style={{fontSize:10,color:"#D97706",fontWeight:500}}>{v.engagementRate}%</span>
                        <span style={{fontSize:10,color:"#F97316",fontWeight:500}}>{v.viralScore}</span>
                        <Tag text={v.videoType.label} color={v.videoType.color} bg={v.videoType.bg}/>
                        <span style={{fontSize:9,color:"#1B3EC3",fontWeight:600,background:"#EFF6FF",borderRadius:4,padding:"2px 6px"}}>분석</span>
                      </div>
                    </div>
                    <a href={`https://youtube.com/watch?v=${v.videoId}`} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{background:"#DC2626",borderRadius:6,padding:"5px 9px",color:"#fff",fontSize:10,fontWeight:600,textDecoration:"none",flexShrink:0}}>보기</a>
                  </div>
                ))}
              </div>
            </Card>}

            {/* 최신 영상 */}
            {filteredRecent.length>0&&<Card>
              <SectionTitle sub={vidFilter==="all"?`최근 업로드 ${filteredRecent.length}개`:`${vidFilter==="shorts"?"숏폼":vidFilter==="mid"?"미드폼":"롱폼"} 최신 ${filteredRecent.length}개`}>최신영상</SectionTitle>
              <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:340,overflowY:"auto"}}>
                {filteredRecent.map(v=>(
                  <div key={v.videoId} onClick={()=>setDetailVideo({...v,channel:channelData.title,subscribers:channelData.subs||0})} style={{display:"flex",gap:10,alignItems:"center",background:"#F8FAFC",borderRadius:10,padding:"10px 12px",transition:"background .15s",cursor:"pointer"}}>
                    <img src={v.thumbnail} alt="" style={{width:80,height:45,borderRadius:6,objectFit:"cover",flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,color:"#0F172A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4}}>{v.title}</div>
                      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                        <span style={{fontSize:10,color:"#94A3B8"}}>{v.uploadDays}일 전</span>
                        <span style={{fontSize:10,color:"#1E3A8A",fontWeight:600}}>{fmtN(v.views)}</span>
                        <span style={{fontSize:10,color:"#059669",fontWeight:500}}>일평균 ≈{fmtN(v.dailyViews)}</span>
                        <Tag text={v.videoType.label} color={v.videoType.color} bg={v.videoType.bg}/>
                        <span style={{fontSize:9,color:"#1B3EC3",fontWeight:600,background:"#EFF6FF",borderRadius:4,padding:"2px 6px"}}>분석</span>
                      </div>
                    </div>
                    <a href={`https://youtube.com/watch?v=${v.videoId}`} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{background:"#DC2626",borderRadius:6,padding:"5px 9px",color:"#fff",fontSize:10,fontWeight:600,textDecoration:"none",flexShrink:0}}>보기</a>
                  </div>
                ))}
              </div>
            </Card>}
          </div>)}

          {/* === AI 전략 분석 섹션 === */}
          {activeSection==="strategy"&&(<div style={{display:"flex",flexDirection:"column",gap:10}}>
            <TopicNeedsCard channelData={channelData} topVideos={topVideos} recentVideos={recentVideos} apiKey={apiKey}/>
            {!strategy&&!stratLoading&&<Card>
              <div style={{textAlign:"center",padding:"36px 0"}}>
                <div style={{width:64,height:64,background:"linear-gradient(135deg,#EFF6FF,#DBEAFE)",borderRadius:20,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><span style={{width:14,height:14,borderRadius:"50%",background:"#1B3EC3",display:"block"}}/></div>
                <div style={{fontSize:16,fontWeight:700,color:"#0F172A",marginBottom:6}}>AI 채널 전략 분석</div>
                <div style={{fontSize:12,color:"#64748B",marginBottom:20,lineHeight:1.7}}>인기영상 · 최근영상 데이터를 기반으로<br/>채널 진단, 콘텐츠 추천, 성장 전략을 받아보세요</div>
                <button onClick={runStrategy} disabled={!topVideos.length} style={{background:topVideos.length?"#1B3EC3":"#E2E8F0",color:topVideos.length?"#fff":"#94A3B8",border:"none",borderRadius:10,padding:"12px 28px",cursor:topVideos.length?"pointer":"not-allowed",fontWeight:700,fontSize:14,boxShadow:topVideos.length?"0 4px 12px rgba(234,88,12,.3)":"none"}}>전략 분석 시작</button>
                {!topVideos.length&&<div style={{fontSize:11,color:"#EA580C",marginTop:10}}>먼저 '채널 현황' 탭에서 영상 데이터를 로드해주세요</div>}
              </div>
            </Card>}
            {stratLoading&&<Card><div style={{padding:"8px 0"}}><Skeleton lines={5}/><div style={{marginTop:16}}><Skeleton lines={4}/></div></div></Card>}
            {strategy?._error&&<Card>
              <div style={{textAlign:"center",padding:"28px 0"}}>
                <div style={{color:"#DC2626",fontSize:14,fontWeight:700,marginBottom:6}}>AI 전략 분석 실패</div>
                <div style={{color:"#64748B",fontSize:12,marginBottom:16,lineHeight:1.6,maxWidth:420,margin:"0 auto 16px"}}>{strategy._msg}</div>
                <button onClick={()=>{setStrategy(null);runStrategy();}} style={{background:"#1B3EC3",color:"#fff",border:"none",borderRadius:10,padding:"11px 26px",cursor:"pointer",fontWeight:700,fontSize:13}}>다시 시도</button>
              </div>
            </Card>}
            {strategy&&!strategy._error&&(<>
              {/* 채널 진단 */}
              {strategy.channelDiagnosis&&<Card>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <SectionTitle>채널 진단</SectionTitle>
                  <div style={{background:"linear-gradient(135deg,#1D4ED8,#1D4ED8)",color:"#fff",padding:"5px 16px",borderRadius:20,fontSize:15,fontWeight:800,boxShadow:"0 2px 8px rgba(124,58,237,.25)"}}>{strategy.channelDiagnosis.grade}</div>
                </div>
                <div style={{fontSize:13,color:"#0F172A",fontWeight:600,marginBottom:12,lineHeight:1.6,background:"#F8FAFC",borderRadius:8,padding:12}}>{strategy.channelDiagnosis.summary}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  <div style={{background:"#F0FDF4",borderRadius:10,padding:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#059669",marginBottom:8}}>강점</div>
                    {(strategy.channelDiagnosis.strengths||[]).map((s,i)=><div key={i} style={{fontSize:12,color:"#334155",marginBottom:4,lineHeight:1.5,paddingLeft:10,borderLeft:"2px solid #D1FAE5"}}>  {s}</div>)}
                  </div>
                  <div style={{background:"#FEF2F2",borderRadius:10,padding:12}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#DC2626",marginBottom:8}}>개선점</div>
                    {(strategy.channelDiagnosis.weaknesses||[]).map((s,i)=><div key={i} style={{fontSize:12,color:"#334155",marginBottom:4,lineHeight:1.5,paddingLeft:10,borderLeft:"2px solid #FEE2E2"}}>{s}</div>)}
                  </div>
                </div>
              </Card>}

              {/* 포맷별 분석 */}
              {strategy.formatAnalysis&&<Card>
                <SectionTitle>포맷별 전략 분석</SectionTitle>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {/* 숏폼 */}

                    <div key={i} style={{background:"linear-gradient(135deg,#FAFAFE,#EFF6FF)",borderRadius:12,padding:14,border:"1px solid #BFDBFE"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>

                  {l:"단기 (1~3개월)",v:strategy.growthStrategy.shortTerm,c:"#D97706",bg:"#FFFBEB",bc:"#FBEAB8"},
                  {l:"중기 (3~6개월)",v:strategy.growthStrategy.midTerm,c:"#059669",bg:"#F0FDF4",bc:"#D1FAE5"}
                ].map(p=>p.v&&(
                  <div key={p.l} style={{background:p.bg,borderRadius:10,padding:"12px 14px",borderLeft:`3px solid ${p.bc}`}}>

                  <div style={{fontSize:13,color:"#DBEAFE",lineHeight:1.8}}>{strategy.directorNote}</div>

              <button onClick={()=>{setStrategy(null);runStrategy();}} style={{background:"#F1F5F9",border:"1px solid #E2E8F0",borderRadius:10,padding:"11px",cursor:"pointer",fontWeight:600,fontSize:12,color:"#64748B",transition:"background .15s"}}>다시 분석</button>
            </>)}
          </div>)}

          {/* === 스냅샷 기록 섹션 === */}
          {activeSection==="snapshots"&&(<div style={{display:"flex",flexDirection:"column",gap:10}}>
            {chartData&&<Card><SectionTitle sub={`최근 ${snapshots.length}개 스냅샷 기반`}>성장 추이</SectionTitle><SvgChart data={chartData} w={640} h={220}/></Card>}

              <div style={{textAlign:"center",padding:"24px 0",color:"#94A3B8"}}>

window.__loadDeps=function(names,onReady,onFail){
  function loadOne(name,urls,idx,done){
    if(window[name])return done();
    if(idx>=urls.length)return onFail(name);
    var s=document.createElement('script');
    s.src=urls[idx];
    var timer=setTimeout(function(){s.onload=s.onerror=null;try{s.remove();}catch(e){}loadOne(name,urls,idx+1,done);},12000);
    s.onload=function(){clearTimeout(timer);if(window[name]){done();}else{loadOne(name,urls,idx+1,done);}};
    s.onerror=function(){clearTimeout(timer);loadOne(name,urls,idx+1,done);};
    document.head.appendChild(s);
  }
  function next(i){if(i>=names.length)return onReady();loadOne(names[i],window.__LIB_CHAINS[names[i]],0,function(){next(i+1);});}
  next(0);
};

(function(){
  var PLACEHOLDER='team-server-managed-key';
  try{ if(!(localStorage.getItem('yt_api_key')||'').trim()) localStorage.setItem('yt_api_key',PLACEHOLDER); }catch(e){}
  var YT_RE=/^https:\/\/www\.googleapis\.com\/youtube\/v3\//, GA_RE=/^https:\/\/generativelanguage\.googleapis\.com\/v1beta\/models/;
  var realFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    var url=typeof input==='string'?input:(input&&input.url)||'';
    if(!(YT_RE.test(url)||GA_RE.test(url))) return realFetch(input,init);
    var token=''; try{ token=window.PMFire&&window.PMFire.idToken?await window.PMFire.idToken():''; }catch(e){}

<script id="app-source" type="text/plain">
const {useState,useMemo,useCallback,useEffect,useRef}=React;
const YT="https://www.googleapis.com/youtube/v3";
/* Gemini 모델 자동 선택 — 하드코딩 모델이 지원 종료되면 사용 가능한 모델을 자동 탐지 */
const GA_BASE="https://generativelanguage.googleapis.com/v1beta/models";
let _gemModel=(function(){try{return localStorage.getItem("gemini_model")||"gemini-2.5-flash-lite";}catch(e){return "gemini-2.5-flash-lite";}})();
function gaUrl(key){return GA_BASE+"/"+_gemModel+":generateContent?key="+key;}
function getGeminiModel(){return _gemModel;}
async function pickGeminiModel(key){
  const r=await fetch(GA_BASE+"?key="+key+"&pageSize=200");
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||"모델 목록 조회 실패");
  const items=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"));
  const score=(n)=>{
    if(/tts|image|audio|video|live|embed|imagen|veo|aqa/.test(n))return -1;
    let s=0;
    const vm=n.match(/gemini-(\d+(?:\.\d+)?)/);
    s+=vm?parseFloat(vm[1])*100:0;
    if(n.includes("flash"))s+=40;
    if(n.includes("lite"))s+=20;
    if(n.includes("pro"))s+=10;
    if(n.includes("preview")||n.includes("exp"))s-=8;
    if(/latest$/.test(n))s+=5;
    return s;
  };
  let best=null,bestS=0;
  items.forEach(m=>{
    const n=String(m.name||"").replace("models/","");
    const s=score(n);
    if(s>bestS){bestS=s;best=n;}
  });
  if(!best)throw new Error("사용 가능한 Gemini 모델을 찾지 못했습니다");
  _gemModel=best;
  try{localStorage.setItem("gemini_model",best);}catch(e){}
  return best;
}
const _isModelErr=(msg)=>/no longer available|not found|not supported|deprecated|unknown name|invalid model/i.test(String(msg));
const GC={"매우높음":"#059669","높음":"#10B981","보통":"#D97706","낮음":"#EA580C","매우낮음":"#DC2626"};
const TABS=[{id:"dashboard",label:"대시보드"},{id:"trending",label:"실시간 인기"},{id:"video",label:"트렌드 소재"},{id:"channel",label:"채널 분석"},{id:"mychannel",label:"내 채널"},{id:"saved",label:"수집함"}];

/* ── 유틸 ── */
const fmtN=n=>{if(!n&&n!==0)return"-";n=parseInt(n)||0;if(n>=100000000)return(n/100000000).toFixed(1)+"억";if(n>=10000)return(n/10000).toFixed(1)+"만";if(n>=1000)return(n/1000).toFixed(1)+"천";return n.toLocaleString();};
const parseDur=iso=>{const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/)||[];const h=parseInt(m[1]||0),min=parseInt(m[2]||0),s=parseInt(m[3]||0);if(h>0)return`${h}:${String(min).padStart(2,"0")}:${String(s).padStart(2,"0")}`;return`${min}:${String(s).padStart(2,"0")}`;};
const parseSec=iso=>{const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/)||[];return(parseInt(m[1]||0)*3600)+(parseInt(m[2]||0)*60)+(parseInt(m[3]||0));};
const getType=sec=>sec<=60?{type:"shorts",label:"숏폼",color:"#DC2626",bg:"#FEF2F2",border:"#FEE2E2"}:sec<=600?{type:"mid",label:"미드폼",color:"#D97706",bg:"#FFFBEB",border:"#FBEAB8"}:{type:"long",label:"롱폼",color:"#1B3EC3",bg:"#EFF6FF",border:"#BFDBFE"};
const daysSince=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/86400000));
const engR=(l,c,v)=>(!v||v===0)?"0.00":(((parseInt(l)||0)+(parseInt(c)||0))/parseInt(v)*100).toFixed(2);
const viral=(v,l,c,s,d)=>{const vv=parseInt(v)||0,ll=parseInt(l)||0,cc=parseInt(c)||0,ss=parseInt(s)||1;return Math.min(100,Math.round(Math.min(vv/ss,3)*30+Math.min(parseFloat(engR(ll,cc,vv))*4,35)+Math.max(0,25-d*0.2)));};
const expGrade=(v,l,c,s,d)=>{const vs=viral(v,l,c,s,d);const vpd=parseInt(v)/(d||1);let sc=vs;if(vpd>50000)sc=Math.min(100,sc+15);else if(vpd>10000)sc=Math.min(100,sc+8);if(d<7)sc=Math.min(100,sc+10);return sc>=85?"매우높음":sc>=70?"높음":sc>=50?"보통":sc>=30?"낮음":"매우낮음";};
const fmtVPD=v=>{if(v>=10000)return(v/10000).toFixed(1)+"만/일";if(v>=1000)return(v/1000).toFixed(1)+"천/일";return Math.round(v)+"/일";};
/* 중앙값 유틸 — calcMomentum / ChannelDeepModal / runBranding 공용 */
function median(arr){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
/* 핫스코어 공용 계산 — 트렌딩 인기급상승/카테고리 발굴 공용. viralRatio가 null이면 구독자 미상으로 +10 */
function calcHotScore(dailyViews,er,ud,viralRatio){
  let s=0;
  if(dailyViews>=50000)s+=35;else if(dailyViews>=10000)s+=28;else if(dailyViews>=3000)s+=20;else if(dailyViews>=500)s+=12;else s+=5;
  if(er>=8)s+=25;else if(er>=5)s+=18;else if(er>=3)s+=12;else if(er>=1)s+=6;
  if(ud<=1)s+=20;else if(ud<=3)s+=15;else if(ud<=7)s+=10;else if(ud<=14)s+=5;
  if(viralRatio==null)s+=10;else if(viralRatio>=1)s+=20;else if(viralRatio>=0.3)s+=14;else if(viralRatio>=0.1)s+=8;else s+=3;
  const label=s>=70?"매우높음":s>=50?"높음":s>=35?"보통":"낮음";
  const color=s>=70?"#DC2626":s>=50?"#EA580C":s>=35?"#D97706":"#94A3B8";
  return{score:s,label,color};
}

/* ── 멀티 API 키 로테이션 ── */
const _keyStore={keys:[],current:0,failed:new Set()};
function initKeys(keyStr){const arr=keyStr.split(",").map(k=>k.trim()).filter(k=>k.length>10);_keyStore.keys=arr;_keyStore.current=0;_keyStore.failed=new Set();return arr.length;}
function getKey(){const{keys,failed}=_keyStore;if(!keys.length)return"";const avail=keys.filter((_,i)=>!failed.has(i));if(!avail.length){_keyStore.failed=new Set();_keyStore.current=0;return keys[0];}let idx=_keyStore.current;while(failed.has(idx))idx=(idx+1)%keys.length;_keyStore.current=idx;return keys[idx];}
function rotateKey(failedKey){const idx=_keyStore.keys.indexOf(failedKey);if(idx>=0)_keyStore.failed.add(idx);_keyStore.current=(_keyStore.current+1)%_keyStore.keys.length;return getKey();}
function getKeyStatus(){const{keys,failed}=_keyStore;return{total:keys.length,active:keys.length-failed.size,current:_keyStore.current+1,failed:failed.size};}

/* ── 캐시 시스템 ── */
const CACHE_TTL={vid:3600000,ch:21600000,search:1800000,cmt:3600000}; /* 영상1h, 채널6h, 검색30m, 댓글1h */
const _cGet=(prefix,id)=>{try{const raw=localStorage.getItem(prefix+id);if(!raw)return null;const o=JSON.parse(raw);if(Date.now()-o.ts>CACHE_TTL[prefix.replace("_","")])return null;return o.data;}catch(e){return null;}};
const _cSet=(prefix,id,data)=>{try{localStorage.setItem(prefix+id,JSON.stringify({ts:Date.now(),data}));}catch(e){/* storage full — LRU: ts 오래된 순으로 절반 삭제 */try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith("vid_")||k?.startsWith("ch_")||k?.startsWith("search_")||k?.startsWith("cmt_"))keys.push(k);}keys.map(k=>{let ts=0;try{ts=JSON.parse(localStorage.getItem(k)||"{}").ts||0;}catch(e3){}return{k,ts};}).sort((a,b)=>a.ts-b.ts).slice(0,Math.max(1,Math.floor(keys.length/2))).forEach(o=>localStorage.removeItem(o.k));localStorage.setItem(prefix+id,JSON.stringify({ts:Date.now(),data}));}catch(e2){}}};
/* API 절약 카운터 */
let apiSaved={calls:0,units:0};
const getApiSaved=()=>({...apiSaved});
const resetApiSaved=()=>{apiSaved={calls:0,units:0};};

/* ── 리서치 데이터 영속성 ── */
const _persist=(key,data)=>{
  const payload=JSON.stringify(data);
  try{localStorage.setItem("p_"+key,payload);}
  catch(e){
    /* 저장 실패 — [1] API 캐시 정리 후 재시도. pm_compiled_* 키는 절대 삭제하지 않음 */
    try{
      const del=[];
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith("vid_")||k.startsWith("ch_")||k.startsWith("search_")||k.startsWith("cmt_")))del.push(k);}
      del.forEach(k=>localStorage.removeItem(k));
      localStorage.setItem("p_"+key,payload);
    }catch(e2){
      /* [2] 그래도 실패 — 1회만 사용자에게 알림 */
      if(!window.__storageWarned){window.__storageWarned=true;alert("저장 공간이 가득 찼습니다. 헤더의 캐시 초기화를 눌러주세요.");}
    }
  }
};
const _restore=(key,fallback)=>{try{const raw=localStorage.getItem("p_"+key);return raw?JSON.parse(raw):fallback;}catch(e){return fallback;}};

/* ── API (캐시 적용) ── */
/* quota/403 에러 감지 */
const _isQuotaErr=(msg)=>/quota|exceeded|forbidden|403|rateLimitExceeded/i.test(String(msg));

async function ytFetchJson(pathAndParams,initialKey){
  let useKey=initialKey;
  for(let attempt=0;attempt<_keyStore.keys.length||attempt<1;attempt++){
    try{
      const url=pathAndParams.includes("key=")?pathAndParams.replace(/key=[^&]+/,`key=${useKey}`):`${pathAndParams}${pathAndParams.includes("?")?"&":"?"}key=${useKey}`;
      const r=await fetch(url);const d=await r.json();
      if(d.error){if(_isQuotaErr(d.error.message)&&_keyStore.keys.length>1){useKey=rotateKey(useKey);continue;}throw new Error(d.error.message);}
      return d;
    }catch(e){if(e.message&&_isQuotaErr(e.message)&&_keyStore.keys.length>1){useKey=rotateKey(useKey);continue;}throw e;}
  }
  throw new Error("모든 API 키의 할당량이 소진되었습니다.");
}

async function ytSearch(q,k,n=10,t="video",dur="",opts={}){
  const cacheKey=`${q}|${t}|${n}|${dur}|${opts.order||""}|${opts.publishedAfter||""}|${opts.videoCategoryId||""}`+(opts.channelId?`|${opts.channelId}`:"");
  const cached=_cGet("search_",cacheKey);
  if(cached){apiSaved.calls++;apiSaved.units+=100*Math.ceil(n/50);return cached;}
  let useKey=k;
  for(let attempt=0;attempt<_keyStore.keys.length||attempt<1;attempt++){
    try{
      let all=[],pageToken="",remain=n;
      while(remain>0){const batch=Math.min(remain,50);let url=`${YT}/search?part=snippet&q=${encodeURIComponent(q)}&type=${t}&maxResults=${batch}&regionCode=KR&relevanceLanguage=ko&key=${useKey}`;if(dur)url+=`&videoDuration=${dur}`;if(opts.channelId)url+=`&channelId=${opts.channelId}`;if(opts.order)url+=`&order=${opts.order}`;if(opts.publishedAfter)url+=`&publishedAfter=${opts.publishedAfter}`;if(opts.videoCategoryId)url+=`&videoCategoryId=${opts.videoCategoryId}`;if(pageToken)url+=`&pageToken=${pageToken}`;const r=await fetch(url);const d=await r.json();if(d.error){if(_isQuotaErr(d.error.message)&&_keyStore.keys.length>1){useKey=rotateKey(useKey);throw{_retry:true,msg:d.error.message};}throw new Error(d.error.message);}all=all.concat(d.items||[]);pageToken=d.nextPageToken||"";remain-=batch;if(!pageToken)break;}
      _cSet("search_",cacheKey,all);return all;
    }catch(e){if(!e._retry)throw e;continue;}
  }
  throw new Error("모든 API 키의 할당량이 소진되었습니다. 내일 다시 시도하거나 새 키를 추가하세요.");
}
async function ytVids(ids,k){
  if(!ids.length)return[];
  const results=[];const missing=[];
  ids.forEach(id=>{const c=_cGet("vid_",id);if(c)results.push(c);else missing.push(id);});
  if(missing.length){
    let useKey=k;
    for(let attempt=0;attempt<_keyStore.keys.length||attempt<1;attempt++){
      try{
        for(let i=0;i<missing.length;i+=50){
          const batch=missing.slice(i,i+50);
          const r=await fetch(`${YT}/videos?part=statistics,contentDetails,snippet&id=${batch.join(",")}&key=${useKey}`);const d=await r.json();

/* 잘리거나 불완전한 JSON 응답을 복구 파싱하는 헬퍼 */
function parseJsonLoose(raw){
  let t=String(raw).replace(/```json|```/g,"").trim();
  const st=t.search(/[\{\[]/);
  if(st>0)t=t.slice(st);
  try{return JSON.parse(t);}catch(e){}
  /* 문자열 내부를 제외하고 열린 괄호를 세서 부족한 닫는 괄호를 보충 */
  let stack=[],inStr=false,esc=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(esc){esc=false;continue;}
    if(c==="\\"){esc=true;continue;}
    if(inStr){if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==="{")stack.push("}");
    else if(c==="[")stack.push("]");
    else if(c==="}"||c==="]")stack.pop();
  }
  let base=inStr?t+'"':t;
  /* 마지막 불완전 필드 제거 후 닫는 괄호 보충 */
  const closers=stack.reverse().join("");
  try{return JSON.parse(base+closers);}catch(e){}
  const tailRe=new RegExp(',\\s*"[^"]*"?\\s*:?\\s*[^,\\}\\]]*$');
  try{return JSON.parse(base.replace(tailRe,"")+closers);}catch(e){}
  const tailRe2=new RegExp(',[^,\\}\\]]*$');
  try{return JSON.parse(base.replace(tailRe2,"")+closers);}catch(e){throw new Error("AI 응답 파싱 실패 — 다시 시도해주세요");}
}
/* Gemini 호출 — 멀티키 자동 순회: 키가 무효/쿼터초과면 다음 키로 재시도 */
async function geminiFetch(body,fallbackKey){
  /* AI 전용 키가 등록돼 있으면 최우선 사용 */

  if(!ks.length&&!aiKey)throw new Error("API 키가 없습니다");
  const start=_keyStore.keys.length?_keyStore.current:0;
  const ordered=[...(aiKey?[aiKey]:[]),...ks.map((_,i)=>ks[(start+i)%ks.length])];
  let lastErr=null;let modelRepicked=false;
  for(let ki=0;ki<ordered.length;ki++){

    try{

        /* 모델 지원 종료 감지 → 사용 가능한 모델 자동 재선택 후 같은 키로 1회 재시도 */

  }

  if(/api key not valid/i.test(fm))throw new Error("등록된 키 모두에서 AI 호출이 거부되었습니다. 해결: aistudio.google.com/apikey 에서 무료 키를 발급받아 API 키 설정 화면의 'AI 전용 키'에 등록하거나, 기존 키 프로젝트에 'Generative Language API'를 활성화해주세요.");
  throw lastErr||new Error("Gemini 호출 실패");
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){console.error("[ErrorBoundary]",error,info);}
  render(){
    if(this.state.hasError){
      return React.createElement("div",{style:{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:10,padding:20,margin:12,textAlign:"center"}},
        React.createElement("div",{style:{color:"#DC2626",fontWeight:700,fontSize:14,marginBottom:6}},"이 영역에서 오류가 발생했습니다"),
        React.createElement("div",{style:{color:"#64748B",fontSize:12,marginBottom:12}},String(this.state.error?.message||"알 수 없는 오류")),
        React.createElement("button",{onClick:()=>this.setState({hasError:false,error:null}),style:{background:"#DC2626",color:"#fff",border:"none",borderRadius:6,padding:"8px 16px",cursor:"pointer",fontSize:12,fontWeight:600}},"다시 시도")
      );
    }

  }
}

/* ── 듀얼 차트: 누적 조회수(라인) + 일별 조회수(바) ── */
function SvgChart({data,w=640,h=220}){
  const[tip,setTip]=useState(null);
  const gid=useRef("cg_"+Math.random().toString(36).slice(2,8));
  if(!data?.length)return null;
  const pad={t:8,r:16,b:28,l:55,ml:55};/* ml=오른쪽 축 여백 */
  const W=w-pad.l-pad.ml,H=h-pad.t-pad.b;
  const maxCum=Math.max(...data.map(d=>d.cum||0),1);
  const maxDay=Math.max(...data.map(d=>d.views||0),1);
  const sx=i=>pad.l+(i/(data.length-1||1))*W;
  const syC=v=>pad.t+H-(v/maxCum*H);/* 누적 (왼쪽 축) */
  const syD=v=>pad.t+H-(v/maxDay*H);/* 일별 (오른쪽 축) */
  const fY=v=>{if(v>=100000000)return(v/100000000).toFixed(1)+"억";if(v>=10000)return(v/10000).toFixed(1)+"만";if(v>=1000)return(v/1000).toFixed(0)+"천";return String(Math.round(v));};
  /* 누적 라인 */
  const cumPath=data.map((d,i)=>`${i===0?"M":"L"}${sx(i).toFixed(1)},${syC(d.cum).toFixed(1)}`).join(" ");
  const cumFill=cumPath+` L${sx(data.length-1).toFixed(1)},${(pad.t+H).toFixed(1)} L${pad.l},${(pad.t+H).toFixed(1)} Z`;
  /* 축 눈금 */
  const yCum=[0,.33,.67,1].map(t=>maxCum*t);
  const yDay=[0,.33,.67,1].map(t=>maxDay*t);
  const xI=[0,Math.floor(data.length*.25),Math.floor(data.length*.5),Math.floor(data.length*.75),data.length-1];
  const barW=Math.max(W/data.length*0.6,1);
  /* 구간 색상 */
  const phaseColor=d=>{const day=d.day||0;return day<=3?"#DC2626":day<=7?"#EA580C":day<=14?"#D97706":day<=30?"#1B3EC3":"#1D4ED8";};
  return(
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{display:"block"}} onMouseLeave={()=>setTip(null)}>
      <defs>
        <linearGradient id={gid.current} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#059669" stopOpacity=".15"/><stop offset="100%" stopColor="#059669" stopOpacity=".02"/></linearGradient>
      </defs>
      {/* 왼쪽 축 눈금 (누적) */}
      {yCum.map((v,i)=><g key={"cl"+i}><line x1={pad.l} y1={syC(v)} x2={pad.l+W} y2={syC(v)} stroke="#E2E8F0" strokeDasharray="3,3"/><text x={pad.l-6} y={syC(v)+4} textAnchor="end" fill="#059669" fontSize="9">{fY(v)}</text></g>)}
      {/* 오른쪽 축 눈금 (일별) */}
      {yDay.map((v,i)=><text key={"dr"+i} x={pad.l+W+6} y={syD(v)+4} textAnchor="start" fill="#94A3B8" fontSize="9">{fY(v)}</text>)}
      {/* X축 날짜 */}
      {xI.filter(i=>i<data.length).map(i=><text key={i} x={sx(i)} y={pad.t+H+18} textAnchor="middle" fill="#94A3B8" fontSize="9">{data[i].date}</text>)}
      {/* 일별 조회수 바 */}
      {data.map((d,i)=><rect key={"b"+i} x={sx(i)-barW/2} y={syD(d.views)} width={barW} height={pad.t+H-syD(d.views)} rx={1} fill={phaseColor(d)} opacity=".35"/>)}
      {/* 누적 영역 + 라인 */}
      <path d={cumFill} fill={`url(#${gid.current})`}/>
      <path d={cumPath} fill="none" stroke="#059669" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {/* 호버 영역 */}
      {data.map((d,i)=><rect key={"h"+i} x={sx(i)-W/(data.length*2)} y={pad.t} width={W/data.length} height={H} fill="transparent" onMouseEnter={()=>setTip({x:sx(i),yc:syC(d.cum),yd:syD(d.views),cum:d.cum,views:d.views,date:d.date,day:d.day})}/>)}
      {/* 축 라벨 */}
      <text x={pad.l-4} y={pad.t-1} textAnchor="end" fill="#059669" fontSize="8" fontWeight="600">누적</text>
      <text x={pad.l+W+4} y={pad.t-1} textAnchor="start" fill="#94A3B8" fontSize="8" fontWeight="600">일별</text>
      {/* 툴팁 */}
      {tip&&<g>
        <line x1={tip.x} y1={pad.t} x2={tip.x} y2={pad.t+H} stroke="#059669" strokeDasharray="3,3" opacity=".5"/>
        <circle cx={tip.x} cy={tip.yc} r="4" fill="#059669" stroke="#fff" strokeWidth="2"/>
        <circle cx={tip.x} cy={tip.yd} r="3" fill={phaseColor(tip)} stroke="#fff" strokeWidth="1.5"/>
        <rect x={Math.min(Math.max(tip.x-62,0),w-130)} y={Math.max(tip.yc-56,0)} width="128" height="50" rx="6" fill="#1E293B"/>
        <text x={Math.min(Math.max(tip.x-62,0),w-130)+64} y={Math.max(tip.yc-56,0)+15} textAnchor="middle" fill="#94A3B8" fontSize="9">{tip.date} ({tip.day}일차)</text>
        <text x={Math.min(Math.max(tip.x-62,0),w-130)+64} y={Math.max(tip.yc-56,0)+30} textAnchor="middle" fill="#10B981" fontSize="11" fontWeight="bold">누적 {fmtN(tip.cum)}회</text>
        <text x={Math.min(Math.max(tip.x-62,0),w-130)+64} y={Math.max(tip.yc-56,0)+44} textAnchor="middle" fill="#F59E0B" fontSize="10" fontWeight="600">일별 {fmtN(tip.views)}회</text>
      </g>}
    </svg>
  );
}

/* ── 트렌드 분석 ── */
function analyzeTrend(videos){
  if(!videos?.length)return null;
  const fresh=videos.filter(v=>v.uploadDays<=14);
  const recent=videos.filter(v=>v.uploadDays>14&&v.uploadDays<=60);
  const old=videos.filter(v=>v.uploadDays>60);
  const avgVPD=arr=>arr.length===0?0:arr.reduce((s,v)=>s+(v.views/Math.max(v.uploadDays,1)),0)/arr.length;
  const fVPD=avgVPD(fresh),rVPD=avgVPD(recent),oVPD=avgVPD(old);
  const avgER=videos.reduce((s,v)=>s+parseFloat(v.engagementRate||0),0)/videos.length;
  const freshRatio=fresh.length/videos.length;
  let direction,dirLabel,dirColor;
  if(fVPD>0&&rVPD>0){const r=fVPD/rVPD;if(r>=2){direction="up2";dirLabel="매우높음";dirColor="#059669";}else if(r>=1.3){direction="up";dirLabel="높음";dirColor="#10B981";}else if(r>=0.7){direction="stable";dirLabel="보통";dirColor="#D97706";}else if(r>=0.4){direction="down";dirLabel="낮음";dirColor="#EA580C";}else{direction="down2";dirLabel="매우낮음";dirColor="#DC2626";}}else if(fVPD>0&&fresh.length>=2){direction="up";dirLabel="높음";dirColor="#10B981";}else{direction="stable";dirLabel="보통";dirColor="#D97706";}
  let expScore=0;
  if(direction==="up2")expScore+=45;else if(direction==="up")expScore+=35;else if(direction==="stable")expScore+=20;else if(direction==="down")expScore+=10;
  if(avgER>=5)expScore+=30;else if(avgER>=2)expScore+=15;
  if(freshRatio>=0.3)expScore+=20;else if(freshRatio>=0.1)expScore+=10;
  if(fVPD>10000)expScore+=10;
  const expLabel=expScore>=75?"매우높음":expScore>=55?"높음":expScore>=35?"보통":expScore>=20?"낮음":"매우낮음";
  const expColor=expScore>=75?"#059669":expScore>=55?"#10B981":expScore>=35?"#D97706":expScore>=20?"#EA580C":"#DC2626";
  return{direction,dirLabel,dirColor,expLabel,expColor,expScore,avgER:avgER.toFixed(2),freshRatio:(freshRatio*100).toFixed(0),fVPD,rVPD,oVPD,freshCount:fresh.length,recentCount:recent.length,oldCount:old.length};
}

/* ── 영상 조회수 스냅샷 추적 ── */
const _vTrackKey=id=>"vt_"+id;
function trackVideoView(videoId,views){
  try{
    const key=_vTrackKey(videoId);const raw=localStorage.getItem(key);
    const arr=raw?JSON.parse(raw):[];
    const now=Date.now();const lastTs=arr.length?arr[arr.length-1].ts:0;
    /* 최소 30분 간격으로 기록 */
    if(now-lastTs<1800000&&arr.length>0)return arr;
    arr.push({ts:now,v:parseInt(views)||0});
    /* 최대 200개 보관 */
    const trimmed=arr.length>200?arr.slice(-200):arr;
    localStorage.setItem(key,JSON.stringify(trimmed));return trimmed;
  }catch(e){return[];}
}
function getVideoTrack(videoId){
  try{const raw=localStorage.getItem(_vTrackKey(videoId));return raw?JSON.parse(raw):[];}catch(e){return[];}
}

    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.async=true;
    s.onload=()=>resolve();
    s.onerror=()=>{_gisPromise=null;reject(new Error("Google 로그인 스크립트 로드 실패 - 네트워크를 확인해주세요"));};
    document.head.appendChild(s);
  });
  return _gisPromise;
}
async function oauthLogin(clientId){
  if(oauthIsFile())throw new Error("Google 로그인은 https 주소에서만 작동합니다");
  if(!clientId)throw new Error("OAuth 클라이언트 ID를 입력해주세요");
  _oauth.clientId=clientId;
  try{localStorage.setItem("oauth_client_id",clientId);}catch(e){}
  await loadGis();
  return new Promise((resolve,reject)=>{
    try{
      const tc=google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:"https://www.googleapis.com/auth/yt-analytics.readonly https://www.googleapis.com/auth/youtube.readonly",
        callback:resp=>{
          if(resp.error){reject(new Error("Google 로그인 실패: "+resp.error));return;}
          _oauth.token=resp.access_token;
          /* expires_in 기반 만료시각 - 5분 여유 */
          _oauth.expiry=Date.now()+(parseInt(resp.expires_in)||3600)*1000-300000;
          try{localStorage.setItem("oauth_token",_oauth.token);localStorage.setItem("oauth_expiry",String(_oauth.expiry));}catch(e){}
          resolve(true);
        },
        error_callback:err=>{reject(new Error("Google 로그인이 취소되었거나 실패했습니다"+(err?.type?" ["+err.type+"]":"")));}
      });
      tc.requestAccessToken();
    }catch(e){reject(e);}
  });
}
function oauthLogout(){

  _oauth.token=null;_oauth.expiry=0;
  try{localStorage.removeItem("oauth_token");localStorage.removeItem("oauth_expiry");}catch(e){}

}

/* ── YouTube Analytics API - 내 채널 영상의 실측 일별 지표 ── */
async function ytaVideoDaily(videoId,publishedAt){
  if(!oauthReady())throw new Error("Google 연동이 필요합니다");
  const fmtD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const today=new Date();
  const pub=new Date(publishedAt||Date.now());
  const minStart=new Date(today.getTime()-365*86400000); /* 최대 365일 전까지 */
  const start=pub>minStart?pub:minStart;
  const callYta=async metrics=>{
    const params=new URLSearchParams({ids:"channel==MINE",startDate:fmtD(start),endDate:fmtD(today),metrics,dimensions:"day",filters:"video=="+videoId,sort:"day"});
    const r=await fetch("https://youtubeanalytics.googleapis.com/v2/reports?"+params.toString(),{headers:{Authorization:"Bearer "+_oauth.token}});
    const d=await r.json();
    if(d.error){
      if(r.status===401||d.error.code===401){
        /* 토큰 만료 처리 */
        _oauth.token=null;_oauth.expiry=0;
        try{localStorage.removeItem("oauth_token");localStorage.removeItem("oauth_expiry");}catch(e){}
        throw new Error("로그인이 만료되었습니다 - 다시 로그인해주세요");
      }
      const err=new Error(d.error.message||"Analytics API 오류");err.status=d.error.code||r.status;throw err;
    }
    return d;
  };
  const d1=await callYta("views,estimatedMinutesWatched,averageViewDuration");
  const rows=(d1.rows||[]).map(r=>({date:r[0],views:r[1]||0,minutes:r[2]||0,avgDur:r[3]||0}));
  /* 노출수·CTR은 API 공개 여부가 불확실 - 성공하는 경우에만 병합, 400 등 오류는 조용히 무시 */
  try{
    const d2=await callYta("impressions,impressionsClickThroughRate");
    const impMap={};
    (d2.rows||[]).forEach(r=>{impMap[r[0]]={impressions:r[1]||0,ctr:r[2]||0};});
    rows.forEach(row=>{const m=impMap[row.date];if(m){row.impressions=m.impressions;row.ctr=m.ctr;}});
  }catch(e){/* impressions 미지원 - 무시 */}
  return rows;
}
/* 분 단위를 X시간 Y분 형태로 */
const fmtMinutes=m=>{m=Math.round(m||0);const h=Math.floor(m/60);const mm=m%60;return h>0?`${fmtN(h)}시간 ${mm}분`:`${mm}분`;};
/* 초 단위를 M분 S초 형태로 */
const fmtSecDur=s=>{s=Math.round(s||0);const mn=Math.floor(s/60);return mn>0?`${mn}분 ${s%60}초`:`${s}초`;};

function GrowthModal({video,onClose,apiKey,isOwn=false}){

  /* 내 채널 영상 + OAuth 연동 시 실측 일별 데이터 자동 로드 */
  const[ytaData,setYtaData]=useState(null);
  const[ytaLoading,setYtaLoading]=useState(false);
  const[ytaErr,setYtaErr]=useState("");
  useEffect(()=>{
    if(!isOwn||!oauthReady())return;
    let alive=true;
    setYtaLoading(true);setYtaErr("");
    ytaVideoDaily(video.videoId,video.publishedAt)
      .then(rows=>{
        if(!alive)return;
        if(rows&&rows.length)setYtaData(rows);
        else setYtaErr("아직 집계된 실측 데이터가 없습니다");
      })
      .catch(e=>{if(alive)setYtaErr(e.message||"실측 데이터 로드 실패");})
      .finally(()=>{if(alive)setYtaLoading(false);});
    return()=>{alive=false;};
  },[isOwn,video.videoId]);
  /* 실측 데이터를 차트 포맷으로 변환 - 일별 조회수 + 누적 */
  const realChartData=useMemo(()=>{
    if(!ytaData||!ytaData.length)return null;
    let cum=0;
    return ytaData.map((r,i)=>{const d=new Date(r.date);cum+=r.views;return{date:`${d.getMonth()+1}/${d.getDate()}`,views:r.views,cum,day:i+1};});
  },[ytaData]);
  /* 실측 시청 지표 요약 */
  const ytaStats=useMemo(()=>{
    if(!ytaData||!ytaData.length)return null;
    const totalViews=ytaData.reduce((s,r)=>s+r.views,0);
    const totalMin=ytaData.reduce((s,r)=>s+r.minutes,0);
    const weighted=ytaData.reduce((s,r)=>s+(r.avgDur||0)*r.views,0);
    const avgDur=totalViews>0?Math.round(weighted/totalViews):0;
    const hasImp=ytaData.some(r=>r.impressions!==undefined);
    const totalImp=hasImp?ytaData.reduce((s,r)=>s+(r.impressions||0),0):0;
    const avgCtr=hasImp&&totalImp>0?ytaData.reduce((s,r)=>s+(r.ctr||0)*(r.impressions||0),0)/totalImp:0;
    return{totalViews,totalMin,avgDur,hasImp,totalImp,avgCtr};
  },[ytaData]);
  /* 스냅샷 기록 + 불러오기 */
  const snapshots=useMemo(()=>trackVideoView(video.videoId,views),[video.videoId,views]);
  /* 차트 데이터: 일별 추정 (감쇄 모델) + 실측 스냅샷 보정 */
  const chartData=useMemo(()=>{
    const uploadTs=new Date(video.publishedAt||Date.now()).getTime();
    const nowTs=Date.now();const totalDays=Math.max(1,Math.round((nowTs-uploadTs)/86400000));
    /* 앵커 포인트 정렬 */
    const anchors=[{ts:uploadTs,v:0}];
    snapshots.forEach(s=>anchors.push(s));
    anchors.sort((a,b)=>a.ts-b.ts);
    /* 마지막 앵커의 조회수로 총 조회수 확정 */
    const totalV=anchors[anchors.length-1].v||views;
    /* 샘플 간격: 최대 120포인트 */
    const step=totalDays>120?Math.ceil(totalDays/120):1;
    const hasRealData=snapshots.length>=2;
    /* 감쇄 모델 파라미터: 영상 수명에 따라 λ 조정 */
    const lambda=totalDays<=7?0.5:totalDays<=30?0.15:totalDays<=90?0.08:0.05;
    const decayNorm=1-Math.exp(-lambda*totalDays);
    /* 앵커 사이 보간 함수 */
    const interpV=(dayTs)=>{
      let bef=anchors[0],aft=anchors[anchors.length-1];
      for(let i=0;i<anchors.length-1;i++){if(anchors[i].ts<=dayTs&&anchors[i+1].ts>=dayTs){bef=anchors[i];aft=anchors[i+1];break;}}
      if(aft.ts===bef.ts)return aft.v;
      const ratio=(dayTs-bef.ts)/(aft.ts-bef.ts);return Math.round(bef.v+(aft.v-bef.v)*ratio);
    };
    /* 일별 누적 포인트 생성 */
    const pts=[];
    for(let d=0;d<=totalDays;d+=step){
      const dayTs=uploadTs+d*86400000;const dt=new Date(dayTs);
      let cum;
      if(hasRealData){cum=interpV(dayTs);}
      else{const decayRatio=(1-Math.exp(-lambda*d))/decayNorm;cum=Math.round(totalV*Math.min(decayRatio,1));}
      pts.push({date:`${dt.getMonth()+1}/${dt.getDate()}`,cum,day:d});
    }
    /* 마지막 날이 빠졌으면 추가 */
    if(pts.length&&pts[pts.length-1].day<totalDays){
      const dt=new Date(nowTs);pts.push({date:`${dt.getMonth()+1}/${dt.getDate()}`,cum:totalV,day:totalDays});
    }
    /* 일별 증가량 계산 */
    return pts.map((p,i)=>({...p,views:i>0?Math.max(0,p.cum-pts[i-1].cum):0}));
  },[snapshots,video.publishedAt,views,days]);
  const isEstimated=snapshots.length<2;
  /* 실제 성장률 분석 */
  const growthAnalysis=useMemo(()=>{
    if(snapshots.length<2)return null;
    const first=snapshots[0];const last=snapshots[snapshots.length-1];
    const daysBetween=Math.max(1,(last.ts-first.ts)/86400000);
    const viewGain=last.v-first.v;
    const dailyGrowth=Math.round(viewGain/daysBetween);
    /* 최근 vs 이전 속도 비교 */
    let trend="stable";let trendLabel="유지";let trendColor="#D97706";
    if(snapshots.length>=3){
      const mid=snapshots[Math.floor(snapshots.length/2)];
      const firstHalfDays=Math.max(1,(mid.ts-first.ts)/86400000);
      const secondHalfDays=Math.max(1,(last.ts-mid.ts)/86400000);
      const firstRate=(mid.v-first.v)/firstHalfDays;
      const secondRate=(last.v-mid.v)/secondHalfDays;
      if(firstRate>0){
        const ratio=secondRate/firstRate;
        if(ratio>=1.3){trend="accelerating";trendLabel="가속 중";trendColor="#059669";}
        else if(ratio>=0.7){trend="stable";trendLabel="유지";trendColor="#D97706";}

    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.5)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:14,width:"100%",maxWidth:820,padding:24,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.15)"}} onClick={e=>e.stopPropagation()}>
        {/* 영상 정보 헤더 */}
        <div style={{display:"flex",gap:14,marginBottom:14,alignItems:"flex-start"}}>
          <a href={`https://www.youtube.com/watch?v=${video.videoId}`} target="_blank" rel="noreferrer">
            <img src={video.thumbnail} alt="" style={{width:160,height:90,borderRadius:8,objectFit:"cover",flexShrink:0}}/>
          </a>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <a href={`https://www.youtube.com/watch?v=${video.videoId}`} target="_blank" rel="noreferrer" style={{color:"#0F172A",fontWeight:700,fontSize:14,lineHeight:1.4,flex:1,display:"block",marginBottom:4}}>{video.title}</a>
              <button onClick={onClose} style={{background:"#F1F5F9",border:"none",borderRadius:6,padding:"5px 10px",color:"#64748B",cursor:"pointer",fontSize:16,flexShrink:0}}>×</button>
            </div>
            <div style={{color:"#64748B",fontSize:12,marginBottom:8}}>{video.channel} · {video.uploadDays}일 전 · {video.duration}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[{l:"조회수",v:fmtN(video.views),c:"#1B3EC3"},{l:"구독자",v:fmtN(video.subscribers),c:"#1D4ED8"},{l:"반응도",v:video.engagementRate+"%",c:"#D97706"},{l:"일평균",v:fmtN(Math.round(views/days))+"회",c:"#059669"}].map(s=>(
                <div key={s.l} style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:6,padding:"4px 8px"}}>
                  <div style={{color:"#94A3B8",fontSize:8}}>{s.l}</div>
                  <div style={{color:s.c,fontFamily:"monospace",fontSize:12,fontWeight:700}}>{s.v}</div>
                </div>
              ))}
              <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:6,padding:"4px 8px"}}><div style={{color:"#94A3B8",fontSize:8}}>노출등급</div><GradeBadge grade={video.exposureGrade}/></div>
            </div>
          </div>
        </div>

        {/* 탭 네비게이션 */}
        <div style={{display:"flex",gap:4,marginBottom:14,background:"#F1F5F9",borderRadius:10,padding:4}}>
          {[{id:"growth",label:"추이 분석"},{id:"deep",label:"심층 분석"},{id:"feedback",label:"커밍쏜 피드백"}].map(t=>(
            <button key={t.id} onClick={()=>{setModalTab(t.id);if(t.id==="deep")runDeepAnalysis();if(t.id==="feedback")runFeedbackAnalysis();}}
              style={{flex:1,padding:"9px 12px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:modalTab===t.id?700:500,
                background:modalTab===t.id?"#fff":"transparent",color:modalTab===t.id?"#0F172A":"#64748B",
                boxShadow:modalTab===t.id?"0 1px 3px rgba(0,0,0,.08)":"none",transition:"all .2s"}}>
              {t.label}
            </button>
          ))}
        </div>

        {/* 탭 1: 추이 분석 (기존 내용) */}
        {modalTab==="growth"&&<>
          <div style={{background:currentStatus.color+"10",border:`1.5px solid ${currentStatus.color}30`,borderRadius:10,padding:"12px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:12}}>
            <span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:currentStatus.color,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{color:currentStatus.color,fontWeight:800,fontSize:14,marginBottom:2}}>현재 노출 상태: {currentStatus.label}</div>
              <div style={{color:"#64748B",fontSize:12}}>{currentStatus.desc}</div>
            </div>
          </div>
          {/* 실측 성장 데이터 */}
          {growthAnalysis&&<div style={{background:"linear-gradient(135deg,#ECFDF5,#F0FDF4)",border:"1.5px solid #D1FAE5",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <div style={{fontSize:13,fontWeight:700,color:"#065F46"}}>실측 조회수 변화</div>
              <div style={{fontSize:10,color:"#059669",background:"#fff",padding:"2px 8px",borderRadius:10,border:"1px solid #D1FAE5"}}>스냅샷 {growthAnalysis.snapshotCount}회 · {growthAnalysis.daysBetween}일간 추적</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              <div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>실측 일평균 증가</div>
                <div style={{fontSize:16,fontWeight:800,color:growthAnalysis.dailyGrowth>0?"#059669":"#DC2626",fontFamily:"monospace"}}>+{fmtN(growthAnalysis.dailyGrowth)}<span style={{fontSize:10,fontWeight:500}}>/일</span></div>
              </div>
              <div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>추적 기간 증가량</div>
                <div style={{fontSize:14,fontWeight:700,color:"#1E293B",fontFamily:"monospace"}}>+{fmtN(growthAnalysis.viewGain)}</div>
              </div>
              <div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>성장 추세</div>
                <div style={{fontSize:14,fontWeight:700,color:growthAnalysis.trendColor}}>{growthAnalysis.trendLabel}</div>
              </div>
            </div>
          </div>}

          {/* 실측 로딩 상태 (YouTube Analytics) */}
          {isOwn&&ytaLoading&&<div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:10,padding:"6px 14px",marginBottom:14}}>
            <Dots label="YouTube Analytics 실측 데이터 불러오는 중..."/>
          </div>}

          {/* 실측 시청 지표 스탯 카드 */}
          {ytaStats&&<div style={{background:"linear-gradient(135deg,#ECFDF5,#F0FDF4)",border:"1.5px solid #D1FAE5",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <div style={{fontSize:13,fontWeight:700,color:"#065F46"}}>실측 시청 지표</div>
              <div style={{fontSize:10,color:"#059669",background:"#fff",padding:"2px 8px",borderRadius:10,border:"1px solid #D1FAE5"}}>YouTube Analytics · {ytaData.length}일치</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
              <div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>실측 조회수 합계</div>
                <div style={{fontSize:15,fontWeight:800,color:"#059669",fontFamily:"monospace"}}>{fmtN(ytaStats.totalViews)}</div>
              </div>
              <div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>총 시청시간</div>
                <div style={{fontSize:14,fontWeight:700,color:"#0F172A",fontFamily:"monospace"}}>{fmtMinutes(ytaStats.totalMin)}</div>
              </div>
              <div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>평균 시청지속시간</div>
                <div style={{fontSize:14,fontWeight:700,color:"#0F172A",fontFamily:"monospace"}}>{fmtSecDur(ytaStats.avgDur)}</div>
              </div>
              {ytaStats.hasImp&&<div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>노출수</div>
                <div style={{fontSize:14,fontWeight:700,color:"#1B3EC3",fontFamily:"monospace"}}>{fmtN(ytaStats.totalImp)}</div>
              </div>}
              {ytaStats.hasImp&&<div style={{background:"#fff",borderRadius:8,padding:"8px 12px",border:"1px solid #D1FAE5"}}>
                <div style={{fontSize:9,color:"#6B7280"}}>노출 클릭률 CTR</div>
                <div style={{fontSize:14,fontWeight:700,color:"#EA580C",fontFamily:"monospace"}}>{ytaStats.avgCtr.toFixed(2)}%</div>
              </div>}
            </div>
          </div>}

          {/* 조회수 추이 차트 */}
          <div style={{background:"#F8FAFC",borderRadius:10,padding:16,marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
              <div style={{color:"#0F172A",fontSize:13,fontWeight:700}}>일별 / 누적 조회수 추이</div>
              {realChartData?<div style={{background:"#D1FAE5",color:"#065F46",fontSize:9,padding:"2px 8px",borderRadius:10,fontWeight:700}}>실측 데이터 (YouTube Analytics)</div>
                :isEstimated?<div style={{background:"#FEF3C7",color:"#92400E",fontSize:9,padding:"2px 8px",borderRadius:10,fontWeight:600}}>감쇄곡선 추정</div>
                :<div style={{background:"#D1FAE5",color:"#065F46",fontSize:9,padding:"2px 8px",borderRadius:10,fontWeight:600}}>실측 기반</div>}
            </div>
            <div style={{color:"#94A3B8",fontSize:10,marginBottom:10}}>
              {realChartData?"YouTube Analytics 일별 실측 "+realChartData.length+"일치":isEstimated?"유튜브 감쇄곡선 모델 기반 일별 추정":"실측 스냅샷 "+snapshots.length+"개 보간"} · 업로드 후 {days}일 · 현재 {fmtN(views)}회 · <span style={{color:"#059669"}}>■ 누적</span> <span style={{color:"#94A3B8"}}>■ 일별</span>
            </div>
            <SvgChart data={realChartData||chartData} w={700} h={220}/>
            {!realChartData&&isEstimated&&<div style={{background:"#FFFBEB",border:"1px solid #FBEAB8",borderRadius:8,padding:"8px 12px",marginTop:8}}>
              <div style={{fontSize:10,color:"#92400E",lineHeight:1.5}}>현재는 총 조회수({fmtN(views)})를 감쇄곡선으로 일별 분배한 추정 그래프입니다. 시간을 두고 재방문하면 실측 데이터 포인트가 쌓여 실제 추이로 자동 전환됩니다.</div>
            </div>}
            {isOwn&&!realChartData&&!ytaLoading&&<div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:8,padding:"8px 12px",marginTop:8}}>
              <div style={{fontSize:10,color:"#065F46",lineHeight:1.5}}>Google 연동하면 실측 일별 데이터를 볼 수 있습니다{ytaErr?" — "+ytaErr:""}</div>
            </div>}
          </div>

          {/* 기본 지표 요약 */}
          <div style={{marginBottom:14}}>
            <div style={{color:"#0F172A",fontSize:13,fontWeight:700,marginBottom:8}}>핵심 지표</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              {[{l:"업로드 후",v:`${days}일`,c:"#1B3EC3"},{l:"총 조회수",v:fmtN(views),c:"#1E3A8A"},{l:"전체 일평균",v:fmtN(Math.round(views/days))+"/일",c:"#059669"},
                {l:"반응도",v:video.engagementRate+"%",c:"#D97706"},{l:"바이럴 지수",v:String(video.viralScore),c:"#EA580C"},{l:"노출 등급",v:video.exposureGrade||"-",c:"#1D4ED8"}
              ].map(s=><div key={s.l} style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                <div style={{fontSize:9,color:"#94A3B8"}}>{s.l}</div>
                <div style={{fontSize:14,fontWeight:700,color:s.c,fontFamily:"monospace",marginTop:2}}>{s.v}</div>
              </div>)}
            </div>
          </div>
        </>}

        {/* 탭 2: 심층 분석 */}
        {modalTab==="deep"&&<>
          {deepLoading&&<div style={{textAlign:"center",padding:"40px 0"}}>
            <div style={{width:28,height:28,margin:"0 auto 10px",border:"3px solid #E2E8F0",borderTopColor:"#1B3EC3",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
            <div style={{color:"#64748B",fontSize:13}}>AI가 영상을 심층 분석하고 있습니다...</div>
            <div style={{color:"#94A3B8",fontSize:11,marginTop:4}}>클릭률 · 소재 · 대본 3관점 분석 중</div>
          </div>}
          {deepAnalysis&&deepAnalysis._error&&<div style={{textAlign:"center",padding:"30px 0",color:"#DC2626"}}>
            <div style={{fontSize:13}}>{deepAnalysis._msg||"분석 실패"}</div>
            <button onClick={()=>{setDeepAnalysis(null);runDeepAnalysis();}} style={{marginTop:10,background:"#F1F5F9",border:"1px solid #E2E8F0",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",color:"#64748B"}}>다시 시도</button>
          </div>}
          {deepAnalysis&&!deepAnalysis._error&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
            {/* 종합 평가 */}
            <div style={{background:"#F5F8FF",border:"1px solid #D6E0F5",borderRadius:10,padding:14}}>
              <div style={{fontSize:13,fontWeight:700,color:"#1B3EC3",marginBottom:6}}>종합 평가</div>
              <div style={{fontSize:13,color:"#1E293B",lineHeight:1.6}}>{deepAnalysis.overallVerdict}</div>
            </div>

            {/* 클릭률 관점 */}
            {deepAnalysis.clickRate&&<div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:14}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0F172A"}}>클릭률 관점</div>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{background:"#EFF6FF",color:"#1B3EC3",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>{deepAnalysis.clickRate.grade}</div>
                  <div style={{background:"#E2E8F0",borderRadius:4,height:8,width:60,overflow:"hidden"}}><div style={{height:"100%",background:"#1E3A8A",borderRadius:4,width:`${deepAnalysis.clickRate.score}%`}}/></div>
                  <span style={{fontSize:11,color:"#64748B",fontFamily:"monospace"}}>{deepAnalysis.clickRate.score}점</span>
                </div>
              </div>
              {[{l:"제목 후킹",v:deepAnalysis.clickRate.titleHook},{l:"썸네일 전략",v:deepAnalysis.clickRate.thumbnailStrategy},{l:"키워드 최적화",v:deepAnalysis.clickRate.keywordOptimization}].map(item=>(
                <div key={item.l} style={{marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:2}}>{item.l}</div>
                  <div style={{fontSize:12,color:"#334155",lineHeight:1.5}}>{item.v}</div>
                </div>
              ))}
              {deepAnalysis.clickRate.improvements&&<div style={{background:"#F0F9FF",borderRadius:6,padding:8,marginTop:4}}>
                <div style={{fontSize:10,fontWeight:600,color:"#1B3EC3",marginBottom:4}}>개선 포인트</div>
                {deepAnalysis.clickRate.improvements.map((imp,i)=><div key={i} style={{fontSize:11,color:"#1E40AF",marginBottom:2}}>• {imp}</div>)}
              </div>}
            </div>}

            {/* 소재 관점 */}
            {deepAnalysis.content&&<div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:14}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0F172A"}}>소재 관점</div>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{background:"#F0FDF4",color:"#16A34A",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>{deepAnalysis.content.grade}</div>
                  <div style={{background:"#E2E8F0",borderRadius:4,height:8,width:60,overflow:"hidden"}}><div style={{height:"100%",background:"#16A34A",borderRadius:4,width:`${deepAnalysis.content.score}%`}}/></div>
                  <span style={{fontSize:11,color:"#64748B",fontFamily:"monospace"}}>{deepAnalysis.content.score}점</span>
                </div>
              </div>
              {[{l:"타이밍",v:deepAnalysis.content.topicTiming},{l:"차별점",v:deepAnalysis.content.marketGap},{l:"시청자 니즈",v:deepAnalysis.content.audienceNeed},{l:"경쟁 상황",v:deepAnalysis.content.competition}].map(item=>(
                <div key={item.l} style={{marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:2}}>{item.l}</div>
                  <div style={{fontSize:12,color:"#334155",lineHeight:1.5}}>{item.v}</div>
                </div>
              ))}
              {deepAnalysis.content.improvements&&<div style={{background:"#F0FDF4",borderRadius:6,padding:8,marginTop:4}}>
                <div style={{fontSize:10,fontWeight:600,color:"#16A34A",marginBottom:4}}>개선 포인트</div>
                {deepAnalysis.content.improvements.map((imp,i)=><div key={i} style={{fontSize:11,color:"#166534",marginBottom:2}}>• {imp}</div>)}
              </div>}
            </div>}

            {/* 대본 관점 */}
            {deepAnalysis.script&&<div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:14}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0F172A"}}>대본 관점</div>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{background:"#FFF7ED",color:"#EA580C",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>{deepAnalysis.script.grade}</div>
                  <div style={{background:"#E2E8F0",borderRadius:4,height:8,width:60,overflow:"hidden"}}><div style={{height:"100%",background:"#EA580C",borderRadius:4,width:`${deepAnalysis.script.score}%`}}/></div>
                  <span style={{fontSize:11,color:"#64748B",fontFamily:"monospace"}}>{deepAnalysis.script.score}점</span>
                </div>
              </div>
              {[{l:"첫 30초 후킹",v:deepAnalysis.script.hookStructure},{l:"시청 유지 전략",v:deepAnalysis.script.retentionStrategy},{l:"스토리텔링",v:deepAnalysis.script.storytelling},{l:"CTA 전략",v:deepAnalysis.script.cta}].map(item=>(
                <div key={item.l} style={{marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:2}}>{item.l}</div>
                  <div style={{fontSize:12,color:"#334155",lineHeight:1.5}}>{item.v}</div>
                </div>
              ))}
              {deepAnalysis.script.improvements&&<div style={{background:"#FFF7ED",borderRadius:6,padding:8,marginTop:4}}>
                <div style={{fontSize:10,fontWeight:600,color:"#EA580C",marginBottom:4}}>개선 포인트</div>
                {deepAnalysis.script.improvements.map((imp,i)=><div key={i} style={{fontSize:11,color:"#9A3412",marginBottom:2}}>• {imp}</div>)}
              </div>}
            </div>}

            {/* 당장 실행할 액션 */}
            {deepAnalysis.actionItems&&<div style={{background:"#FFFBEB",border:"1px solid #FBEAB8",borderRadius:10,padding:14}}>
              <div style={{fontSize:13,fontWeight:700,color:"#92400E",marginBottom:8}}>당장 참고할 액션</div>
              {deepAnalysis.actionItems.map((a,i)=><div key={i} style={{fontSize:12,color:"#78350F",marginBottom:4,display:"flex",gap:6}}>
                <span style={{color:"#D97706",fontWeight:700}}>{i+1}.</span>{a}
              </div>)}
            </div>}
          </div>}
          {!deepLoading&&!deepAnalysis&&!apiKey&&<div style={{textAlign:"center",padding:"30px 0",color:"#94A3B8"}}>
            <div style={{fontSize:13}}>AI 분석을 위해 설정에서 API 키를 입력해주세요</div>
          </div>}
        </>}

        {/* 탭 3: 커밍쏜 피드백 */}
        {modalTab==="feedback"&&<>
          {feedbackLoading&&<div style={{textAlign:"center",padding:"40px 0"}}>
            <div style={{width:28,height:28,margin:"0 auto 10px",border:"3px solid #E2E8F0",borderTopColor:"#1B3EC3",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
            <div style={{color:"#64748B",fontSize:13}}>커밍쏜 디렉터 관점으로 분석 중...</div>
            <div style={{color:"#94A3B8",fontSize:11,marginTop:4}}>퍼스널메이커스 피드백 프레임워크 적용 중</div>
          </div>}
          {feedbackAnalysis&&feedbackAnalysis._error&&<div style={{textAlign:"center",padding:"30px 0",color:"#DC2626"}}>
            <div style={{fontSize:13}}>{feedbackAnalysis._msg||"분석 실패"}</div>
            <button onClick={()=>{setFeedbackAnalysis(null);runFeedbackAnalysis();}} style={{marginTop:10,background:"#F1F5F9",border:"1px solid #E2E8F0",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",color:"#64748B"}}>다시 시도</button>

          {feedbackAnalysis&&!feedbackAnalysis._error&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
            {/* 디렉터 노트 */}
            <div style={{background:"linear-gradient(135deg,#FDF4FF,#FFF1F2)",border:"1px solid #93C5FD",borderRadius:10,padding:14}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:700,color:"#1D4ED8"}}>디렉터 노트</div>
                {feedbackAnalysis.overallGrade&&<div style={{background:"#1D4ED8",color:"#fff",padding:"4px 12px",borderRadius:20,fontSize:13,fontWeight:800}}>{feedbackAnalysis.overallGrade}</div>}

                <div style={{fontSize:12,color:"#1E40AF"}}>{feedbackAnalysis.weeklyFocus}</div>

              return(<div key={item.key} style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:14}}>

                  <div style={{fontSize:12,fontWeight:700,color:"#0F172A"}}>{item.label}</div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    {data.verdict&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:10,fontWeight:600,
                      background:data.verdict==="pass"?"#DCFCE7":data.verdict==="fail"?"#FEE2E2":"#FEF3C7",
                      color:data.verdict==="pass"?"#16A34A":data.verdict==="fail"?"#DC2626":"#D97706"
                    }}>{data.verdict==="pass"?"PASS":data.verdict==="fail"?"FAIL":"PARTIAL"}</span>}
                    <div style={{background:"#E2E8F0",borderRadius:4,height:8,width:50,overflow:"hidden"}}><div style={{height:"100%",background:item.color,borderRadius:4,width:`${data.score}%`}}/></div>
                    <span style={{fontSize:11,color:"#64748B",fontFamily:"monospace"}}>{data.score}점</span>
                  </div>
                </div>
                {/* title 항목일 때 심화 분석 */}
                {item.key==="title"&&(<div>
                  {data.hookType&&<div style={{marginBottom:6}}><span style={{fontSize:10,padding:"2px 8px",borderRadius:10,fontWeight:600,background:"#FFF7ED",color:"#EA580C",border:"1px solid #FED7AA"}}>후킹 유형: {data.hookType}</span></div>}
                  {data.hookAnalysis&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5,marginBottom:4}}>{data.hookAnalysis}</div>}
                  {data.seoAnalysis&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5,marginBottom:4}}>{data.seoAnalysis}</div>}
                  {data.emotionTrigger&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5,marginBottom:4}}>{data.emotionTrigger}</div>}
                  {data.improvements&&<div style={{marginTop:6,background:item.bg,borderRadius:6,padding:8}}>
                    <div style={{fontSize:10,fontWeight:600,color:item.color,marginBottom:3}}>제목 개선안</div>
                    {data.improvements.map((s,i)=><div key={i} style={{fontSize:11,color:"#334155",marginBottom:2}}>• {s}</div>)}
                  </div>}
                </div>)}
                {/* topic 항목일 때 소재 분석 */}
                {item.key==="topic"&&(<div>
                  {data.trendFit&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5,marginBottom:4}}>{data.trendFit}</div>}
                  {data.competition&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5,marginBottom:4}}>{data.competition}</div>}
                  {data.differentiation&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5,marginBottom:4}}>{data.differentiation}</div>}
                  {data.audienceNeed&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5}}>{data.audienceNeed}</div>}
                </div>)}
                {/* 기본 analysis 텍스트 (title, topic 외 항목) */}
                {item.key!=="title"&&item.key!=="topic"&&<div style={{fontSize:12,color:"#334155",lineHeight:1.5}}>{data.analysis}</div>}
                {/* messageClarity일 때 핵심 메시지 */}
                {item.key==="messageClarity"&&data.mainMessage&&<div style={{marginTop:6,background:item.bg,borderRadius:6,padding:"6px 10px"}}>
                  <div style={{fontSize:10,color:item.color,fontWeight:600}}>핵심 메시지</div>
                  <div style={{fontSize:12,color:"#1E293B",fontWeight:500}}>{`"${data.mainMessage}"`}</div>
                </div>}
                {/* targeting일 때 추정 타겟 */}
                {item.key==="targeting"&&data.estimatedTarget&&<div style={{marginTop:6,background:item.bg,borderRadius:6,padding:"6px 10px"}}>
                  <div style={{fontSize:10,color:item.color,fontWeight:600}}>추정 타겟</div>
                  <div style={{fontSize:12,color:"#1E293B",fontWeight:500}}>{data.estimatedTarget}</div>
                </div>}
              </div>);
            })}
          </div>}
          {!feedbackLoading&&!feedbackAnalysis&&!apiKey&&<div style={{textAlign:"center",padding:"30px 0",color:"#94A3B8"}}>
            <div style={{fontSize:13}}>AI 분석을 위해 설정에서 API 키를 입력해주세요</div>
          </div>}
        </>}

        {/* YouTube 링크 (항상 하단에 표시) */}
        <a href={`https://www.youtube.com/watch?v=${video.videoId}`} target="_blank" rel="noreferrer"
          style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"#DC2626",borderRadius:8,padding:"11px 0",color:"#fff",fontWeight:700,fontSize:14,textDecoration:"none",marginTop:14}}>
          YouTube에서 영상 보기
        </a>
      </div>
    </div>
  );

}

/* ── 영상 카드 ── */
const VideoCard=React.memo(function VideoCard({video:v,index,isSaved,onSave,onChart,isVsSelected,onVsToggle}){
  const eg=v.exposureGrade;
  const expC=eg==="매우높음"?"#DC2626":eg==="높음"?"#EA580C":eg==="보통"?"#D97706":eg==="낮음"?"#64748B":"#94A3B8";
  const expBg=eg==="매우높음"?"#FEF2F2":eg==="높음"?"#FFF7ED":eg==="보통"?"#FFFBEB":"#F8FAFC";
  const er=parseFloat(v.engagementRate)||0;
  const erC=er>=5?"#059669":er>=2?"#D97706":"#94A3B8";
  const vpd=v.uploadDays>0?Math.round(v.views/v.uploadDays):v.views;
  /* 일별 조회수 추이 미니그래프 데이터 생성 */
  const miniData=useMemo(()=>{
    const days=Math.max(v.uploadDays||1,1);const total=v.views||0;
    const pts=Math.min(days,14);const arr=[];
    for(let i=0;i<pts;i++){
      const progress=(i+1)/pts;
      const curve=Math.pow(progress,0.35);
      const jitter=1+(Math.sin(i*2.7+total%7)*0.12);
      arr.push(Math.round(total*curve*jitter));
    }
    return arr;
  },[v.views,v.uploadDays]);
  /* SVG 미니 스파크라인 */
  const sparkW=80,sparkH=36;
  const maxV=Math.max(...miniData,1);
  const sparkPoints=miniData.map((val,i)=>{
    const x=(i/(miniData.length-1||1))*sparkW;
    const y=sparkH-(val/maxV)*sparkH*0.85;
    return `${x},${y}`;
  }).join(" ");
  const sparkArea=`0,${sparkH} ${sparkPoints} ${sparkW},${sparkH}`;
  return(
    <div className="fade" style={{background:"#fff",borderRadius:12,border:`1px solid #E8EDF2`,boxShadow:"0 1px 3px rgba(0,0,0,.04)",overflow:"hidden",transition:"box-shadow .2s,border-color .2s"}}
      onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 16px rgba(37,99,235,.1)";e.currentTarget.style.borderColor="#BFDBFE";}}
      onMouseLeave={e=>{e.currentTarget.style.boxShadow="0 1px 3px rgba(0,0,0,.04)";e.currentTarget.style.borderColor="#E8EDF2";}}>
      <div style={{display:"flex",gap:0}}>
        {/* 썸네일 */}
        <div onClick={onChart} style={{position:"relative",width:200,minWidth:200,height:112,cursor:"pointer",flexShrink:0,background:"#0F172A"}}>
          <img src={v.thumbnail} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block",opacity:.95}}/>
          <div style={{position:"absolute",bottom:6,right:6,background:"rgba(0,0,0,.8)",color:"#fff",fontSize:10,padding:"2px 6px",borderRadius:4,fontFamily:"'SF Mono',monospace",fontWeight:600,letterSpacing:".3px"}}>{v.duration}</div>
          {v.uploadDays<7&&<div style={{position:"absolute",top:6,left:6,background:"#DC2626",color:"#fff",fontSize:9,fontWeight:700,padding:"3px 6px",borderRadius:4}}>NEW</div>}
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",opacity:0,transition:"opacity .15s",background:"rgba(15,23,42,.3)"}}
            onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0}>
            <div style={{background:"#fff",borderRadius:8,padding:"6px 14px",fontSize:11,fontWeight:700,color:"#1E40AF",boxShadow:"0 2px 8px rgba(0,0,0,.15)"}}>추이 분석</div>
          </div>
        </div>
        {/* 콘텐츠 */}
        <div style={{flex:1,padding:"10px 14px",display:"flex",flexDirection:"column",justifyContent:"space-between",minWidth:0}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
              <span style={{background:v.videoType.bg,color:v.videoType.color,border:`1px solid ${v.videoType.border}`,fontSize:10,fontWeight:600,padding:"1px 8px",borderRadius:4}}>{v.videoType.label}</span>
              {v.subscribers>0&&v.subscribers<=100000&&v.views>=v.subscribers*0.3&&<span style={{background:"#F0FDF4",color:"#059669",border:"1px solid #D1FAE5",fontSize:10,fontWeight:600,padding:"1px 8px",borderRadius:4}}>소채널</span>}
              <span style={{background:expBg,color:expC,border:`1px solid ${expC}30`,fontSize:10,fontWeight:700,padding:"1px 8px",borderRadius:4}}>노출 {eg}</span>
              {v.dailyGrowth!=null&&<span style={{background:v.dailyGrowth>0?"#ECFDF5":"#FEF2F2",color:v.dailyGrowth>0?"#059669":"#DC2626",padding:"2px 6px",borderRadius:4,fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>{v.dailyGrowth>0?"+":""}{fmtN(v.dailyGrowth)}/일</span>}
            </div>
            <div onClick={onChart} style={{color:"#0F172A",fontWeight:600,fontSize:13,lineHeight:1.4,cursor:"pointer",marginBottom:3,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}
              onMouseEnter={e=>e.currentTarget.style.color="#1D4ED8"} onMouseLeave={e=>e.currentTarget.style.color="#0F172A"}>
              {v.title}
            </div>
            <div style={{color:"#64748B",fontSize:11}}>{v.channel} · {v.uploadDays}일 전</div>
          </div>
          {/* 지표 그리드 */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:2,marginTop:4}}>
            {[
              {label:"조회수",val:fmtN(v.views),color:"#1E40AF",bold:true},
              {label:"구독자",val:fmtN(v.subscribers),color:"#1D4ED8"},
              {label:"반응도",val:er.toFixed(1)+"%",color:erC},
              {label:"바이럴",val:v.viralScore+"/100",color:"#B45309"},
              {label:"일평균",val:"≈"+fmtVPD(vpd),color:"#0369A1"}
            ].map(m=>(
              <div key={m.label} style={{textAlign:"center",padding:"3px 0"}}>
                <div style={{fontSize:9,color:"#94A3B8",marginBottom:1}}>{m.label}</div>
                <div style={{fontSize:m.bold?13:11,fontWeight:700,color:m.color,fontFeatureSettings:"'tnum'",fontFamily:"system-ui"}}>{m.val}</div>
              </div>
            ))}
          </div>
        </div>
        {/* 우측: 미니 조회추이 + 액션 */}
        <div style={{width:100,minWidth:100,borderLeft:"1px solid #F1F5F9",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"space-between",padding:"8px 6px",background:"#FAFBFC"}}>
          {/* 미니 스파크라인 차트 */}
          <div style={{textAlign:"center",width:"100%"}}>
            <div style={{fontSize:8,color:"#94A3B8",fontWeight:600,marginBottom:2}}>추정 성장곡선</div>
            <svg width={sparkW} height={sparkH} viewBox={`0 0 ${sparkW} ${sparkH}`} style={{display:"block",margin:"0 auto",opacity:0.6}}>
              <defs>
                <linearGradient id={`sg${index}`} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={expC} stopOpacity="0.25"/>
                  <stop offset="100%" stopColor={expC} stopOpacity="0.02"/>
                </linearGradient>
              </defs>
              <polygon points={sparkArea} fill={`url(#sg${index})`}/>
              <polyline points={sparkPoints} fill="none" stroke={expC} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3,2"/>
              <circle cx={sparkW} cy={parseFloat(sparkPoints.split(" ").pop().split(",")[1])||sparkH/2} r="2.5" fill={expC}/>
            </svg>
            <div style={{fontSize:9,fontWeight:700,color:expC,marginTop:1}}>≈{fmtVPD(vpd)}</div>
            <div style={{fontSize:6,color:"#CBD5E1",marginTop:0}}>일평균 추정</div>
          </div>
          {/* 액션 버튼 */}
          <div style={{display:"flex",flexDirection:"column",gap:3,width:"100%"}}>
            <div style={{display:"flex",gap:4}}>
              <a href={`https://www.youtube.com/watch?v=${v.videoId}`} target="_blank" rel="noreferrer"
                style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",background:"#DC2626",borderRadius:6,padding:"5px 0",color:"#fff",fontSize:10,fontWeight:600,textDecoration:"none"}}>보기</a>
              <button onClick={onSave} style={{flex:1,background:isSaved?"#059669":"#fff",border:`1px solid ${isSaved?"#059669":"#E2E8F0"}`,borderRadius:6,padding:"5px 0",color:isSaved?"#fff":"#64748B",cursor:"pointer",fontSize:10,fontWeight:600}}>
                {isSaved?"저장됨":"저장"}
              </button>
            </div>
            {onVsToggle&&<button onClick={onVsToggle} style={{background:isVsSelected?"#F97316":"#fff",border:`1px solid ${isVsSelected?"#F97316":"#E2E8F0"}`,borderRadius:6,padding:"3px 0",color:isVsSelected?"#fff":"#64748B",cursor:"pointer",fontSize:9,fontWeight:600}}>
              {isVsSelected?"VS 선택됨":"VS 비교"}
            </button>}
          </div>
        </div>
      </div>
    </div>
  );
},(prev,next)=>prev.video===next.video&&prev.isSaved===next.isSaved&&prev.isVsSelected===next.isVsSelected&&prev.index===next.index);


/* ── 결론 카드 (접기/펼치기) ── */
function ConclusionCard({videos,query,aiAction,aiLoading,onGenAI}){
  const[open,setOpen]=useState(true);
  const t=useMemo(()=>analyzeTrend(videos),[videos]);
  if(!t)return null;
  const smallWins=videos.filter(v=>v.subscribers>0&&v.subscribers<=100000&&v.views>=v.subscribers*0.3);
  const expBg=t.expLabel==="높음"?"#F0FDF4":t.expLabel==="보통"?"#FFFBEB":"#FEF2F2";
  const expBorder=t.expLabel==="높음"?"#D1FAE5":t.expLabel==="보통"?"#FBEAB8":"#FEE2E2";
  return(
    <div style={{background:expBg,border:`1px solid ${expBorder}`,borderRadius:12,overflow:"hidden",marginBottom:2}}>
      {/* 헤더 — 항상 표시 */}

          <div style={{color:"#64748B",fontSize:11,marginTop:1}}>실제 YouTube 데이터 {videos.length}개 분석 · 트렌드 {t.dirLabel} · 평균 반응도 {t.avgER}%</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{background:t.expColor+"20",border:`1px solid ${t.expColor}40`,borderRadius:8,padding:"5px 14px",textAlign:"center"}}>
            <div style={{color:"#64748B",fontSize:9}}>종합 점수</div>
            <div style={{color:t.expColor,fontFamily:"monospace",fontSize:20,fontWeight:900}}>{t.expScore}</div>

        </div>
      </button>
      {/* 펼쳐지는 본문 */}
      {open&&(
        <div style={{padding:"0 18px 18px"}}>
          <Divider/>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}}>
            {[
              {l:"트렌드 방향",v:t.dirLabel,c:t.dirColor},
              {l:"평균 반응도",v:t.avgER+"%",c:parseFloat(t.avgER)>=5?"#059669":parseFloat(t.avgER)>=2?"#D97706":"#EA580C"},
              {l:"소채널 성공",v:smallWins.length+"건",c:smallWins.length>=3?"#059669":smallWins.length>=1?"#D97706":"#EA580C"},
              {l:"최신 영상 비율",v:t.freshRatio+"%",c:parseInt(t.freshRatio)>=20?"#059669":"#D97706"},
            ].map(s=>(
              <div key={s.l} style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
                <div style={{color:"#94A3B8",fontSize:10,marginBottom:4}}>{s.l}</div>
                <div style={{color:s.c,fontFamily:"monospace",fontSize:13,fontWeight:700}}>{s.v}</div>
              </div>
            ))}
          </div>
          {/* 시간대별 바 차트 */}
          <div style={{background:"#fff",borderRadius:8,padding:"12px 16px",marginBottom:14}}>
            <div style={{color:"#64748B",fontSize:11,marginBottom:12}}>시간대별 일평균 조회수 — 초록 막대가 높을수록 지금도 소비되는 소재</div>

              {[{label:"2주 이내",vpd:t.fVPD,count:t.freshCount,color:"#059669"},{label:"2주~2달",vpd:t.rVPD,count:t.recentCount,color:"#3B82F6"},{label:"2달 이상",vpd:t.oVPD,count:t.oldCount,color:"#94A3B8"}].map((b,i)=>{

                return(

                    <div style={{color:b.color,fontSize:10,fontFamily:"monospace",fontWeight:700}}>{b.vpd>0?fmtVPD(b.vpd):"-"}</div>

                      <div style={{width:"100%",background:b.color,borderRadius:"3px 3px 0 0",height:`${Math.max(pct,b.vpd>0?4:0)}%`,transition:"height .6s"}}/>

                    <div style={{color:"#64748B",fontSize:9,textAlign:"center"}}>{b.label}</div>
                    <div style={{color:"#94A3B8",fontSize:9}}>({b.count}개)</div>
                  </div>
                );
              })}
            </div>
          </div>
          {/* AI 액션 가이드 */}
          {aiAction?._error&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:12,color:"#DC2626",fontSize:12,marginBottom:10}}>AI 분석 실패: {aiAction._msg}<br/><span style={{fontSize:11,color:"#94A3B8"}}>Gemini API 활성화 여부를 확인하세요. YouTube API 키와 별도로 Google AI Studio에서 Gemini API 키가 필요할 수 있습니다.</span></div>}
          {aiAction&&!aiAction._error?(
            <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:14}}>
              <div style={{color:"#D97706",fontSize:12,fontWeight:700,marginBottom:12}}>AI 액션 가이드</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                {[{label:"추천 제목 공식",val:aiAction.titleFormula},{label:"썸네일 전략",val:aiAction.thumbnailTip},{label:"추천 포맷",val:aiAction.bestFormat},{label:"올리기 좋은 타이밍",val:aiAction.timing}].map(g=>(
                  <div key={g.label} style={{background:"#F8FAFC",borderRadius:7,padding:"10px 12px"}}>
                    <div style={{color:"#64748B",fontSize:10,marginBottom:3}}>{g.label}</div>
                    <div style={{color:"#0F172A",fontSize:12,lineHeight:1.5}}>{g.val||"-"}</div>
                  </div>
                ))}
              </div>
              {aiAction.oneLineSummary&&<div style={{background:"#FFFBEB",border:"1px solid #FBEAB8",borderRadius:7,padding:"10px 14px",color:"#92400E",fontSize:12,fontWeight:600}}>{aiAction.oneLineSummary}</div>}
            </div>
          ):(
            <button onClick={onGenAI} disabled={aiLoading} style={{width:"100%",background:aiLoading?"#F1F5F9":"linear-gradient(135deg,#F59E0B,#D97706)",border:"none",borderRadius:8,padding:"11px 0",color:aiLoading?"#94A3B8":"#fff",fontWeight:700,cursor:aiLoading?"not-allowed":"pointer",fontSize:13}}>
              {aiLoading?"AI 액션 가이드 생성 중...":"AI 액션 가이드 생성하기"}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ── 제목 패턴 ── */

    const titles=videos.map((v,i)=>`${i+1}. [${fmtN(v.views)}회/${v.engagementRate}%] ${v.title}`).join("\n");
    const res=await gemini(`YouTube "${query}" 검색 상위 영상 제목 분석:\n${titles}\n\nJSON만 반환:{"patterns":[{"type":"패턴유형","example":"예시","count":숫자,"avgViews":"평균조회수","desc":"효과 이유"}],"topWords":["핵심단어10개"],"avoidWords":["피할단어5개"],"myTitleIdeas":["내채널용제목5개"],"insight":"한줄인사이트"}\n패턴: 숫자형/질문형/공포형/비포애프터/비밀공개/공감형`,apiKey);

      {data?._error&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:12,color:"#DC2626",fontSize:12,marginBottom:10}}>AI 분석 실패: {data._msg}<br/><span style={{fontSize:11,color:"#94A3B8"}}>Gemini API 키가 올바른지 확인하거나, Google Cloud에서 Generative Language API가 활성화되어 있는지 확인하세요.</span></div>}
      {data&&!data._error&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:8}}>
            {data.patterns?.map((p,i)=>(
              <div key={i} style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:"12px 14px"}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}>
                  <Tag color={PC[i%PC.length]} bg={PC[i%PC.length]+"15"} border={PC[i%PC.length]+"30"}>{p.type}</Tag>
                  <span style={{color:"#94A3B8",fontSize:10,marginLeft:"auto"}}>{p.count}건 · 평균 {p.avgViews}</span>
                </div>
                <div style={{color:"#1E293B",fontSize:12,marginBottom:5,fontStyle:"italic"}}>"{p.example}"</div>
                <div style={{color:"#64748B",fontSize:11}}>{p.desc}</div>
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:8,padding:"12px 14px"}}>
              <div style={{color:"#059669",fontSize:11,fontWeight:600,marginBottom:8}}>자주 쓰이는 핵심 단어</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>{data.topWords?.map((w,i)=><Tag key={i} color="#059669" bg="#F0FDF4" border="#D1FAE5">{w}</Tag>)}</div>
            </div>
            <div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:"12px 14px"}}>
              <div style={{color:"#DC2626",fontSize:11,fontWeight:600,marginBottom:8}}>피해야 할 단어</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>{data.avoidWords?.map((w,i)=><Tag key={i} color="#DC2626" bg="#FEF2F2" border="#FEE2E2">{w}</Tag>)}</div>
            </div>
          </div>
          <div style={{background:"#FFFBEB",border:"1px solid #FBEAB8",borderRadius:8,padding:"12px 14px"}}>
            <div style={{color:"#92400E",fontSize:11,fontWeight:600,marginBottom:8}}>내 채널용 제목 아이디어 (클릭하여 복사)</div>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {data.myTitleIdeas?.map((t,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"#fff",borderRadius:6,padding:"8px 12px",border:"1px solid #FBEAB8"}}>
                  <span style={{color:"#D97706",fontFamily:"monospace",fontSize:11,flexShrink:0}}>{String(i+1).padStart(2,"0")}</span>
                  <span style={{color:"#1E293B",fontSize:12,flex:1}}>{t}</span>

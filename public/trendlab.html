                <div style={{fontSize:11,marginTop:4}}>스냅샷 간 변화가 있어야 차트가 표시됩니다</div>
              </div>
            </Card>}
            <Card>
              <SectionTitle sub={`${snapshots.length}개 기록`}>스냅샷 히스토리</SectionTitle>
              {snapshots.length===0&&<div style={{textAlign:"center",padding:"24px 0",color:"#94A3B8",fontSize:12}}>아직 기록이 없습니다. 채널을 등록하면 자동 저장됩니다.</div>}
              <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:400,overflowY:"auto"}}>
                {snapshots.map((s,i)=>{const d=new Date(s.ts);const prev=snapshots[i+1];const subsDiff=prev?s.subs-prev.subs:0;const viewsDiff=prev?s.views-prev.views:0;return(
                  <div key={s.ts+"-"+i} style={{background:"#F8FAFC",borderRadius:8,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11}}>
                    <div style={{color:"#64748B"}}>{d.toLocaleString()}</div>
                    <div style={{display:"flex",gap:14}}>
                      <div><span style={{color:"#1E3A8A",fontWeight:600}}>{fmtN(s.subs)}</span> {subsDiff!==0&&<span style={{color:subsDiff>0?"#059669":"#DC2626",fontSize:10}}>{subsDiff>0?"+":""}{fmtN(subsDiff)}</span>}</div>
                      <div><span style={{color:"#1B3EC3",fontWeight:600}}>{fmtN(s.views)}</span> {viewsDiff!==0&&<span style={{color:viewsDiff>0?"#059669":"#DC2626",fontSize:10}}>{viewsDiff>0?"+":""}{fmtN(viewsDiff)}</span>}</div>
                    </div>
                  </div>
                );})}
              </div>
            </Card>
          </div>)}
        </>
      )}
    </div>
  );
}

/* ── Feature 1: 콘텐츠 기획서 생성기 (ContentPlanGenerator) ── */
function ContentPlanGenerator({selectedVideos,onClose,apiKey}){
  const[generating,setGenerating]=useState(false);
  const[result,setResult]=useState(null);

  const generate=async()=>{
    setGenerating(true);
    const titles=selectedVideos.map(v=>v.title).join(" | ");
    const channels=selectedVideos.map(v=>v.channel).join(", ");
    const topics=selectedVideos.map(v=>v.title.split(/[\s\-|]+/).slice(0,3).join(" ")).join(", ");
    const engagements=selectedVideos.map(v=>v.engagementRate).join(",");

    const prompt=`선정된 ${selectedVideos.length}개 영상 분석:\n제목: ${titles}\n채널: ${channels}\n주제: ${topics}\n평균반응도: ${(selectedVideos.reduce((s,v)=>s+parseFloat(v.engagementRate||0),0)/selectedVideos.length).toFixed(1)}%\n\n다음 JSON으로 기획서 생성:\n{"commonTopics":["주제1","주제2","주제3"],"titleCandidates":["제목1","제목2","제목3"],"thumbnailConcepts":["컨셉1","컨셉2","컨셉3"],"scriptStructure":{"intro":"인트로전략","body":"본문구성","outro":"아웃트로전략"},"differentiation":"차별화포인트"}`;

    const res=await gemini(prompt,apiKey);
    setResult(res._error?{_error:true,_msg:res._msg}:res);
    setGenerating(false);
  };

  if(result){
    return(
      <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}}>
        <Card style={{maxWidth:700,maxHeight:"80vh",overflowY:"auto",padding:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{fontSize:16,fontWeight:700,color:"#0F172A"}}>콘텐츠 기획서</div>
            <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer"}}>×</button>
          </div>
          {result._error?(
            <ErrBox msg={result._msg}/>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {result.commonTopics&&(
                <div style={{background:"#F0FDF4",borderRadius:8,padding:12,border:"1px solid #D1FAE5"}}>
                  <div style={{color:"#059669",fontWeight:700,fontSize:12,marginBottom:6}}>공통 소재/주제</div>
                  {result.commonTopics.map((t,i)=><div key={i} style={{color:"#166534",fontSize:11,marginBottom:2}}>• {t}</div>)}
                </div>
              )}
              {result.titleCandidates&&(
                <div style={{background:"#EFF6FF",borderRadius:8,padding:12,border:"1px solid #BFDBFE"}}>
                  <div style={{color:"#1B3EC3",fontWeight:700,fontSize:12,marginBottom:6}}>제목 후보</div>
                  {result.titleCandidates.map((t,i)=><div key={i} style={{color:"#1E293B",fontSize:11,marginBottom:2,padding:"4px 0"}}>
                    {i+1}. <span style={{fontWeight:600}}>{t}</span><CopyBtn text={t}/></div>)}
                </div>
              )}
              {result.thumbnailConcepts&&(
                <div style={{background:"#EFF6FF",borderRadius:8,padding:12,border:"1px solid #BFDBFE"}}>
                  <div style={{color:"#1D4ED8",fontWeight:700,fontSize:12,marginBottom:6}}>썸네일 콘셉트</div>
                  {result.thumbnailConcepts.map((c,i)=><div key={i} style={{color:"#1E40AF",fontSize:11,marginBottom:2}}>• {c}</div>)}
                </div>
              )}
              {result.scriptStructure&&(
                <div style={{background:"#FFF7ED",borderRadius:8,padding:12,border:"1px solid #FED7AA"}}>
                  <div style={{color:"#EA580C",fontWeight:700,fontSize:12,marginBottom:6}}>스크립트 구조</div>
                  <div><span style={{color:"#92400E",fontWeight:600,fontSize:11}}>인트로:</span> <span style={{color:"#78350F",fontSize:11}}>{result.scriptStructure.intro}</span></div>
                  <div><span style={{color:"#92400E",fontWeight:600,fontSize:11}}>본문:</span> <span style={{color:"#78350F",fontSize:11}}>{result.scriptStructure.body}</span></div>
                  <div><span style={{color:"#92400E",fontWeight:600,fontSize:11}}>아웃트로:</span> <span style={{color:"#78350F",fontSize:11}}>{result.scriptStructure.outro}</span></div>
                </div>
              )}
              {result.differentiation&&(
                <div style={{background:"#FFFBEB",borderRadius:8,padding:12,border:"1px solid #FBEAB8"}}>
                  <div style={{color:"#92400E",fontWeight:700,fontSize:12,marginBottom:6}}>차별화 포인트</div>
                  <div style={{color:"#78350F",fontSize:11,lineHeight:1.6}}>{result.differentiation}</div>
                </div>
              )}
            </div>
          )}
        </Card>
      </div>
    );
  }

  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}}>
      <Card style={{maxWidth:500,padding:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:700,color:"#0F172A"}}>기획서 생성</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer"}}>×</button>
        </div>
        <div style={{color:"#64748B",fontSize:12,marginBottom:12}}>선택된 {selectedVideos.length}개 영상을 분석하여 콘텐츠 기획서를 생성합니다.</div>
        <button onClick={generate} disabled={generating} style={{width:"100%",background:generating?"#F1F5F9":"#1B3EC3",color:generating?"#94A3B8":"#fff",border:"none",borderRadius:6,padding:"10px",fontWeight:600,cursor:generating?"not-allowed":"pointer"}}>
          {generating?"생성 중...":"생성 시작"}
        </button>
      </Card>
    </div>
  );
}

/* ── 수집함 탭 ── */
function SavedTab({savedVideos,setSavedVideos,apiKey}){
  const[analyzing,setAnalyzing]=useState(null);const[analysis,setAnalysis]=useState({});const[chartVideo,setChartVideo]=useState(null);
  const[selected,setSelected]=useState(new Set());
  const[showPlanGen,setShowPlanGen]=useState(false);

  /* videoId 기반 분석/선택/삭제 — 배열 인덱스 키는 삭제 시 결과가 어긋나는 버그가 있어 전환 */
  const analyze=async(v)=>{setAnalyzing(v.videoId);const res=await gemini(`YouTube 영상 분석:\n제목:${v.title}\n채널:${v.channel}\n조회수:${fmtN(v.views)}\n구독자:${fmtN(v.subscribers)}\n반응도:${v.engagementRate}%\n바이럴:${v.viralScore}\n\nJSON만:{"strengths":["강점3"],"titleFormula":"제목공식","thumbnailTip":"썸네일전략","timing":"최적업로드타이밍","strategy":"활용전략","weaknesses":["약점2"]}`,apiKey);setAnalysis(p=>({...p,[v.videoId]:res}));setAnalyzing(null);};

  const toggleSelect=(id)=>{const s=new Set(selected);if(s.has(id))s.delete(id);else s.add(id);setSelected(s);};
  const selectedVids=savedVideos.filter(v=>selected.has(v.videoId));

  return(
    <div>
      {chartVideo&&<GrowthModal video={chartVideo} onClose={()=>setChartVideo(null)} apiKey={apiKey}/>}
      {showPlanGen&&<ContentPlanGenerator selectedVideos={selectedVids} onClose={()=>setShowPlanGen(false)} apiKey={apiKey}/>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{color:"#64748B",fontSize:12}}>수집된 영상 {savedVideos.length}개 {selected.size>0&&<span style={{color:"#1B3EC3",fontWeight:600}}>({selected.size}개 선택)</span>}</div>
        {selected.size>=3&&<button onClick={()=>setShowPlanGen(true)} style={{background:"#F97316",color:"#fff",border:"none",borderRadius:6,padding:"6px 14px",cursor:"pointer",fontSize:11,fontWeight:600}}>기획서 생성</button>}
      </div>
      {savedVideos.length===0?(
        <Card><div style={{textAlign:"center",padding:"40px 0",color:"#94A3B8"}}>
          <div>트렌드 소재 탭에서 관심 영상을 수집하면 여기에 저장됩니다</div>
        </div></Card>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {savedVideos.map(v=>{const a=analysis[v.videoId];const isSel=selected.has(v.videoId);return(
            <Card key={v.videoId} style={{background:isSel?"#EFF6FF":"#fff",borderColor:isSel?"#BFDBFE":"#E2E8F0"}}>
              <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:a?14:0}}>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <input type="checkbox" checked={isSel} onChange={()=>toggleSelect(v.videoId)} style={{width:18,height:18,cursor:"pointer",accentColor:"#1B3EC3"}}/>
                  <div onClick={()=>setChartVideo(v)} style={{position:"relative",width:140,minWidth:140,height:79,borderRadius:7,overflow:"hidden",cursor:"pointer",flexShrink:0,background:"#F1F5F9"}}>
                    <img src={v.thumbnail} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                    <div style={{position:"absolute",bottom:4,right:4,background:"rgba(0,0,0,.7)",color:"#fff",fontSize:10,padding:"1px 5px",borderRadius:3,fontFamily:"monospace"}}>{v.duration}</div>
                  </div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div onClick={()=>setChartVideo(v)} style={{color:"#0F172A",fontWeight:600,fontSize:13,marginBottom:4,lineHeight:1.4,cursor:"pointer"}}
                    onMouseEnter={e=>e.currentTarget.style.color="#1B3EC3"} onMouseLeave={e=>e.currentTarget.style.color="#0F172A"}>{v.title}</div>
                  <div style={{color:"#64748B",fontSize:11,marginBottom:8}}>{v.channel} · 수집일: {v.savedAt}</div>
                  <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
                    {[{l:"조회수",v:fmtN(v.views),c:"#1B3EC3"},{l:"구독자",v:fmtN(v.subscribers),c:"#1D4ED8"},{l:"좋아요",v:fmtN(v.likes),c:"#059669"},{l:"반응도",v:v.engagementRate+"%",c:"#D97706"},{l:"바이럴",v:v.viralScore+"점",c:"#EA580C"}].map(s=>(
                      <div key={s.l}><div style={{color:"#94A3B8",fontSize:9}}>{s.l}</div><div style={{color:s.c,fontFamily:"monospace",fontSize:11,fontWeight:700}}>{s.v}</div></div>
                    ))}
                    <div><div style={{color:"#94A3B8",fontSize:9}}>노출등급</div><GradeBadge grade={v.exposureGrade}/></div>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <button onClick={()=>analyze(v)} disabled={analyzing===v.videoId} style={{background:analyzing===v.videoId?"#F1F5F9":"#1B3EC3",border:"none",borderRadius:6,padding:"6px 12px",color:analyzing===v.videoId?"#94A3B8":"#fff",cursor:analyzing===v.videoId?"not-allowed":"pointer",fontSize:11,whiteSpace:"nowrap"}}>{analyzing===v.videoId?"분석중...":"AI 분석"}</button>
                  <button onClick={()=>setChartVideo(v)} style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:6,padding:"6px 10px",color:"#1B3EC3",cursor:"pointer",fontSize:11}}>추이</button>
                  <a href={`https://www.youtube.com/watch?v=${v.videoId}`} target="_blank" rel="noreferrer" style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:6,padding:"6px 0",color:"#DC2626",fontSize:11,display:"block",textAlign:"center"}}>보기</a>
                  <button onClick={()=>setSavedVideos(p=>p.filter(x=>x.videoId!==v.videoId))} style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:6,padding:"6px 8px",color:"#94A3B8",cursor:"pointer",fontSize:11}}>삭제</button>
                </div>
              </div>
              {a&&(
                <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:14,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <div>
                    <div style={{color:"#059669",fontSize:11,fontWeight:600,marginBottom:6}}>강점</div>
                    {a.strengths?.map((s,j)=><div key={j} style={{color:"#334155",fontSize:12,marginBottom:3}}>• {s}</div>)}
                    <div style={{color:"#DC2626",fontSize:11,fontWeight:600,marginTop:10,marginBottom:6}}>약점</div>
                    {a.weaknesses?.map((s,j)=><div key={j} style={{color:"#334155",fontSize:12,marginBottom:3}}>• {s}</div>)}
                  </div>
                  <div>
                    {[{l:"제목 공식",v:a.titleFormula},{l:"썸네일 전략",v:a.thumbnailTip},{l:"최적 타이밍",v:a.timing}].map(s=>(
                      <div key={s.l} style={{marginBottom:10}}><div style={{color:"#64748B",fontSize:10,marginBottom:3}}>{s.l}</div><div style={{color:"#334155",fontSize:12,lineHeight:1.5}}>{s.v}</div></div>
                    ))}
                  </div>
                  <div style={{gridColumn:"1/-1"}}><div style={{color:"#64748B",fontSize:10,marginBottom:3}}>활용 전략</div><div style={{color:"#334155",fontSize:12,lineHeight:1.6}}>{a.strategy}</div></div>
                </div>
              )}
            </Card>
          );})}
        </div>
      )}
    </div>
  );
}

/* ── 대시보드 (VideoTab 리서치 데이터 활용) ── */
function DashboardTab({savedVideos,searchHistory,apiKey}){
  const[aiRec,setAiRec]=useState(null);const[aiLoading,setAiLoading]=useState(false);
  /* VideoTab이 저장한 풍부한 검색 히스토리 읽기 */
  const richHistory=useMemo(()=>{
    const raw=_restore("vt_sh",[]);
    if(!raw||!raw.length)return[];
    /* 중복 키워드 합산: 최신 검색 기준 */
    const map={};
    raw.forEach(item=>{
      const kw=typeof item==="string"?item:(item.query||item.keyword||"");
      if(!kw)return;
      const existing=map[kw];
      /* 과거 엔트리는 ts가 없으므로 timestamp 폴백 */
      const itemTs=item.ts||item.timestamp||0;
      if(!existing||(itemTs>(existing.ts||0))){
        map[kw]={keyword:kw,count:(existing?.count||0)+1,
          expLabel:item.expLabel||item.exposureGrade||"",
          videoCount:item.videoCount||item.count||0,
          avgViral:item.avgViral||0,
          ts:itemTs||Date.now()};
      } else {
        map[kw].count++;
      }
    });
    return Object.values(map).sort((a,b)=>(b.ts||0)-(a.ts||0));
  },[]);
  /* fallback: App의 flat searchHistory */
  const topSearches=useMemo(()=>{
    if(richHistory.length>0)return richHistory.slice(0,15);
    const map={};(searchHistory||[]).forEach(s=>{map[s]=(map[s]||0)+1;});
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([kw,cnt])=>({keyword:kw,count:cnt,expLabel:"",videoCount:0,avgViral:0}));
  },[richHistory,searchHistory]);
  const gradeStats=useMemo(()=>{const map={"매우높음":0,"높음":0,"보통":0,"낮음":0,"매우낮음":0};(savedVideos||[]).forEach(v=>{if(v.exposureGrade&&map[v.exposureGrade]!==undefined)map[v.exposureGrade]++;});return map;},[savedVideos]);
  /* 트렌드 맵: 노출 가능성 점수 기반 가로 막대 */
  const trendMap=useMemo(()=>{
    const scored=topSearches.filter(s=>s.expLabel).map(s=>{
      const scoreMap={"매우높음":95,"높음":75,"보통":50,"낮음":30,"매우낮음":15};
      return{...s,score:scoreMap[s.expLabel]||50};
    });
    return scored.sort((a,b)=>b.score-a.score).slice(0,10);
  },[topSearches]);
  const doAiRec=async()=>{setAiLoading(true);
    const kwData=topSearches.slice(0,10).map(s=>`${s.keyword}(노출:${s.expLabel||"미측정"},영상수:${s.videoCount})`).join(", ");
    const data=await gemini(`유튜브 크리에이터의 최근 리서치 현황:\n검색 키워드: ${kwData}\n수집 영상 ${savedVideos?.length||0}개\n등급분포: 매우높음=${gradeStats["매우높음"]}, 높음=${gradeStats["높음"]}, 보통=${gradeStats["보통"]}, 낮음=${gradeStats["낮음"]}\n\nJSON만:{"weeklyTip":"이번 주 콘텐츠 전략 조언 2줄","hotTopics":["지금 만들면 좋은 주제 5개"],"contentIdeas":[{"title":"영상 제목 아이디어","reason":"추천 이유 한줄"}],"avoidTopics":["지금 피해야 할 소재 2-3개"]}`,apiKey);
    setAiRec(data);setAiLoading(false);
  };
  const maxScore=Math.max(...trendMap.map(s=>s.score),1);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* 리서치 요약 카드 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        <Card style={{textAlign:"center"}}><div style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5}}>리서치 키워드</div><div style={{color:"#1B3EC3",fontWeight:800,fontSize:22,letterSpacing:-0.3}}>{topSearches.length}</div></Card>
        <Card style={{textAlign:"center"}}><div style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5}}>수집 영상</div><div style={{color:"#1B3EC3",fontWeight:800,fontSize:22,letterSpacing:-0.3}}>{savedVideos?.length||0}</div></Card>
        <Card style={{textAlign:"center"}}><div style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5}}>노출 높음</div><div style={{color:"#1B3EC3",fontWeight:800,fontSize:22,letterSpacing:-0.3}}>{gradeStats["매우높음"]+gradeStats["높음"]}</div></Card>
      </div>
      {/* 트렌드 맵 */}
      {trendMap.length>0&&<Card>
        <SectionTitle sub="노출 가능성 높은 순 정렬">소재 트렌드 맵</SectionTitle>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {trendMap.map((s,i)=>{const gc=GC[s.expLabel]||"#64748B";return(
            <div key={s.keyword} style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:100,fontSize:11,fontWeight:600,color:"#0F172A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flexShrink:0}} title={s.keyword}>{s.keyword}</div>
              <div style={{flex:1,background:"#F1F5F9",borderRadius:4,height:18,position:"relative",overflow:"hidden"}}>
                <div style={{width:`${(s.score/maxScore)*100}%`,height:"100%",background:gc,borderRadius:4,transition:"width .6s ease"}}/>
                <span style={{position:"absolute",right:6,top:1,fontSize:9,color:"#64748B",fontWeight:600}}>{s.score}점</span>
              </div>
              <GradeBadge grade={s.expLabel}/>
            </div>
          );})}
        </div>
      </Card>}
      {/* 검색 히스토리 */}
      <Card><SectionTitle sub={`최근 ${topSearches.length}개 키워드`}>리서치 히스토리</SectionTitle>
        {topSearches.length===0?<div style={{color:"#94A3B8",fontSize:13,textAlign:"center",padding:20}}>검색 기록이 없습니다. 트렌드 소재 탭에서 검색해보세요!</div>:(
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{topSearches.map((s,i)=>{const kw=s.keyword;const gc=GC[s.expLabel]||"#64748B";return(
            <div key={kw+i} style={{display:"flex",alignItems:"center",gap:6,background:s.expLabel&&(s.expLabel==="매우높음"||s.expLabel==="높음")?"#F0FDF4":"#F8FAFC",border:`1px solid ${s.expLabel&&(s.expLabel==="매우높음"||s.expLabel==="높음")?"#D1FAE5":"#E2E8F0"}`,borderRadius:8,padding:"6px 12px"}}>
              <span style={{color:"#0F172A",fontSize:12,fontWeight:600}}>{kw}</span>
              {s.expLabel&&<span style={{color:gc,fontSize:10,fontWeight:700}}>{s.expLabel}</span>}
              {s.videoCount>0&&<span style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5}}>{s.videoCount}개</span>}
              {s.count>1&&<span style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5}}>{s.count}회</span>}
            </div>
          );})}
          </div>
        )}
      </Card>
      {/* 수집 영상 등급 분포 */}
      <Card><SectionTitle sub={`총 ${savedVideos?.length||0}개 수집`}>수집 영상 등급 분포</SectionTitle>
        <div style={{display:"flex",gap:8,justifyContent:"center"}}>
          {["매우높음","높음","보통","낮음","매우낮음"].map(g=>{const c=gradeStats[g];return<div key={g} style={{flex:1,textAlign:"center",padding:"8px 0",background:c>0?(GC[g]||"#64748B")+"15":"#F8FAFC",borderRadius:6,border:`1px solid ${c>0?(GC[g]||"#64748B")+"30":"#E2E8F0"}`}}>
            <div style={{color:GC[g]||"#64748B",fontWeight:800,fontSize:16}}>{c}</div>
            <div style={{fontSize:10,color:"#94A3B8"}}>{g}</div>
          </div>;})}
        </div>
      </Card>
      {/* AI 추천 */}
      <Card><SectionTitle sub="리서치 데이터 기반 종합 분석">AI 전략 추천</SectionTitle>
        {!aiRec?<button onClick={doAiRec} disabled={aiLoading} style={{width:"100%",padding:"12px",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,color:"#1B3EC3",fontWeight:600,fontSize:13,cursor:"pointer"}}>{aiLoading?"분석 중...":"AI 전략 추천 받기"}</button>:(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {aiRec.weeklyTip&&<div style={{background:"#FFFBEB",border:"1px solid #FBEAB8",borderRadius:8,padding:12,fontSize:13,color:"#92400E"}}>{aiRec.weeklyTip}</div>}
            {aiRec.hotTopics&&<div><div style={{color:"#64748B",fontSize:11,marginBottom:6}}>지금 만들면 좋은 주제</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{aiRec.hotTopics.map((t,i)=><Tag key={i}>{t}</Tag>)}</div></div>}
            {aiRec.avoidTopics&&<div><div style={{color:"#64748B",fontSize:11,marginBottom:6}}>지금 피해야 할 소재</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{aiRec.avoidTopics.map((t,i)=><Tag key={i} color="#DC2626" bg="#FEF2F2" border="#FEE2E2">{t}</Tag>)}</div></div>}
            {aiRec.contentIdeas&&<div><div style={{color:"#64748B",fontSize:11,marginBottom:6}}>콘텐츠 아이디어</div>{aiRec.contentIdeas.map((idea,i)=><div key={i} style={{background:"#F8FAFC",borderRadius:6,padding:8,marginBottom:4,border:"1px solid #E2E8F0"}}><div style={{fontWeight:600,fontSize:12,color:"#0F172A"}}>{idea.title}</div><div style={{fontSize:11,color:"#64748B"}}>{idea.reason}</div></div>)}</div>}
          </div>
        )}
      </Card>
    </div>
  );
}

function Setup({onSave}){
  const[key,setKey]=useState(()=>{try{return localStorage.getItem("yt_api_key")||"";}catch(e){return "";}});
  const[aiKey,setAiKey]=useState(()=>{try{return localStorage.getItem("gemini_api_key")||"";}catch(e){return "";}});
  const[testing,setTesting]=useState(false);const[msg,setMsg]=useState("");
  const keyCount=key.split(",").map(k=>k.trim()).filter(k=>k.length>10).length;
  const test=async()=>{if(!key.trim())return;setTesting(true);setMsg("");
    const keys=key.split(",").map(k=>k.trim()).filter(k=>k.length>10);
    const results=[];
    for(let i=0;i<keys.length;i++){
      try{const r=await fetch(`${YT}/search?part=snippet&q=test&type=video&maxResults=1&key=${keys[i]}`);const d=await r.json();
        if(d.error)results.push(`키${i+1}: 실패 — ${d.error.message.slice(0,40)}`);
        else results.push(`키${i+1}: 연결 성공`);
      }catch(e){results.push(`키${i+1}: 실패 — ${e.message.slice(0,40)}`);}
    }
    /* AI 호출 가능 여부 테스트: AI 전용 키가 있으면 그 키, 없으면 첫 번째 키로 */
    const aiTestKey=aiKey.trim()||keys[0];
    if(aiTestKey){
      try{
        let r=await fetch(gaUrl(aiTestKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:"1+1은? 숫자만"}]}],generationConfig:{maxOutputTokens:10}})});
        let d=await r.json();
        /* 모델 지원 종료면 자동 재선택 후 재시도 */
        if(d.error&&_isModelErr(d.error.message)){
          try{await pickGeminiModel(aiTestKey);
            r=await fetch(gaUrl(aiTestKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:"1+1은? 숫자만"}]}],generationConfig:{maxOutputTokens:10}})});
            d=await r.json();
          }catch(pe){}
        }
        if(d.error)results.push(`AI 분석${aiKey.trim()?" (전용 키)":""}: 실패 — ${String(d.error.message||"").slice(0,50)}`);
        else results.push(`AI 분석${aiKey.trim()?" (전용 키)":""}: 연결 성공 (${getGeminiModel()})`);
      }catch(e){results.push(`AI 분석: 실패 — ${e.message.slice(0,40)}`);}
    }
    setMsg(results.join("\n"));setTesting(false);
  };
  return(
    <div style={{minHeight:"100vh",background:"#F8FAFC",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{maxWidth:540,width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{width:52,height:52,background:"linear-gradient(135deg,#0A1F75,#1A3BC0)",borderRadius:14,display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:22,color:"#fff",boxShadow:"0 4px 14px rgba(18,48,168,.35)",marginBottom:12}}>P<span style={{color:"#F97316",fontSize:26,lineHeight:0}}>.</span></div>
          <div style={{fontWeight:900,fontSize:22,color:"#0F172A"}}>퍼메스 트랜드랩</div>
          <div style={{color:"#94A3B8",fontSize:12,letterSpacing:2,marginTop:3,fontWeight:600}}>TEAM PERSONAL MAKERS<span style={{color:"#F97316"}}>.</span></div>
        </div>
        <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:14,padding:28,boxShadow:"0 4px 16px rgba(0,0,0,.06)"}}>
          <div style={{color:"#0F172A",fontSize:15,fontWeight:700,marginBottom:5}}>YouTube API 키 설정</div>
          <div style={{color:"#64748B",fontSize:12,marginBottom:20,lineHeight:1.6}}>실제 YouTube 데이터를 불러오려면 무료 API 키가 필요합니다.</div>
          <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:16,marginBottom:20}}>
            <div style={{color:"#D97706",fontSize:12,fontWeight:700,marginBottom:10}}>API 키 발급 방법 (무료 · 5분)</div>
            {[["1","console.cloud.google.com 접속"],["2","새 프로젝트 생성 또는 기존 선택"],["3","APIs & Services → Library → YouTube Data API v3 → 사용 설정"],["4","Credentials → + CREATE CREDENTIALS → API key"],["5","생성된 키 복사 후 아래 입력"]].map(([n,t])=>(
              <div key={n} style={{display:"flex",gap:9,marginBottom:7,alignItems:"flex-start"}}>
                <span style={{background:"#DBEAFE",color:"#1D4ED8",borderRadius:"50%",width:18,height:18,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{n}</span>
                <span style={{color:"#334155",fontSize:12,lineHeight:1.5}}>{t}</span>
              </div>
            ))}
            <div style={{marginTop:10,padding:"7px 12px",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:6,color:"#1D4ED8",fontSize:11}}>하루 10,000 유닛 무료 (검색 약 80~100회)</div>

          </div>
          <textarea value={key} onChange={e=>setKey(e.target.value)} placeholder={"API 키 입력 (여러 개는 콤마로 구분)\n예: AIzaSy...첫번째키, AIzaSy...두번째키, AIzaSy...세번째키"}
            style={{width:"100%",background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:"11px 14px",color:"#1E293B",fontSize:13,outline:"none",marginBottom:4,resize:"vertical",minHeight:48,maxHeight:120,fontFamily:"monospace",lineHeight:1.6}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>

              {keyCount===0?"키를 입력하세요":keyCount===1?"API 키 1개 입력됨":`API 키 ${keyCount}개 입력됨 → 일일 ${(keyCount*10000).toLocaleString()}유닛`}
            </span>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:600,color:"#475569",marginBottom:5}}>AI 전용 키 <span style={{color:"#8A94A6",fontWeight:500}}>(선택 — AI 분석이 거부될 때)</span></div>
            <input value={aiKey} onChange={e=>setAiKey(e.target.value)} placeholder="aistudio.google.com/apikey 에서 무료 발급"
              style={{width:"100%",background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:"10px 14px",color:"#1E293B",fontSize:12,outline:"none",fontFamily:"monospace"}}/>
            <div style={{fontSize:10,color:"#8A94A6",marginTop:4,lineHeight:1.5}}>위 키들이 Generative Language API를 지원하지 않으면, AI 분석은 이 키를 우선 사용합니다</div>

          {msg&&<div style={{fontSize:11,marginBottom:10,padding:"7px 12px",background:"#F8FAFC",borderRadius:6,border:"1px solid #E2E8F0",whiteSpace:"pre-line",lineHeight:1.8}}>
            {msg.split("\n").map((line,i)=><div key={i} style={{color:line.includes("연결 성공")?"#059669":"#DC2626"}}>{line}</div>)}
          </div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={test} disabled={testing||!key.trim()} style={{flex:1,background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:"11px 0",color:"#1B3EC3",fontWeight:600,cursor:testing?"not-allowed":"pointer",fontSize:13}}>
              {testing?`${keyCount}개 키 테스트 중...`:`연결 테스트${keyCount>1?` (${keyCount}개)`:""}`}
            </button>
            <button onClick={()=>{if(key.trim()){localStorage.setItem("yt_api_key",key.trim());try{if(aiKey.trim())localStorage.setItem("gemini_api_key",aiKey.trim());else localStorage.removeItem("gemini_api_key");}catch(e){}onSave(key.trim());}}} disabled={!key.trim()}
              style={{flex:1,background:key.trim()?"#1B3EC3":"#E2E8F0",border:"none",borderRadius:8,padding:"11px 0",color:key.trim()?"#fff":"#94A3B8",fontWeight:700,cursor:key.trim()?"pointer":"not-allowed",fontSize:13,boxShadow:key.trim()?"0 2px 8px rgba(37,99,235,.3)":"none"}}>
              시작하기 →
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── 앱 ── */
function App(){
  const[apiKeyRaw,setApiKeyRaw]=useState(()=>{try{return localStorage.getItem("yt_api_key")||"";}catch{return "";}});
  /* 멀티키 초기화: 콤마로 구분된 키들을 파싱하고, 첫번째 키를 활성키로 사용 */
  const keyCount=React.useMemo(()=>apiKeyRaw?initKeys(apiKeyRaw):0,[apiKeyRaw]);
  const apiKey=React.useMemo(()=>getKey(),[apiKeyRaw,keyCount]);
  const[tab,setTab]=useState(()=>_restore("app_tab","dashboard"));
  const[searchHistory,setSearchHistory]=useState(()=>_restore("app_sh",[]));
  const[saved,setSaved]=useState(()=>_restore("app_saved",[]));

  /* ── 영속성: App 상태 저장 ── */
  useEffect(()=>_persist("app_tab",tab),[tab]);
  useEffect(()=>_persist("app_sh",searchHistory),[searchHistory]);
  useEffect(()=>_persist("app_saved",saved),[saved]);

  const addSearchHistory=(query)=>{if(query&&query.trim()){setSearchHistory(prev=>[...prev,query.trim()]);}};
  if(!apiKeyRaw)return<Setup onSave={k=>setApiKeyRaw(k)}/>;
  return(
    <div style={{minHeight:"100vh",background:"#F8FAFC"}}>
      {/* 헤더 */}
      <div style={{background:"linear-gradient(135deg,#0A1F75 0%,#1230A8 55%,#1A3BC0 100%)",borderBottom:"2px solid rgba(249,115,22,.5)",padding:"0 24px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(10,31,117,.25)"}}>
        <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",height:58}}>
          <div className="header-logo" style={{display:"flex",alignItems:"center",gap:10,marginRight:32}}>
            <div style={{width:34,height:34,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.22)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:15,color:"#fff",letterSpacing:0}}>P<span style={{color:"#F97316",fontSize:17,lineHeight:0}}>.</span></div>
            <div>
              <div style={{fontWeight:800,fontSize:14,color:"#fff",lineHeight:1.1}}>퍼메스 트랜드랩</div>
              <div style={{color:"rgba(255,255,255,.55)",fontSize:8.5,letterSpacing:1.8,fontWeight:600}}>TEAM PERSONAL MAKERS<span style={{color:"#F97316"}}>.</span></div>
            </div>
          </div>
          <div className="header-tabs" style={{display:"flex",gap:1,flex:1}}>
            {TABS.map(t=>(
              <button key={t.id} className="tab-btn" onClick={()=>setTab(t.id)} style={{background:tab===t.id?"rgba(255,255,255,.08)":"none",border:"none",borderBottom:tab===t.id?"2px solid #F97316":"2px solid transparent",padding:"0 16px",height:58,color:tab===t.id?"#fff":"rgba(255,255,255,.6)",cursor:"pointer",fontSize:13,fontWeight:tab===t.id?700:400,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
                {t.label}
                {t.id==="saved"&&saved.length>0&&<span style={{background:"#F97316",color:"#fff",borderRadius:10,padding:"0 6px",fontSize:10,fontFamily:"monospace"}}>{saved.length}</span>}
              </button>
            ))}
          </div>
          <div className="header-actions" style={{display:"flex",gap:4,alignItems:"center"}}>
            <button onClick={()=>{try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith("vid_")||k?.startsWith("ch_")||k?.startsWith("search_"))keys.push(k);}keys.forEach(k=>localStorage.removeItem(k));resetApiSaved();alert(`캐시 ${keys.length}개 항목 초기화 완료`);}catch{}}}
              style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.2)",borderRadius:6,padding:"5px 10px",color:"rgba(255,255,255,.85)",cursor:"pointer",fontSize:10,whiteSpace:"nowrap"}}>
              캐시 초기화
            </button>
            <button onClick={()=>{if(confirm("모든 리서치 데이터를 초기화할까요? (검색기록, 수집영상, 분석결과 모두 삭제)")){try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith("p_"))keys.push(k);}keys.forEach(k=>localStorage.removeItem(k));location.reload();}catch{}}}}
              style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(252,165,165,.4)",borderRadius:6,padding:"5px 10px",color:"#FCA5A5",cursor:"pointer",fontSize:10,whiteSpace:"nowrap"}}>
              리서치 초기화
            </button>
            <a href="/" style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.2)",borderRadius:6,padding:"5px 12px",color:"#fff",textDecoration:"none",fontSize:11,whiteSpace:"nowrap",fontWeight:600}}>← 퍼메스 AI</a>
          </div>
        </div>
      </div>
      {/* 바디 */}
      <div style={{maxWidth:1200,margin:"0 auto",padding:"20px 24px"}}>
        <div className="info-grid" style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:20}}>
          {[{l:"데이터 소스",v:"실제 YouTube API",c:"#059669"},{l:"AI 분석 엔진",v:getGeminiModel().replace(/^gemini-/,"Gemini "),c:"#1B3EC3"},{l:"API 키",v:"팀 공용 · 서버 관리",c:"#059669"},{l:"수집 영상",v:`${saved.length}개`,c:"#1D4ED8"},{l:"캐시 절약",v:`${getApiSaved().units} 유닛`,c:"#059669"}].map(s=>(
            <div key={s.l} style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"11px 14px",boxShadow:"0 1px 3px rgba(0,0,0,.03)"}}>
              <div style={{color:"#8A94A6",fontSize:10,fontWeight:600,letterSpacing:.5,marginBottom:3}}>{s.l}</div>
              <div style={{color:s.c,fontSize:12,fontWeight:600}}>{s.v}</div>
            </div>
          ))}
        </div>
        <ErrorBoundary key={tab}>
        {tab==="dashboard"&&<DashboardTab savedVideos={saved} searchHistory={searchHistory} apiKey={apiKey} />}
        {tab==="trending"&&<TrendingTab apiKey={apiKey}/>}
        {tab==="video"&&<VideoTab apiKey={apiKey} savedVideos={saved} setSavedVideos={setSaved} onSearchDone={addSearchHistory}/>}
        {tab==="channel"&&<ChannelTab apiKey={apiKey}/>}
        {tab==="mychannel"&&<MyChannelTab apiKey={apiKey}/>}
        {tab==="saved"&&<SavedTab savedVideos={saved} setSavedVideos={setSaved} apiKey={apiKey}/>}
        </ErrorBoundary>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function(){
  function showErr(title,msg){
    var el=document.getElementById('loading-indicator')||document.getElementById('root');
    el.innerHTML='<div style="padding:40px;max-width:700px;margin:0 auto;font-family:monospace;"><div style="color:#FCA5A5;font-size:16px;font-weight:700;margin-bottom:12px;">'+title+'</div><pre style="background:#1E293B;color:#F1F5F9;padding:16px;border-radius:8px;overflow-x:auto;font-size:12px;line-height:1.6;white-space:pre-wrap;">'+msg+'</pre><button onclick="location.reload()" style="margin-top:16px;background:#F97316;color:#fff;border:none;border-radius:8px;padding:10px 24px;cursor:pointer;font-weight:600;font-size:13px;">새로고침</button></div>';
  }
  function libFail(name){
    showErr('라이브러리 로딩 실패',name+' 을(를) 3개 CDN 모두에서 불러오지 못했습니다.\n인터넷 연결을 확인한 후 새로고침 해주세요.');
  }
  /* 소스 해시 기반 컴파일 캐시: 캐시 히트면 Babel 다운로드와 트랜스파일을 모두 건너뜀 */
  function fnv(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16);}
  function execute(code){(0,eval)(code);}
  var src=document.getElementById('app-source').textContent;
  var hash=fnv(src)+'_'+src.length;
  var cached=null;
  try{if(localStorage.getItem('pm_compiled_hash')===hash)cached=localStorage.getItem('pm_compiled_code');}catch(e){}
  function boot(){ window.__loadDeps(['React','ReactDOM'],function(){
    if(cached){
      try{execute(cached);return;}catch(e){
        cached=null;
        try{localStorage.removeItem('pm_compiled_hash');localStorage.removeItem('pm_compiled_code');}catch(e2){}
      }
    }
    window.__loadDeps(['Babel'],function(){
      try{
        var out=Babel.transform(src,{presets:[['react',{runtime:'classic'}]],sourceType:'script'});
        try{localStorage.setItem('pm_compiled_hash',hash);localStorage.setItem('pm_compiled_code',out.code);}catch(e){}
        execute(out.code);
      }catch(e){showErr('앱 실행 오류',e.message);}
    },libFail);
  },libFail); }
  /* 디렉터 로그인이 끝나야 앱을 띄운다 (firebase.js 가 pmfire:ready 를 쏜다) */
  if(window.PMFire&&window.PMFire.uid) boot(); else window.addEventListener('pmfire:ready',boot,{once:true});
})();
</script>
<script type="module" src="/firebase.js"></script>
</script>
</body>
</html>

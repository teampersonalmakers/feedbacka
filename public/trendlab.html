/* ── 썸네일 그리드 ── */
function ThumbGrid({videos,query,apiKey}){
  const[analysis,setAnalysis]=useState(null);const[loading,setLoading]=useState(false);const[visionLoading,setVisionLoading]=useState(false);const[visionAnalysis,setVisionAnalysis]=useState(null);
  /* ── Feature B: 썸네일 제작 브리프 ── */
  const[myHandle,setMyHandle]=useState(()=>_restore("my_handle",""));
  const[brief,setBrief]=useState(null);const[briefLoading,setBriefLoading]=useState(false);const[briefWarn,setBriefWarn]=useState("");const[briefCopied,setBriefCopied]=useState(false);
  const runBrief=async()=>{
    setBriefLoading(true);setBrief(null);setBriefWarn("");
    try{
      const fetchB64=async url=>{const resp=await fetch(url);const blob=await resp.blob();return await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onloadend=()=>resolve(rd.result.split(",")[1]);rd.onerror=reject;rd.readAsDataURL(blob);});};
      const compImgs=[];
      for(const v of videos.slice(0,6)){try{compImgs.push({title:v.title,data:await fetchB64(v.thumbnail)});}catch(e){console.warn("thumb fetch fail",v.videoId);}}
      if(!compImgs.length){setBrief({_error:true,_msg:"경쟁 썸네일 이미지를 불러올 수 없습니다"});setBriefLoading(false);return;}
      let myImgs=[];
      const handle=myHandle.trim();
      if(handle){
        try{
          const cd=await ytFetchJson(`${YT}/channels?part=snippet,contentDetails&forHandle=${encodeURIComponent(handle)}&key=${apiKey}`,apiKey);
          const myChId=cd.items?.[0]?.id;
          if(!myChId)throw new Error("채널을 찾을 수 없습니다");
          const sdItems=await ytSearch("",apiKey,3,"video","",{channelId:myChId,order:"date"});
          for(const it of(sdItems||[])){const vid=it.id?.videoId;if(!vid)continue;try{myImgs.push({title:it.snippet?.title||"",data:await fetchB64(`https://i.ytimg.com/vi/${vid}/mqdefault.jpg`)});}catch(e){}}
          if(!myImgs.length)setBriefWarn("내 채널 썸네일을 가져오지 못했습니다 — 경쟁 썸네일만으로 분석합니다");
        }catch(e){setBriefWarn("내 채널 조회 실패 — "+(e.message||"")+" — 경쟁 썸네일만으로 분석합니다");myImgs=[];}
      }
      const hasMine=myImgs.length>0;
      let prompt='유튜브 "'+query+'" 소재의 썸네일 제작 브리프를 작성해줘.\n첨부 이미지 중 앞 '+compImgs.length+'개는 경쟁 상위 썸네일';
      if(hasMine)prompt+=', 뒤 '+myImgs.length+'개는 내 채널의 최근 썸네일';
      prompt+='이다.\n경쟁 썸네일 제목:\n'+compImgs.map((im,i)=>(i+1)+'. "'+im.title+'"').join("\n");
      if(hasMine)prompt+='\n내 채널 썸네일 제목:\n'+myImgs.map((im,i)=>(i+1)+'. "'+im.title+'"').join("\n");
      prompt+='\n\n경쟁 썸네일들의 레이아웃/색/카피를 분석하고 이길 수 있는 제작 브리프를 JSON만 반환:{"layoutGuide":{"textPosition":"텍스트 배치 가이드","subjectPosition":"인물/피사체 배치","composition":"전체 구도"},"colorPalette":[{"hex":"#XXXXXX","usage":"용도"}],"copyIdeas":["썸네일 카피1","카피2","카피3"],"differentiation":"상위 썸네일들과 차별화할 각도"';
      if(hasMine)prompt+=',"myFeedback":{"strengths":["강점1","강점2"],"weaknesses":["약점1","약점2"],"fixes":["구체적 수정안1","수정안2"]}';
      prompt+=',"brief":"제작 브리프 종합 3-4문장"}';
      const allImgs=[...compImgs,...myImgs];
      const allImgsBody={contents:[{parts:[{text:prompt},...allImgs.map(img=>({inlineData:{mimeType:"image/jpeg",data:img.data}}))]}],generationConfig:{temperature:0.7,maxOutputTokens:8192,responseMimeType:"application/json"}};
      const d=await geminiFetch(allImgsBody,apiKey);
      const text=d.candidates?.[0]?.content?.parts?.[0]?.text||"";
      setBrief(parseJsonLoose(text));
    }catch(e){setBrief({_error:true,_msg:e.message||"제작 브리프 생성 실패"});}
    setBriefLoading(false);
  };
  const copyBriefAll=()=>{
    if(!brief||brief._error)return;
    let t="# 썸네일 제작 브리프: "+query+"\n\n## 레이아웃 가이드\n- 텍스트 배치: "+(brief.layoutGuide?.textPosition||"-")+"\n- 피사체 배치: "+(brief.layoutGuide?.subjectPosition||"-")+"\n- 전체 구도: "+(brief.layoutGuide?.composition||"-")+"\n\n## 컬러 팔레트\n"+(brief.colorPalette||[]).map(c=>"- "+c.hex+" : "+c.usage).join("\n")+"\n\n## 카피 아이디어\n"+(brief.copyIdeas||[]).map((c,i)=>(i+1)+". "+c).join("\n")+"\n\n## 차별화 각도\n"+(brief.differentiation||"-");
    if(brief.myFeedback){t+="\n\n## 내 썸네일 피드백\n- 강점: "+(brief.myFeedback.strengths||[]).join(" / ")+"\n- 약점: "+(brief.myFeedback.weaknesses||[]).join(" / ")+"\n- 수정안: "+(brief.myFeedback.fixes||[]).join(" / ");}
    t+="\n\n## 종합 브리프\n"+(brief.brief||"-");
    navigator.clipboard?.writeText(t);
    setBriefCopied(true);setTimeout(()=>setBriefCopied(false),1500);
  };
  const run=async()=>{
    setLoading(true);
    const info=videos.map((v,i)=>`${i+1}. 제목:"${v.title}" 조회수:${fmtN(v.views)} 반응도:${v.engagementRate}%`).join("\n");
    const res=await gemini(`YouTube "${query}" 상위 영상 썸네일 전략 분석:\n${info}\n\nJSON만 반환:{"commonPatterns":["공통패턴4가지"],"textStrategy":"텍스트전략","colorTrend":"색상분위기","faceUsage":"인물활용","myGuide":["내썸네일가이드5가지"],"doThis":"반드시할것","avoidThis":"반드시피할것"}`,apiKey);
    if(res?._error){setAnalysis({_error:true,_msg:res._msg});}else{setAnalysis(res);}setLoading(false);
  };
  const runVisionAnalysis=async()=>{
    setVisionLoading(true);
    try{
      const topThumbs=videos.slice(0,6);
      const base64Images=[];
      for(const v of topThumbs){
        try{
          const imgResp=await fetch(v.thumbnail);
          const blob=await imgResp.blob();
          const reader=new FileReader();
          await new Promise(resolve=>{
            reader.onloadend=()=>{
              const b64=reader.result.split(",")[1];
              base64Images.push({videoId:v.videoId,title:v.title,data:b64});
              resolve();
            };
            reader.readAsDataURL(blob);
          });
        }catch(e){console.warn("Failed to fetch thumbnail:",v.videoId);}
      }
      if(!base64Images.length){setVisionAnalysis({_error:true,_msg:"썸네일 이미지를 불러올 수 없습니다"});setVisionLoading(false);return;}
      const analysisPrompt=`다음 ${base64Images.length}개 유튜브 썸네일 이미지를 분석해줘:\n${base64Images.map((img,i)=>`${i+1}. "${img.title}"`).join("\n")}\n\n각 이미지의: 텍스트 배치, 색상 구성, 인물 유무, 감정 표현, 클릭 유도 요소\n그리고 이 썸네일들의 공통 패턴을 분석해서 JSON으로: {"imageAnalysis":[{"title":"","textPlacement":"","colorPalette":"","hasPersons":true/false,"emotion":"","clickDrivers":""}],"patterns":["공통패턴1","패턴2","패턴3"],"recommendations":["추천1","추천2","추천3"]}`;
      const visionBody={contents:[{parts:[{text:analysisPrompt},...base64Images.map(img=>({inlineData:{mimeType:"image/jpeg",data:img.data}}))]}],generationConfig:{temperature:0.7,maxOutputTokens:8192,responseMimeType:"application/json"}};
      const d=await geminiFetch(visionBody,apiKey);
      const text=d.candidates?.[0]?.content?.parts?.[0]?.text||"";
      const parsed=parseJsonLoose(text);
      setVisionAnalysis(parsed);
    }catch(e){setVisionAnalysis({_error:true,_msg:e.message||"Vision 분석 실패"});}
    setVisionLoading(false);
  };
  return(
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <SectionTitle sub="상위 영상 썸네일을 비교하고 공통 전략 파악">썸네일 그리드 + AI 분석</SectionTitle>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <input value={myHandle} onChange={e=>{setMyHandle(e.target.value);_persist("my_handle",e.target.value);}} placeholder="@내채널핸들 (선택)"
            style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:7,padding:"8px 10px",fontSize:11,color:"#1E293B",outline:"none",width:150}}/>
          <button onClick={runBrief} disabled={briefLoading} style={{background:briefLoading?"#F1F5F9":"#EA580C",border:"none",borderRadius:7,padding:"8px 16px",color:briefLoading?"#94A3B8":"#fff",fontWeight:600,cursor:briefLoading?"not-allowed":"pointer",fontSize:12,whiteSpace:"nowrap"}}>
            {briefLoading?"생성 중...":"제작 브리프"}
          </button>
          <button onClick={runVisionAnalysis} disabled={visionLoading} style={{background:visionLoading?"#F1F5F9":"#F97316",border:"none",borderRadius:7,padding:"8px 16px",color:visionLoading?"#94A3B8":"#fff",fontWeight:600,cursor:visionLoading?"not-allowed":"pointer",fontSize:12,whiteSpace:"nowrap"}}>
            {visionLoading?"분석 중...":"Vision 분석"}
          </button>
          <button onClick={run} disabled={loading} style={{background:loading?"#F1F5F9":"#1B3EC3",border:"none",borderRadius:7,padding:"8px 16px",color:loading?"#94A3B8":"#fff",fontWeight:600,cursor:loading?"not-allowed":"pointer",fontSize:12,whiteSpace:"nowrap"}}>
            {loading?"분석 중...":"AI 분석"}
          </button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:7,marginBottom:analysis?16:0}}>
        {videos.slice(0,20).map((v)=>(
          <a key={v.videoId} href={`https://www.youtube.com/watch?v=${v.videoId}`} target="_blank" rel="noreferrer"
            style={{position:"relative",borderRadius:7,overflow:"hidden",display:"block",border:"1px solid #E2E8F0"}}>
            <img src={v.thumbnail} alt="" style={{width:"100%",aspectRatio:"16/9",objectFit:"cover",display:"block"}}/>
            <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,.8))",padding:"16px 7px 5px"}}>
              <div style={{color:"#fff",fontSize:9,lineHeight:1.3,fontWeight:500}}>{v.title.slice(0,36)}{v.title.length>36?"...":""}</div>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:2}}>
                <span style={{color:"#93C5FD",fontSize:9,fontFamily:"monospace"}}>{fmtN(v.views)}</span>
                <Tag color={v.videoType.color} bg="transparent" border="transparent">{v.videoType.label}</Tag>
              </div>
            </div>
          </a>
        ))}
      </div>
      {loading&&<Dots text="썸네일 패턴 분석 중..."/>}
      {briefLoading&&<Dots text="경쟁 썸네일 수집 + 제작 브리프 생성 중..."/>}
      {briefWarn&&<div style={{background:"#FFFBEB",border:"1px solid #FBEAB8",borderRadius:8,padding:"8px 12px",color:"#92400E",fontSize:11,marginTop:8}}>{briefWarn}</div>}
      {brief?._error&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:12,color:"#DC2626",fontSize:12,marginTop:10}}>제작 브리프 실패: {brief._msg}</div>}
      {brief&&!brief._error&&(
        <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:10,background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:8,padding:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{color:"#92400E",fontSize:12,fontWeight:700}}>썸네일 제작 브리프</div>
            <button onClick={copyBriefAll} style={{background:briefCopied?"#F0FDF4":"#fff",border:`1px solid ${briefCopied?"#D1FAE5":"#FED7AA"}`,borderRadius:6,padding:"5px 12px",color:briefCopied?"#059669":"#EA580C",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{briefCopied?"복사됨":"브리프 전체 복사"}</button>
          </div>
          {brief.layoutGuide&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[{l:"텍스트 배치",v:brief.layoutGuide.textPosition},{l:"피사체 배치",v:brief.layoutGuide.subjectPosition},{l:"전체 구도",v:brief.layoutGuide.composition}].map(s=>(
              <div key={s.l} style={{background:"#fff",border:"1px solid #FED7AA",borderRadius:6,padding:"10px 12px"}}>
                <div style={{color:"#EA580C",fontSize:10,fontWeight:700,marginBottom:4}}>{s.l}</div>
                <div style={{color:"#1E293B",fontSize:11,lineHeight:1.5}}>{s.v}</div>
              </div>
            ))}

/* ── 소채널 케이스 ── */
function SmallCases({videos}){
  const cases=useMemo(()=>[...videos].filter(v=>v.subscribers>0&&v.subscribers<=100000&&v.views>=v.subscribers*0.3).sort((a,b)=>(b.views/Math.max(b.subscribers,1))-(a.views/Math.max(a.subscribers,1))),[videos]);
  if(!cases.length)return(
    <Card><div style={{textAlign:"center",padding:"32px 0",color:"#94A3B8"}}>
      <div>검색 결과에서 소채널 성공 케이스를 찾지 못했어요</div>
      <div style={{fontSize:11,marginTop:4}}>검색 수를 늘리거나 다른 키워드를 시도해보세요</div>
    </div></Card>
  );
  return(
    <Card>
      <SectionTitle sub="구독자 10만 이하인데 조회수가 높은 영상 — 나도 할 수 있는 레퍼런스">소채널 성공 케이스</SectionTitle>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {cases.map((v,i)=>{
          const ratio=(v.views/Math.max(v.subscribers,1));
          const rc=ratio>=2?"#059669":ratio>=1?"#D97706":"#EA580C";
          return(
            <div key={v.videoId} style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:9,padding:"12px 14px",display:"flex",gap:12,alignItems:"flex-start"}}>
              <div style={{position:"relative",flexShrink:0}}>
                <img src={v.thumbnail} alt="" style={{width:128,height:72,objectFit:"cover",borderRadius:6,display:"block"}}/>
                <div style={{position:"absolute",top:4,left:4,background:rc,color:"#fff",fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:3}}>#{i+1}</div>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <a href={`https://www.youtube.com/watch?v=${v.videoId}`} target="_blank" rel="noreferrer" style={{color:"#0F172A",fontWeight:600,fontSize:13,lineHeight:1.4,display:"block",marginBottom:4}}>{v.title}</a>
                <div style={{color:"#64748B",fontSize:11,marginBottom:8}}>{v.channel} · {v.uploadDays}일 전 · 구독자 {fmtN(v.subscribers)}</div>
                <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                  {[{l:"조회수",v:fmtN(v.views),c:"#1B3EC3"},{l:"반응도",v:v.engagementRate+"%",c:"#D97706"},{l:"바이럴",v:v.viralScore+"점",c:"#1D4ED8"}].map(s=>(
                    <div key={s.l}><div style={{color:"#94A3B8",fontSize:9}}>{s.l}</div><div style={{color:s.c,fontFamily:"monospace",fontSize:12,fontWeight:700}}>{s.v}</div></div>
                  ))}
                </div>
              </div>
              <div style={{flexShrink:0,textAlign:"center",background:rc+"15",border:`1px solid ${rc}40`,borderRadius:8,padding:"8px 12px"}}>
                <div style={{color:rc,fontFamily:"monospace",fontSize:20,fontWeight:900}}>{ratio.toFixed(1)}x</div>
                <div style={{color:"#94A3B8",fontSize:9}}>구독자 대비</div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{marginTop:10,background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:7,padding:"9px 13px",color:"#166534",fontSize:11}}>
        위 영상은 구독자가 적어도 높은 조회수를 기록한 케이스예요. 제목과 썸네일을 집중 분석해보세요.
      </div>
    </Card>
  );
}

/* ── Feature 2: 니치 블루오션 분석기 ── */
function BlueOceanAnalyzer({apiKey,onBack}){
  const[kw,setKw]=useState("");
  const[activeKw,setActiveKw]=useState("");
  const[loading,setLoading]=useState(false);
  const[data,setData]=useState(null);
  const[err,setErr]=useState("");
  const[status,setStatus]=useState("");

  const analyze=async(q)=>{
    const keyword=(q||kw).trim();if(!keyword){setErr("키워드를 입력하세요");return;}
    setActiveKw(keyword);setLoading(true);setErr("");setData(null);setStatus("1/3 영상 검색 중...");
    try{
      const items=await ytSearch(keyword,apiKey,50,"video");
      if(!items.length){setErr("검색 결과 없음");setLoading(false);return;}
      const vIds=items.map(i=>i.id.videoId).filter(Boolean);
      setStatus("2/3 영상 통계 수집 중...");
      const vds=await ytVids(vIds,apiKey);
      const chIds=[...new Set(vds.map(v=>v.snippet.channelId))];
      setStatus("3/3 채널 정보 수집 중...");
      const chs=await ytChs(chIds,apiKey);
      const chMap=Object.fromEntries(chs.map(c=>[c.id,c]));
      const analyzed=vds.map(v=>{const ch=chMap[v.snippet.channelId];const views=parseInt(v.statistics?.viewCount)||0;const likes=parseInt(v.statistics?.likeCount)||0;const comments=parseInt(v.statistics?.commentCount)||0;const subs=parseInt(ch?.statistics?.subscriberCount)||0;return{title:v.snippet.title,channel:ch?.snippet?.title,subs,views,likes,comments,engagementRate:parseFloat(engR(likes,comments,views)),publishedAt:v.snippet.publishedAt};});
      const avgSubs=analyzed.length?Math.round(analyzed.reduce((a,v)=>a+v.subs,0)/analyzed.length):0;
      const avgViews=analyzed.length?Math.round(analyzed.reduce((a,v)=>a+v.views,0)/analyzed.length):0;
      const avgEng=analyzed.length?parseFloat((analyzed.reduce((a,v)=>a+v.engagementRate,0)/analyzed.length).toFixed(2)):0;
      /* 소채널 비율 (5만 이하) */
      const smallChRatio=analyzed.length?Math.round(analyzed.filter(v=>v.subs<50000).length/analyzed.length*100):0;
      let verdict,verdictColor,verdictDesc;
      if(avgSubs<50000&&avgEng>5){verdict="블루오션";verdictColor="#059669";verdictDesc="경쟁이 낮고 반응도가 높아 진입하기 좋은 키워드입니다.";}
      else if(avgSubs<200000&&avgEng>3){verdict="가능성 있음";verdictColor="#D97706";verdictDesc="적절한 차별화 전략이 있다면 충분히 성장 가능합니다.";}
      else{verdict="레드오션";verdictColor="#DC2626";verdictDesc="대형 채널이 지배적입니다. 세부 니치로 좁히는 것을 추천합니다.";}
      setData({avgSubs,avgViews,avgEng,smallChRatio,verdict,verdictColor,verdictDesc,videos:analyzed.sort((a,b)=>b.views-a.views).slice(0,15),totalAnalyzed:analyzed.length});
    }catch(e){setErr(cleanApiErr(e.message));}
    setLoading(false);setStatus("");
  };

  return(
    <div>
      <Card>
        <SectionTitle sub="키워드의 경쟁도와 블루오션 기회를 분석합니다">니치 블루오션 분석기</SectionTitle>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <input value={kw} onChange={e=>setKw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&analyze()} placeholder="분석할 키워드 입력 (예: 퍼스널브랜딩, 생산성 루틴, 독서법)"
            style={{flex:1,border:"1px solid #E2E8F0",borderRadius:8,padding:"10px 14px",fontSize:13,outline:"none"}}/>

      </Card>
      </>}

}

/* ── Feature 3: 업로드 타이밍 분석 ── */
function UploadTimingAnalyzer({videos}){
  const[expanded,setExpanded]=useState(false);

  const timingData=useMemo(()=>{
    if(!videos.length)return null;
    const dow=[0,0,0,0,0,0,0];const hod=Array(24).fill(0);const dohCount=[0,0,0,0,0,0,0];const hodCount=Array(24).fill(0);
    videos.forEach(v=>{
      const d=new Date(v.publishedAt);
      /* UTC → KST 변환 (+9h) */
      const kst=new Date(d.getTime()+9*3600000);
      const day=kst.getDay();const hour=kst.getHours();
      dow[day]+=v.views;dohCount[day]++;
      hod[hour]+=v.views;hodCount[hour]++;
    });
    const avgDow=dow.map((v,i)=>dohCount[i]>0?Math.round(v/dohCount[i]):0);
    const avgHod=hod.map((v,i)=>hodCount[i]>0?Math.round(v/hodCount[i]):0);
    const maxDow=Math.max(...avgDow);const maxHod=Math.max(...avgHod);
    const bestDowIdx=avgDow.indexOf(maxDow);const bestHodIdx=avgHod.indexOf(maxHod);
    const dowLabel=["일","월","화","수","목","금","토"];
    return{avgDow,avgHod,maxDow,maxHod,bestDowIdx,bestHodIdx,dowLabel};
  },[videos]);

  if(!timingData)return null;
  const{avgDow,avgHod,maxDow,maxHod,bestDowIdx,bestHodIdx,dowLabel}=timingData;

  return(
    <Card style={{marginTop:10}}>
      <button onClick={()=>setExpanded(p=>!p)} style={{background:"none",border:"none",width:"100%",textAlign:"left",cursor:"pointer",padding:0,marginBottom:expanded?12:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8,fontWeight:700,fontSize:13,color:"#0F172A"}}>
          <span style={{transition:"transform .2s",display:"inline-block",transform:expanded?"rotate(90deg)":"rotate(0deg)"}}>▸</span>
          업로드 타이밍 분석
        </div>
      </button>
      {expanded&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{background:"#FFFBEB",borderRadius:8,padding:10,border:"1px solid #FBEAB8"}}>
            <div style={{color:"#92400E",fontWeight:600,fontSize:11,marginBottom:4}}>최적 업로드 시점</div>
            <div style={{color:"#78350F",fontSize:12,fontWeight:700}}>{dowLabel[bestDowIdx]}요일 {bestHodIdx}시</div>
            <div style={{color:"#92400E",fontSize:10,marginTop:2}}>평균 조회수: {fmtN(maxDow)}회</div>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:6}}>요일별 평균 조회수</div>
            <div style={{display:"flex",gap:2}}>
              {avgDow.map((v,i)=>(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                  <div style={{width:"100%",height:60,background:"#F1F5F9",borderRadius:3,position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",bottom:0,left:0,right:0,height:`${Math.max(5,v/maxDow*100)}%`,background:i===bestDowIdx?"#1B3EC3":"#94A3B8",transition:"height .3s"}}/>
                  </div>
                  <div style={{fontSize:9,fontWeight:600,color:"#64748B"}}>{dowLabel[i]}</div>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:6}}>시간대별 평균 조회수</div>
            <div style={{display:"flex",gap:1,fontSize:8,color:"#94A3B8"}}>
              {avgHod.map((v,i)=>(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                  <div style={{width:"100%",height:40,background:"#F1F5F9",borderRadius:2,position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",bottom:0,left:0,right:0,height:`${Math.max(3,v/maxHod*100)}%`,background:i===bestHodIdx?"#1B3EC3":"#94A3B8"}}/>
                  </div>
                  {i%3===0&&<div>{i}</div>}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </Card>
  );
}

/* ── Feature 5: 제목 점수 비교기 ── */
function TitleComparer({apiKey}){
  const[open,setOpen]=useState(false);
  const[titles,setTitles]=useState({0:"",1:"",2:""});
  const[loading,setLoading]=useState(false);
  const[results,setResults]=useState(null);
  const[err,setErr]=useState("");

  const analyze=async()=>{
    const validTitles=Object.values(titles).filter(t=>t.trim().length>0);
    if(validTitles.length<2){setErr("최소 2개 이상 제목 입력");return;}
    setLoading(true);setErr("");
    try{
      const scores={};
      for(const[idx,title] of Object.entries(titles)){
        if(!title.trim())continue;
        const items=await ytSearch(title,apiKey,10);
        if(!items.length)continue;
        const vIds=items.map(i=>i.id.videoId).filter(Boolean);
        const vds=await ytVids(vIds,apiKey);
        const avgViews=vds.length?Math.round(vds.reduce((a,v)=>a+parseInt(v.statistics?.viewCount||0),0)/vds.length):0;
        const avgEng=vds.length?parseFloat((vds.reduce((a,v)=>a+parseFloat(engR(v.statistics?.likeCount,v.statistics?.commentCount,v.statistics?.viewCount)||0),0)/vds.length).toFixed(2)):0;
        const titleWords=title.split(/\s+/).length;
        const hasNumber=/\d/.test(title);const hasEmoji=/[\p{Emoji}]/u.test(title);const hasQuestion=/[?？]/.test(title);const hasBracket=/[\[\]【】]/.test(title);
        /* 후킹력 (25점 만점) */
        let hookScore=0;hookScore+=hasEmoji?6:0;hookScore+=hasQuestion?6:0;hookScore+=hasNumber?5:0;hookScore+=hasBracket?3:0;hookScore+=titleWords<=8?5:titleWords<=12?3:0;
        /* SEO (25점 만점) */
        let seoScore=0;const titleLen=title.length;seoScore+=titleLen>=15&&titleLen<=40?10:titleLen>=10&&titleLen<=50?6:2;seoScore+=titleWords>=3&&titleWords<=8?10:titleWords>=2?5:0;seoScore+=title.includes(" ")?5:0;
        /* 감정유도 (25점 만점) - 유사 영상 반응도 기반 */
        let emotionScore=Math.min(25,Math.round(avgEng*3));
        /* 클릭유도 (25점 만점) - 유사 영상 조회수 기반 */
        let ctrScore=Math.min(25,Math.round(avgViews/20000));
        const totalScore=Math.min(100,hookScore+seoScore+emotionScore+ctrScore);
        scores[idx]={hookScore,seoScore,emotionScore,ctrScore,totalScore,avgViews};
      }
      const prompt=`유튜브 영상 제목 후보 비교 분석:\n${Object.entries(scores).map(([idx,s])=>`제목${Number(idx)+1}: "${titles[idx]}" → 총점:${s.totalScore}, 후킹력:${s.hookScore}, SEO:${s.seoScore}, 감정유도:${s.emotionScore}, 클릭유도:${s.ctrScore}, 유사영상평균조회:${fmtN(s.avgViews)}`).join("\n")}\n\nJSON만:{"recommendation":"가장 좋은 제목 선택 이유와 근거 2줄","tips":["구체적 개선팁1","개선팁2","개선팁3"]}`;
      const rec=await gemini(prompt,apiKey);
      setResults({scores,recommendation:rec?.recommendation||"",tips:rec?.tips||[]});
    }catch(e){setErr(cleanApiErr(e.message));}
    setLoading(false);
  };

  if(!open){
    return(
      <button onClick={()=>setOpen(true)} style={{position:"fixed",bottom:20,right:20,width:50,height:50,borderRadius:"50%",background:"#1E3A8A",color:"#fff",border:"none",cursor:"pointer",fontSize:22,boxShadow:"0 4px 12px rgba(37,99,235,.4)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:15}}>
        Aa
      </button>
    );
  }

  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10001}}>
      <Card style={{maxWidth:600,maxHeight:"85vh",overflowY:"auto",padding:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:16,fontWeight:700,color:"#0F172A"}}>제목 점수 비교기</div>
          <button onClick={()=>{setOpen(false);setTitles({0:"",1:"",2:""});setResults(null);}} style={{background:"none",border:"none",fontSize:20,cursor:"pointer"}}>×</button>
        </div>
        {!results?(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {[0,1,2].map(i=>(
              <input key={i} value={titles[i]} onChange={e=>setTitles(p=>({...p,[i]:e.target.value}))} placeholder={`제목 ${i+1} (선택사항)`} style={{border:"1px solid #E2E8F0",borderRadius:6,padding:"10px 12px",fontSize:12,outline:"none"}}/>
            ))}
            <button onClick={analyze} disabled={loading} style={{background:loading?"#F1F5F9":"#1B3EC3",color:loading?"#94A3B8":"#fff",border:"none",borderRadius:6,padding:"10px",fontWeight:600,cursor:loading?"not-allowed":"pointer"}}>
              {loading?"분석 중...":"비교 분석"}
            </button>
            {err&&<ErrBox msg={err}/>}
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {Object.entries(results.scores).map(([idx,score])=>(
              <div key={idx} style={{background:"#F8FAFC",borderRadius:8,padding:12,border:"1px solid #E2E8F0"}}>
                <div style={{fontWeight:700,fontSize:12,color:"#0F172A",marginBottom:8}}>{Number(idx)+1}. {titles[idx]}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:8}}>
                  <div><div style={{fontSize:9,color:"#64748B"}}>후킹력</div><div style={{fontSize:13,fontWeight:700,color:"#1B3EC3"}}>{score.hookScore}</div></div>
                  <div><div style={{fontSize:9,color:"#64748B"}}>검색최적화</div><div style={{fontSize:13,fontWeight:700,color:"#1D4ED8"}}>{score.seoScore}</div></div>
                  <div><div style={{fontSize:9,color:"#64748B"}}>감정유도</div><div style={{fontSize:13,fontWeight:700,color:"#EA580C"}}>{score.emotionScore}</div></div>
                  <div><div style={{fontSize:9,color:"#64748B"}}>클릭유도</div><div style={{fontSize:13,fontWeight:700,color:"#059669"}}>{score.ctrScore}</div></div>
                </div>
                <Bar value={score.totalScore} color={score.totalScore>=70?"#059669":score.totalScore>=50?"#D97706":"#DC2626"} height={6}/>
                <div style={{fontSize:12,fontWeight:700,color:score.totalScore>=70?"#059669":score.totalScore>=50?"#D97706":"#DC2626",marginTop:6}}>총점: {score.totalScore}/100</div>
              </div>
            ))}
            {results.recommendation&&(
              <div style={{background:"#EFF6FF",borderRadius:8,padding:12,border:"1px solid #BFDBFE"}}>
                <div style={{color:"#1B3EC3",fontWeight:700,fontSize:12,marginBottom:6}}>추천</div>
                <div style={{color:"#1E293B",fontSize:12,lineHeight:1.5,marginBottom:6}}>{results.recommendation}</div>
                {results.tips?.map((tip,i)=><div key={i} style={{color:"#0F172A",fontSize:11,marginBottom:2}}>• {tip}</div>)}
              </div>
            )}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ── Feature 1: VS 비교 모드 ── */
function VSCompare({videos,apiKey,onClear}){
  const[analysis,setAnalysis]=useState(null);const[loading,setLoading]=useState(false);
  const runAnalysis=async()=>{
    if(videos.length<2){return;}
    setLoading(true);
    const metricsTable=videos.map((v,i)=>`${i+1}. ${v.title.slice(0,30)}\n   조회:${fmtN(v.views)}, 좋아요:${fmtN(v.likes)}, 댓글:${fmtN(v.comments)}, 반응도:${v.engagementRate}%, 바이럴:${v.viralScore}, 업로드:${v.uploadDays}일전`).join("\n");
    const prompt=`YouTube 영상 VS 비교 분석:\n${metricsTable}\n\n왜 하나가 더 잘 됐는지, 제목/썸네일/주제/타이밍 관점에서 비교 분석해줘. JSON:{"keyDifferences":["차이점1","차이점2","차이점3"],"winnerAnalysis":"성공한영상분석","loserAnalysis":"덜성공한영상분석","titleComparison":"제목비교","timingFactor":"업로드타이밍영향","recommendations":["적용팁1","적용팁2"]}`;
    const res=await gemini(prompt,apiKey);
    if(res?._error){setAnalysis({_error:true,_msg:res._msg});}else{setAnalysis(res);}
    setLoading(false);
  };
  if(videos.length===0)return<Card><div style={{textAlign:"center",padding:"32px 0",color:"#94A3B8"}}>
    <div>영상을 최대 3개까지 선택하여 비교 분석할 수 있습니다</div>
  </div></Card>;
  return(
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:"#0F172A",marginBottom:2}}>VS 비교 분석</div>
          <div style={{fontSize:11,color:"#64748B"}}>선택된 {videos.length}개 영상 비교 분석</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={runAnalysis} disabled={loading||videos.length<2} style={{background:loading?"#F1F5F9":"#1B3EC3",border:"none",borderRadius:7,padding:"8px 16px",color:loading?"#94A3B8":"#fff",fontWeight:600,cursor:loading||videos.length<2?"not-allowed":"pointer",fontSize:12}}>
            {loading?"분석 중...":"분석"}
          </button>
          <button onClick={onClear} style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:7,padding:"8px 14px",color:"#DC2626",fontWeight:600,cursor:"pointer",fontSize:12}}>선택 해제</button>
        </div>
      </div>
      {videos.length>0&&<div style={{display:"grid",gridTemplateColumns:videos.length===2?"1fr 1fr":"repeat(3,1fr)",gap:10,marginBottom:14}}>
        {videos.map((v,i)=>(
          <div key={v.videoId} style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,padding:10,position:"relative"}}>
            <img src={v.thumbnail} alt="" style={{width:"100%",height:80,objectFit:"cover",borderRadius:6,marginBottom:8,display:"block"}}/>
            <div style={{fontSize:10,fontWeight:600,color:"#0F172A",marginBottom:4,lineHeight:1.3}}>{v.title.slice(0,30)}...</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,fontSize:9,color:"#64748B"}}>
              <div><div style={{color:"#94A3B8"}}>조회</div><div style={{fontWeight:700,color:"#1B3EC3"}}>{fmtN(v.views)}</div></div>
              <div><div style={{color:"#94A3B8"}}>반응도</div><div style={{fontWeight:700,color:"#EA580C"}}>{v.engagementRate}%</div></div>
              <div><div style={{color:"#94A3B8"}}>바이럴</div><div style={{fontWeight:700,color:"#B45309"}}>{v.viralScore}</div></div>
              <div><div style={{color:"#94A3B8"}}>업로드</div><div style={{fontWeight:700,color:"#1D4ED8"}}>{v.uploadDays}일</div></div>
            </div>
          </div>
        ))}
      </div>}
      {loading&&<Dots text="VS 분석 중..."/>}
      {analysis?._error&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:12,color:"#DC2626",fontSize:12}}>{analysis._msg}</div>}

        {analysis.keyDifferences&&<div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:12}}>
          <div style={{color:"#1B3EC3",fontWeight:600,fontSize:11,marginBottom:6}}>핵심 차이점</div>
          {analysis.keyDifferences.map((d,i)=><div key={i} style={{fontSize:11,color:"#1E293B",marginBottom:3}}>• {d}</div>)}
        </div>}
        {analysis.titleComparison&&<div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:8,padding:12}}>
          <div style={{color:"#EA580C",fontWeight:600,fontSize:11,marginBottom:6}}>제목 비교</div>
          <div style={{fontSize:11,color:"#78350F",lineHeight:1.5}}>{analysis.titleComparison}</div>
        </div>}
        {analysis.timingFactor&&<div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:8,padding:12}}>
          <div style={{color:"#059669",fontWeight:600,fontSize:11,marginBottom:6}}>타이밍 분석</div>
          <div style={{fontSize:11,color:"#166534",lineHeight:1.5}}>{analysis.timingFactor}</div>
        </div>}
        {analysis.winnerAnalysis&&<div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:8,padding:12}}>
          <div style={{color:"#059669",fontWeight:600,fontSize:11,marginBottom:6}}>성공 요인</div>

/* ── Feature A: 소재 수요·모멘텀 진단 ── */
function calcMomentum(videos){
  if(!videos||videos.length<5)return{level:"gray",label:"데이터 부족",reasons:["영상 5개 미만 — 판정에 필요한 데이터가 부족합니다"]};
  const recent=videos.filter(v=>v.uploadDays<=30),older=videos.filter(v=>v.uploadDays>30);
  const rMed=median(recent.map(v=>v.views/Math.max(v.uploadDays,1)));
  const oMed=median(older.map(v=>v.views/Math.max(v.uploadDays,1)));
  const recentShare30=recent.length/videos.length;
  const recentShare90=videos.filter(v=>v.uploadDays<=90).length/videos.length;
  const bigChannelShare=videos.filter(v=>v.subscribers>=100000).length/videos.length;
  if(!recent.length||!older.length)return{level:"gray",label:"데이터 부족",reasons:[`최근 30일 영상 ${recent.length}개 / 과거 영상 ${older.length}개 — 신구 비교 불가`,`최근 90일 업로드 비중 ${Math.round(recentShare90*100)}%`,`대형채널 점유율 ${Math.round(bigChannelShare*100)}%`],recentShare30,recentShare90,bigChannelShare};
  const ratio=oMed>0?rMed/oMed:null;
  let level="yellow",label="차별화 필요";
  const isRed=(ratio!==null&&ratio<0.7&&recentShare30<0.15)||bigChannelShare>0.7;
  if(isRed){level="red";label=bigChannelShare>0.7?"레드오션":"식은 소재";}
  else if(ratio!==null&&ratio>=1.3&&recentShare30>=0.2){level="green";label="지금 진입";}
  const reasons=[
    `최근 30일 업로드 ${recent.length}개 (${Math.round(recentShare30*100)}%) · 90일 비중 ${Math.round(recentShare90*100)}%`,
    `최근 영상 일평균 ${fmtN(Math.round(rMed))} vs 과거 ${fmtN(Math.round(oMed))} — ${ratio!==null?ratio.toFixed(2)+"배":"비교불가"}`,
    `대형채널 — 구독 10만 이상 — 점유율 ${Math.round(bigChannelShare*100)}%`
  ];
  return{level,label,reasons,ratio,rMed,oMed,recentShare30,recentShare90,bigChannelShare,recentCount:recent.length,olderCount:older.length};
}

  const[aTab,setATab]=useState("conclusion");

  /* ── 검색 기록 시스템 ── */

  /* ── Feature 1: VS 비교 모드 ── */

  /* ── Feature 2/3/5: 모드 및 도구 ── */

  /* ── 영속성: VideoTab 상태 저장 ── */

  useEffect(()=>{if(videos.length)_persist("vt_videos",videos);},[videos]);
  useEffect(()=>_persist("vt_sh",searchHistory),[searchHistory]);

  /* 저장용 경량 매퍼 — 검색기록 용량 절감: relevance 제거, tags는 상위 10개만 유지. TagRecommend가 v.tags를 읽으므로 완전 제거는 불가 */
  const _lightVideo=v=>({videoId:v.videoId,foundBy:v.foundBy||"",channelId:v.channelId,title:v.title,channel:v.channel,thumbnail:v.thumbnail,duration:v.duration,durationSec:v.durationSec,videoType:v.videoType,uploadDays:v.uploadDays,publishedAt:v.publishedAt,views:v.views,likes:v.likes,comments:v.comments,subscribers:v.subscribers,engagementRate:v.engagementRate,viralScore:v.viralScore,exposureGrade:v.exposureGrade,dailyGrowth:v.dailyGrowth??null,growthData:v.growthData??null,tags:(v.tags||[]).slice(0,10)});
  const saveToHistory=(sq,vids,prevEntry)=>{
    const topExp=vids.filter(v=>v.exposureGrade==="매우높음"||v.exposureGrade==="높음").length;
    /* 스냅샷 이력 구축: 이전 검색 데이터와 비교 */
    const now=Date.now();
    const prevSnaps=prevEntry?.snapshots||{};
    const snapshots={};
    vids.forEach(v=>{
      const prev=prevSnaps[v.videoId];
      const history=prev?.history||[];
      /* 이전 스냅샷이 있으면 이력에 추가 */
      if(prev){history.push({views:prev.lastViews,ts:prev.lastTs});}
      snapshots[v.videoId]={lastViews:v.views,lastTs:now,history,firstViews:prev?.firstViews??v.views,firstTs:prev?.firstTs??now};
    });
    /* 일일 증가량 계산 */
    const vidsWithGrowth=vids.map(v=>{
      const snap=snapshots[v.videoId];
      const prevSnap=prevSnaps?.[v.videoId];
      let dailyGrowth=null;let growthData=null;
      if(prevSnap){
        const viewDelta=v.views-prevSnap.lastViews;
        const daysDelta=Math.max((now-prevSnap.lastTs)/86400000,0.01);
        dailyGrowth=Math.round(viewDelta/daysDelta);

/* ── 채널 심층 분석 모달 ── */
function ChannelDeepModal({chId,chTitle,apiKey,onClose}){

  const[aiInsight,setAiInsight]=useState(null);const[aiLoading,setAiLoading]=useState(false);
  const aiRanOnce=useRef(false); /* AI 자동 분석은 최초 1회만 — rankMode 토글 시 재호출 방지 [API 절약] */
  const[rankMode,setRankMode]=useState("eng"); /* eng | views */

  const[chInfo,setChInfo]=useState(null);
  const[brand,setBrand]=useState(null);const[brandLoading,setBrandLoading]=useState(false);
  useEffect(()=>{(async()=>{try{const sdItems=await ytSearch("",apiKey,30,"video","",{channelId:chId,order:"date"});const ids=(sdItems||[]).map(i=>i.id.videoId).filter(Boolean);if(!ids.length){setLoading(false);return;}
  const[vd,cd]=await Promise.all([ytVids(ids,apiKey),ytChs([chId],apiKey)]);if(cd.length){setChStats(cd[0].statistics);setChInfo(cd[0]);}
  const subs=parseInt(cd[0]?.statistics?.subscriberCount)||0;
  const mapped=vd.map(v=>{const views=parseInt(v.statistics?.viewCount)||0;const likes=parseInt(v.statistics?.likeCount)||0;const comments=parseInt(v.statistics?.commentCount)||0;const ud=daysSince(v.snippet.publishedAt);const dSec=parseSec(v.contentDetails?.duration||"");const dailyViews=ud>0?Math.round(views/ud):views;return{videoId:v.id,title:v.snippet.title,thumbnail:`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`,publishedAt:v.snippet.publishedAt,duration:parseDur(v.contentDetails?.duration||""),durationSec:dSec,videoType:getType(dSec),uploadDays:ud,views,likes,comments,dailyViews,engagementRate:engR(likes,comments,views),viralScore:viral(views,likes,comments,subs,ud)};});
  setVideos(mapped);
  }catch(e){setErr(cleanApiErr(e.message));}setLoading(false);})();},[chId,apiKey]);
  const avgViews=videos.length?Math.round(videos.reduce((a,v)=>a+v.views,0)/videos.length):0;
  const avgDailyViews=useMemo(()=>{if(!videos.length)return 0;return Math.round(videos.reduce((a,v)=>a+v.dailyViews,0)/videos.length);},[videos]);
  const medianDailyViews=useMemo(()=>Math.round(median(videos.map(v=>v.dailyViews))),[videos]);
  /* 노출 가능성 추정: 다중 요소 스코어링 (절대 일조회 + 채널 내 상대비교 + 반응도 + 최신성) */
  const getExposure=(v)=>{
    let score=0;
    /* 1. 절대 일조회수 기준 (40점 만점) — 핫 키워드면 일조회 자체가 높음 */
    if(v.dailyViews>=10000)score+=40;else if(v.dailyViews>=3000)score+=32;else if(v.dailyViews>=1000)score+=24;else if(v.dailyViews>=300)score+=16;else if(v.dailyViews>=100)score+=8;
    /* 2. 채널 내 상대 비교 (25점 만점) — 중앙값 대비 */
    const relRef=medianDailyViews>0?medianDailyViews:avgDailyViews;
    if(relRef>0){const ratio=v.dailyViews/relRef;if(ratio>=2)score+=25;else if(ratio>=1.3)score+=18;else if(ratio>=0.8)score+=12;else if(ratio>=0.4)score+=6;}
    /* 3. 반응도 보너스 (20점 만점) — 반응도 높으면 알고리즘 추천 가능성 높음 */
    const er=parseFloat(v.engagementRate)||0;if(er>=8)score+=20;else if(er>=5)score+=15;else if(er>=3)score+=10;else if(er>=1.5)score+=5;
    /* 4. 최신성 보너스 (15점 만점) — 최근 영상일수록 노출 중일 확률 높음 */
    if(v.uploadDays<=3)score+=15;else if(v.uploadDays<=7)score+=12;else if(v.uploadDays<=14)score+=9;else if(v.uploadDays<=30)score+=6;else if(v.uploadDays<=90)score+=3;
    /* 총점 100점 기준 판정 */
    if(score>=55)return{label:"높음",color:"#059669",bg:"#ECFDF5",score};
    if(score>=30)return{label:"보통",color:"#D97706",bg:"#FFFBEB",score};
    return{label:"낮음",color:"#94A3B8",bg:"#F8FAFC",score};
  };
  const topEngVideos=useMemo(()=>[...videos].sort((a,b)=>parseFloat(b.engagementRate)-parseFloat(a.engagementRate)).slice(0,10),[videos]);
  const topViewVideos=useMemo(()=>[...videos].sort((a,b)=>b.views-a.views).slice(0,10),[videos]);
  const bottomEngVideos=useMemo(()=>[...videos].sort((a,b)=>parseFloat(a.engagementRate)-parseFloat(b.engagementRate)).slice(0,3),[videos]);
  const bottomViewVideos=useMemo(()=>[...videos].sort((a,b)=>a.views-b.views).slice(0,3),[videos]);
  const activeTop=rankMode==="eng"?topEngVideos:topViewVideos;
  const activeBottom=rankMode==="eng"?bottomEngVideos:bottomViewVideos;
  const uploadPattern=useMemo(()=>{if(videos.length<2)return null;const dates=videos.map(v=>new Date(v.publishedAt)).sort((a,b)=>a-b);const gaps=[];for(let i=1;i<dates.length;i++)gaps.push((dates[i]-dates[i-1])/86400000);const avgGap=gaps.reduce((a,b)=>a+b,0)/gaps.length;const dayDist=Array(7).fill(0);dates.forEach(d=>{dayDist[d.getDay()]++;});return{avgGap:avgGap.toFixed(1),perWeek:(7/avgGap).toFixed(1),peakDay:["일","월","화","수","목","금","토"][dayDist.indexOf(Math.max(...dayDist))]};},[videos]);
  /* 자동 AI 통합 분석 */
  const runAiInsight=async()=>{
    setAiLoading(true);
    try{
      const criterion=rankMode==="eng"?"반응도(좋아요+댓글/조회)":"조회수";
      const topInfo=activeTop.map((v,i)=>`${i+1}."${v.title}" ${fmtN(v.views)}회 반응${v.engagementRate}% ${v.videoType.label}`).join("\n");
      const btmInfo=activeBottom.map((v,i)=>`${i+1}."${v.title}" ${fmtN(v.views)}회 반응${v.engagementRate}%`).join("\n");
      const data=await gemini(`유튜브 채널"${chTitle}"(구독자${fmtN(parseInt(chStats?.subscriberCount)||0)}) 최근 ${videos.length}개 영상 중 ${criterion} 기준 TOP10과 BOTTOM3:\n\n[TOP10]\n${topInfo}\n\n[BOTTOM3]\n${btmInfo}\n\nTOP과 BOTTOM을 비교 분석해서 JSON만:\n{"topicInsight":{"winning":"잘 터지는 소재/주제 패턴 2줄","losing":"반응 낮은 소재 패턴 한줄","goldTopic":"이 채널에서 가장 먹히는 주제 한줄"},"titleInsight":{"patterns":["잘 되는 제목 공식 3개"],"keywords":["고반응 제목에 자주 쓰이는 키워드 5개"],"avoid":"피해야 할 제목 패턴 한줄"},"thumbInsight":"TOP 영상 썸네일 공통 전략 추정 2줄 (텍스트/인물/색감/구도 등)","formatInsight":"잘 되는 영상 길이/형식 한줄","actionPlan":["내 채널에 바로 써먹을 액션 3개"],"oneLiner":"이 채널의 성공 공식 핵심 한줄"}`,apiKey);
      setAiInsight(data);
    }catch(e){setAiInsight({_error:true,_msg:e.message||"분석 실패"});}
    setAiLoading(false);
  };
  /* 데이터 로딩 완료 시 최초 1회만 자동 분석 — rankMode 전환은 재호출하지 않음 */
  useEffect(()=>{if(!apiKey)return;if(videos.length>0&&!aiRanOnce.current){aiRanOnce.current=true;setAiInsight(null);runAiInsight();}},[videos]);
  /* 브랜딩 분석 — 버튼 트리거, 자동 실행 안 함 — API 절약 */
  const runBranding=async()=>{
    setBrandLoading(true);setBrand(null);
    try{
      let desc=chInfo?.snippet?.description||"";
      if(!desc){try{const dd=await ytFetchJson(`${YT}/channels?part=snippet&id=${chId}&key=${apiKey}`,apiKey);desc=dd.items?.[0]?.snippet?.description||"";}catch(e){console.warn("ch snippet fetch fail",e);}}
      const medViews=Math.round(median(videos.map(v=>v.views)));
      const outliers=medViews>0?videos.filter(v=>v.views>=medViews*3):[];
      const topInfo=topViewVideos.map((v,i)=>(i+1)+'."'+v.title+'" '+fmtN(v.views)+"회 "+v.uploadDays+"일전").join("\n");
      const outInfo=outliers.length?outliers.map(v=>'"'+v.title+'" '+fmtN(v.views)+"회 — 중앙값 "+fmtN(medViews)+"의 "+(v.views/medViews).toFixed(1)+"배").join("\n"):"없음";
      const res=await gemini(`유튜브 채널 "${chTitle}" 브랜딩 전략 분석.\n구독자: ${fmtN(parseInt(chStats?.subscriberCount)||0)}\n채널 소개: ${desc.slice(0,600)||"소개 없음"}\n\n[조회수 TOP10]\n${topInfo}\n\n[아웃라이어 — 채널 중앙값 3배 이상 터진 영상]\n${outInfo}\n\n이 채널의 브랜딩을 해부해서 JSON만 반환:{"targetAudience":{"who":"핵심 타겟이 누구인지","pain":"이들의 고민","desire":"이들이 원하는 것"},"positioning":"이 채널이 시청자에게 하는 약속 한 줄","growthDrivers":[{"driver":"성장 동력","evidence":"근거가 된 영상/패턴"}],"contentFormula":"이 채널이 반복하는 콘텐츠 공식","benchmarkPoints":["우리 채널이 가져올 것 1","2","3"],"risks":"이 채널의 약점 또는 우리가 피해야 할 것"}`,apiKey);
      if(res?._error)setBrand({_error:true,_msg:res._msg});else setBrand(res);
    }catch(e){setBrand({_error:true,_msg:e.message||"브랜딩 분석 실패"});}
    setBrandLoading(false);
  };
  const avgEng=videos.length?(videos.reduce((s,v)=>s+parseFloat(v.engagementRate),0)/videos.length).toFixed(2):"0";
  /* ViewTrap 스타일 성장 지표 — 렌더 내 IIFE 계산을 useMemo로 이동 */
  const gm=useMemo(()=>{
    const subs=parseInt(chStats?.subscriberCount)||0;const totalViews=parseInt(chStats?.viewCount)||0;
    const convRate=subs>0&&totalViews>0?(subs/totalViews*100).toFixed(3):"0";
    const avgDV=avgDailyViews;const vpdRank=avgDV>=10000?"매우높음":avgDV>=3000?"높음":avgDV>=1000?"보통":avgDV>=300?"낮음":"매우낮음";
    const recentVids=videos.filter(v=>v.uploadDays<=14);const olderVids=videos.filter(v=>v.uploadDays>14&&v.uploadDays<=60);
    const recentAvgDV=recentVids.length?Math.round(recentVids.reduce((a,v)=>a+v.dailyViews,0)/recentVids.length):0;
    const olderAvgDV=olderVids.length?Math.round(olderVids.reduce((a,v)=>a+v.dailyViews,0)/olderVids.length):0;
    const momentum=olderAvgDV>0?(recentAvgDV/olderAvgDV).toFixed(2):"N/A";
    const momColor=parseFloat(momentum)>=1.5?"#059669":parseFloat(momentum)>=0.8?"#D97706":"#DC2626";
    const momLabel=parseFloat(momentum)>=2.0?"매우높음":parseFloat(momentum)>=1.3?"높음":parseFloat(momentum)>=0.8?"보통":parseFloat(momentum)>=0.4?"낮음":"매우낮음";
    return{convRate,avgDV,vpdRank,momentum,momColor,momLabel};
  },[chStats,videos,avgDailyViews]);
  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.5)",zIndex:9999,display:"flex",justifyContent:"center",alignItems:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:16,maxWidth:750,width:"100%",maxHeight:"90vh",overflow:"auto",padding:24}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontWeight:800,fontSize:18,color:"#0F172A"}}>{chTitle} 심층 분석</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#94A3B8"}}>×</button>
        </div>
        {loading?<Dots text="채널 데이터 수집 중 (최근 30개 영상)..."/>:err?<ErrBox msg={err}/>:(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {/* 채널 핵심 지표 */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:6}}>
              {[{l:"구독자",v:fmtN(parseInt(chStats?.subscriberCount)||0),c:"#1D4ED8"},{l:"분석 영상",v:videos.length+"개",c:"#1B3EC3"},{l:"평균 조회",v:fmtN(avgViews),c:"#059669"},{l:"평균 반응도",v:avgEng+"%",c:"#D97706"},{l:"업로드",v:uploadPattern?`주${uploadPattern.perWeek}회`:"-",c:"#64748B"}].map(s=>(
                <div key={s.l} style={{textAlign:"center",padding:"8px 4px",background:s.c+"10",borderRadius:8}}>
                  <div style={{color:"#94A3B8",fontSize:9}}>{s.l}</div>
                  <div style={{color:s.c,fontWeight:700,fontSize:14}}>{s.v}</div>
                </div>
              ))}
            </div>
            {/* ViewTrap 스타일: 채널 성장 지표 */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
              <div style={{textAlign:"center",padding:"8px 6px",background:"#EFF6FF",borderRadius:8,border:"1px solid #BFDBFE"}}>
                <div style={{color:"#94A3B8",fontSize:9}}>구독 전환율</div>
                <div style={{color:"#1D4ED8",fontWeight:700,fontSize:13}}>{gm.convRate}%</div>
                <div style={{color:"#94A3B8",fontSize:8}}>구독/총조회</div>
              </div>
              <div style={{textAlign:"center",padding:"8px 6px",background:"#EFF6FF",borderRadius:8,border:"1px solid #BFDBFE"}}>
                <div style={{color:"#94A3B8",fontSize:9}}>일평균 조회</div>
                <div style={{color:"#1B3EC3",fontWeight:700,fontSize:13}}>{fmtN(gm.avgDV)}</div>
                <div style={{color:"#1B3EC3",fontSize:8,fontWeight:600}}>등급 {gm.vpdRank}</div>
              </div>
              <div style={{textAlign:"center",padding:"8px 6px",background:gm.momColor+"10",borderRadius:8,border:`1px solid ${gm.momColor}30`}}>
                <div style={{color:"#94A3B8",fontSize:9}}>성장 모멘텀</div>
                <div style={{color:gm.momColor,fontWeight:700,fontSize:13}}>{gm.momentum}x</div>
                <div style={{color:gm.momColor,fontSize:8,fontWeight:600}}>{gm.momLabel}</div>
              </div>
              <div style={{textAlign:"center",padding:"8px 6px",background:"#FFFBEB",borderRadius:8,border:"1px solid #FBEAB8"}}>
                <div style={{color:"#94A3B8",fontSize:9}}>중앙 일조회</div>
                <div style={{color:"#D97706",fontWeight:700,fontSize:13}}>{fmtN(medianDailyViews)}</div>
                <div style={{color:"#94A3B8",fontSize:8}}>편차 기준값</div>
              </div>
            </div>
            {/* 분류 기준 탭 + TOP 10 리스트 */}
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <SectionTitle sub={`최근 ${videos.length}개 영상 중 ${rankMode==="eng"?"반응도":"조회수"} 기준`}>{rankMode==="eng"?"반응도 TOP 10":"조회수 TOP 10"}</SectionTitle>
                <div style={{display:"flex",gap:4}}>
                  {[{k:"eng",l:"반응도",c:"#D97706"},{k:"views",l:"조회수",c:"#1B3EC3"}].map(t=>(
                    <button key={t.k} onClick={()=>setRankMode(t.k)} style={{padding:"5px 12px",borderRadius:20,border:`1.5px solid ${rankMode===t.k?t.c:"#E2E8F0"}`,background:rankMode===t.k?t.c+"15":"#fff",color:rankMode===t.k?t.c:"#94A3B8",fontWeight:rankMode===t.k?700:500,fontSize:11,cursor:"pointer",transition:"all .2s"}}>{t.l}</button>
                  ))}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {activeTop.map((v,i)=>{const exp=getExposure(v);return(
                  <div key={v.videoId} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 8px",background:i<3?"#FFFBEB":"#F8FAFC",borderRadius:8,border:`1px solid ${i<3?"#FBEAB8":"#E2E8F0"}`}}>
                    <div style={{fontWeight:800,fontSize:14,color:i===0?"#D97706":i<3?"#1B3EC3":"#94A3B8",minWidth:20,textAlign:"center"}}>{i+1}</div>
                    <a href={`https://www.youtube.com/watch?v=${v.videoId}`} target="_blank" rel="noreferrer"><img src={v.thumbnail} style={{width:72,height:40,borderRadius:5,objectFit:"cover"}} alt=""/></a>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <div style={{fontSize:11,fontWeight:600,color:"#0F172A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{v.title}</div>
                        <div style={{flexShrink:0,padding:"2px 7px",borderRadius:10,background:exp.bg,border:`1px solid ${exp.color}30`,fontSize:9,fontWeight:700,color:exp.color,whiteSpace:"nowrap"}}>노출 {exp.label} ({exp.score}점)</div>
                      </div>
                      <div style={{display:"flex",gap:8,marginTop:2,alignItems:"center"}}>
                        <span style={{fontSize:9,color:"#64748B"}}>{fmtN(v.views)}회</span>
                        <span style={{fontSize:9,fontWeight:700,color:parseFloat(v.engagementRate)>=5?"#059669":"#D97706"}}>반응도 {v.engagementRate}%</span>
                        <span style={{fontSize:9,color:"#94A3B8"}}>일 {fmtN(v.dailyViews)}회</span>
                        <Tag color={v.videoType.color} bg={v.videoType.bg} border={v.videoType.border}>{v.videoType.label}</Tag>
                      </div>
                    </div>
                  </div>
                );})}

              </div>
            </Card>
            {/* AI 통합 인사이트 */}
            <Card>
              <SectionTitle sub={`${rankMode==="eng"?"반응도":"조회수"} TOP vs BOTTOM 비교 기반`}>AI 통합 인사이트</SectionTitle>
              {aiLoading&&<Dots text="AI가 소재·제목·썸네일·포맷을 통합 분석 중..."/>}
              {aiInsight?._error&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:12,color:"#DC2626",fontSize:12,marginBottom:8}}>{aiInsight._msg}<br/><button onClick={()=>{setAiInsight(null);runAiInsight();}} style={{marginTop:6,background:"#fff",border:"1px solid #FEE2E2",borderRadius:6,padding:"4px 12px",color:"#DC2626",fontSize:11,cursor:"pointer"}}>다시 시도</button></div>}
              {aiInsight&&!aiInsight._error&&(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {/* 소재/주제 인사이트 */}
                  <div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:10,padding:14}}>
                    <div style={{color:"#059669",fontWeight:700,fontSize:13,marginBottom:8}}>소재/주제 인사이트</div>
                    <div style={{fontSize:12,color:"#166534",lineHeight:1.6,marginBottom:6}}>{aiInsight.topicInsight?.winning}</div>
                    <div style={{fontSize:12,color:"#DC2626",lineHeight:1.6,marginBottom:6}}>{aiInsight.topicInsight?.losing}</div>
                    <div style={{background:"#fff",borderRadius:6,padding:"8px 12px",border:"1px solid #D1FAE5"}}><span style={{color:"#059669",fontWeight:700,fontSize:11}}>골든 주제:</span> <span style={{color:"#0F172A",fontSize:12}}>{aiInsight.topicInsight?.goldTopic}</span></div>
                  </div>
                  {/* 제목 인사이트 */}
                  <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:14}}>
                    <div style={{color:"#1B3EC3",fontWeight:700,fontSize:13,marginBottom:8}}>제목 공식</div>
                    <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:8}}>
                      {aiInsight.titleInsight?.patterns?.map((p,i)=><div key={i} style={{fontSize:12,color:"#1E293B",lineHeight:1.5}}><span style={{color:"#1B3EC3",fontWeight:700}}>{i+1}.</span> {p}</div>)}
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
                      {aiInsight.titleInsight?.keywords?.map((w,i)=><Tag key={i} color="#1B3EC3" bg="#EFF6FF" border="#BFDBFE">{w}</Tag>)}
                    </div>
                    <div style={{fontSize:11,color:"#DC2626"}}>피할 것: {aiInsight.titleInsight?.avoid}</div>
                  </div>
                  {/* 썸네일 + 포맷 */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:10,padding:14}}>
                      <div style={{color:"#1D4ED8",fontWeight:700,fontSize:13,marginBottom:6}}>썸네일 전략</div>
                      <div style={{fontSize:12,color:"#374151",lineHeight:1.6}}>{aiInsight.thumbInsight}</div>
                    </div>
                    <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:10,padding:14}}>
                      <div style={{color:"#EA580C",fontWeight:700,fontSize:13,marginBottom:6}}>포맷/길이</div>
                      <div style={{fontSize:12,color:"#374151",lineHeight:1.6}}>{aiInsight.formatInsight}</div>
                    </div>
                  </div>
                  {/* 액션 플랜 */}
                  <div style={{background:"linear-gradient(135deg,#FFFBEB,#FEF3C7)",border:"1px solid #FBEAB8",borderRadius:10,padding:14}}>
                    <div style={{color:"#92400E",fontWeight:700,fontSize:13,marginBottom:8}}>지금 바로 써먹을 액션</div>
                    {aiInsight.actionPlan?.map((a,i)=><div key={i} style={{fontSize:12,color:"#78350F",lineHeight:1.6,marginBottom:3}}><span style={{fontWeight:700}}>{i+1}.</span> {a}</div>)}
                  </div>
                  {/* 한줄 요약 */}
                  {aiInsight.oneLiner&&<div style={{background:"#0F172A",borderRadius:10,padding:"12px 16px",textAlign:"center"}}><span style={{color:"#FBEAB8",fontSize:13,fontWeight:700}}>{aiInsight.oneLiner}</span></div>}
                </div>
              )}
            </Card>
            {/* Feature C: 브랜딩 채널 분석 */}
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <SectionTitle sub="타겟·포지셔닝·성장 동력·콘텐츠 공식 해부">브랜딩 분석</SectionTitle>
                <button onClick={runBranding} disabled={brandLoading} style={{background:brandLoading?"#F1F5F9":"#0F172A",border:"none",borderRadius:7,padding:"8px 16px",color:brandLoading?"#94A3B8":"#fff",fontWeight:600,cursor:brandLoading?"not-allowed":"pointer",fontSize:12,whiteSpace:"nowrap"}}>{brandLoading?"분석 중...":"브랜딩 분석"}</button>
              </div>
              {!brand&&!brandLoading&&<div style={{textAlign:"center",padding:"18px 0",color:"#94A3B8",fontSize:12}}>버튼을 누르면 이 채널의 타겟/포지셔닝/성장 공식을 AI가 분석합니다</div>}
              {brandLoading&&<Dots text="채널 브랜딩 해부 중..."/>}
              {brand?._error&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:12,color:"#DC2626",fontSize:12}}>{brand._msg}</div>}
              {brand&&!brand._error&&(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {brand.targetAudience&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                    {[{l:"누구",v:brand.targetAudience.who,c:"#1B3EC3",bg:"#EFF6FF",bd:"#BFDBFE"},{l:"고민",v:brand.targetAudience.pain,c:"#EA580C",bg:"#FFF7ED",bd:"#FED7AA"},{l:"원하는 것",v:brand.targetAudience.desire,c:"#059669",bg:"#F0FDF4",bd:"#D1FAE5"}].map(s=>(
                      <div key={s.l} style={{background:s.bg,border:`1px solid ${s.bd}`,borderRadius:8,padding:"10px 12px"}}>
                        <div style={{color:s.c,fontSize:10,fontWeight:700,marginBottom:4}}>{s.l}</div>
                        <div style={{color:"#1E293B",fontSize:11,lineHeight:1.5}}>{s.v}</div>
                      </div>
                    ))}
                  </div>}
                  {brand.positioning&&<div style={{background:"#0F172A",borderRadius:10,padding:"14px 18px",textAlign:"center"}}><span style={{color:"#93C5FD",fontSize:13,fontWeight:700,fontStyle:"italic"}}>“{brand.positioning}”</span></div>}
                  {brand.growthDrivers&&<div style={{background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:8,padding:12}}>
                    <div style={{color:"#1B3EC3",fontWeight:600,fontSize:11,marginBottom:6}}>성장 동력</div>
                    {brand.growthDrivers.map((g,i)=><div key={i} style={{fontSize:11,color:"#1E293B",marginBottom:5,lineHeight:1.5}}><span style={{fontWeight:700,color:"#1B3EC3"}}>{i+1}. {g.driver}</span><span style={{color:"#64748B"}}> — {g.evidence}</span></div>)}
                  </div>}
                  {brand.contentFormula&&<div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:8,padding:12}}>
                    <div style={{color:"#EA580C",fontWeight:600,fontSize:11,marginBottom:4}}>콘텐츠 공식</div>
                    <div style={{fontSize:11,color:"#78350F",lineHeight:1.5}}>{brand.contentFormula}</div>
                  </div>}
                  {brand.benchmarkPoints&&<div style={{background:"#F0FDF4",border:"1px solid #D1FAE5",borderRadius:8,padding:12}}>
                    <div style={{color:"#059669",fontWeight:600,fontSize:11,marginBottom:6}}>우리 채널이 가져올 것</div>
                    {brand.benchmarkPoints.map((b,i)=><div key={i} style={{fontSize:11,color:"#166534",marginBottom:3,lineHeight:1.5}}>• {b}</div>)}
                  </div>}
                  {brand.risks&&<div style={{background:"#FEF2F2",border:"1px solid #FEE2E2",borderRadius:8,padding:12}}>
                    <div style={{color:"#DC2626",fontWeight:600,fontSize:11,marginBottom:4}}>약점 / 피해야 할 것</div>
                    <div style={{fontSize:11,color:"#7F1D1D",lineHeight:1.5}}>{brand.risks}</div>
                  </div>}
                </div>
              )}
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── 실시간 인기 영상 탭 ── */
function TrendingTab({apiKey}){
  /* ── 모드: trending(인기급상승) / discover(카테고리별 발굴) ── */

  const[discoverVids,setDiscoverVids]=useState(()=>_restore("tt_discover",[]));const[discoverLoading,setDiscoverLoading]=useState(false);const[discoverErr,setDiscoverErr]=useState("");const[discoverStatus,setDiscoverStatus]=useState("");

  useEffect(()=>{if(videos.length)_persist("tt_videos",videos);},[videos]);

  const[selCats,setSelCats]=useState(["22","23","24","26","27","28"]);/* 기본: 일상,코미디,엔터,패션,교육,과학 */

  const DISCOVER_CATS=[{id:"1",l:"영화/애니"},{id:"2",l:"차/탈것"},{id:"15",l:"동물"},{id:"17",l:"스포츠"},{id:"19",l:"여행"},{id:"22",l:"일상/브이로그"},{id:"23",l:"코미디"},{id:"24",l:"엔터테인먼트"},{id:"25",l:"뉴스/정치"},{id:"26",l:"패션/뷰티"},{id:"27",l:"교육"},{id:"28",l:"과학/IT"},{id:"29",l:"사회"}];
  const toggleCat=(id)=>setSelCats(prev=>prev.includes(id)?prev.filter(c=>c!==id):[...prev,id]);

  useEffect(()=>{(async()=>{try{
    const grab=async(token)=>{const url=`${YT}/videos?part=snippet,statistics,contentDetails&chart=mostPopular&regionCode=KR&maxResults=50&key=${apiKey}`+(token?`&pageToken=${token}`:"");const r=await fetch(url);const d=await r.json();if(d.error)throw new Error(d.error.message);return d;};
    /* 최대 4페이지(~200개)까지 수집 */
    let all=[];let npt="";

    const chIds=[...new Set(all.map(v=>v.snippet.channelId))];
    const chBatches=[];for(let i=0;i<chIds.length;i+=50)chBatches.push(chIds.slice(i,i+50));
    const chMap={};for(const batch of chBatches){const chs=await ytChs(batch,apiKey);chs.forEach(c=>{chMap[c.id]=parseInt(c.statistics?.subscriberCount)||0;});}
    setVideos(all.filter(v=>parseInt(v.statistics?.viewCount||0)>=50000).map((v,idx)=>{const views=parseInt(v.statistics?.viewCount)||0;const likes=parseInt(v.statistics?.likeCount)||0;const comments=parseInt(v.statistics?.commentCount)||0;const dSec=parseSec(v.contentDetails?.duration||"");const subs=chMap[v.snippet.channelId]||0;
    const ud=daysSince(v.snippet.publishedAt);const dailyViews=ud>0?Math.round(views/ud):views;const er=parseFloat(engR(likes,comments,views))||0;
    const hot=calcHotScore(dailyViews,er,ud,subs>0?views/subs:null);
    const hotScore=hot.score,hotLabel=hot.label,hotColor=hot.color;
    return{rank:idx+1,videoId:v.id,title:v.snippet.title,channel:v.snippet.channelTitle,channelId:v.snippet.channelId,subs,thumbnail:`https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`,thumbHQ:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`,publishedAt:v.snippet.publishedAt,categoryId:v.snippet.categoryId,duration:parseDur(v.contentDetails?.duration||""),durationSec:dSec,videoType:getType(dSec),views,likes,comments,uploadDays:ud,dailyViews,engagementRate:engR(likes,comments,views),hotScore,hotLabel,hotColor};}));
  }catch(e){setErr(cleanApiErr(e.message));}setLoading(false);})();},[apiKey]);
  /* ── 카테고리별 발굴 로드 (수동) ── */
  const CAT_KEYWORDS={"1":["영화 리뷰 추천","애니메이션 추천 2025","드라마 리뷰 넷플릭스"],"2":["자동차 리뷰 시승","바이크 브이로그","전기차 추천"],"15":["강아지 브이로그","고양이 일상","동물 구조"],"17":["축구 하이라이트","야구 분석","스포츠 리뷰"],"19":["여행 브이로그 국내","해외여행 꿀팁","여행지 추천"],"22":["직장인 브이로그","자취 일상","일상 루틴"],"23":["코미디 숏폼","몰래카메라 반응","웃긴영상 모음"],"24":["아이돌 무대","예능 하이라이트","연예인 먹방"],"25":["시사 이슈 분석","뉴스 요약","정치 토론"],"26":["메이크업 튜토리얼","패션 하울 추천","뷰티 리뷰"],"27":["자기계발 추천","공부법 꿀팁","독서 추천"],"28":["AI 활용법","IT 리뷰 언박싱","테크 트렌드"],"29":["사회 이슈 정리","다큐멘터리 추천","사건사고 분석"]};
  const loadDiscover=async()=>{if(!selCats.length)return;setDiscoverLoading(true);setDiscoverErr("");setDiscoverVids([]);setDiscoverStatus("");
    try{
      const afterISO=new Date(Date.now()-discoverRange*86400000).toISOString();
      const seen=new Set();let rawItems=[];
      const catLabels={};DISCOVER_CATS.forEach(c=>{catLabels[c.id]=c.l;});
      /* ── 1단계: 카테고리별 복수 키워드 Search API (order=viewCount) ── */

        setDiscoverStatus(`[2/4] ${catLabels[catId]||catId} 인급동 보충 중... (${catIdx}/${selCats.length}, 총 ${rawItems.length}개)`);

          let npt="";
          for(let pg=0;pg<2;pg++){
            const url=`${YT}/videos?part=snippet,statistics,contentDetails&chart=mostPopular&regionCode=KR&videoCategoryId=${catId}&maxResults=50&key=${apiKey}`+(npt?`&pageToken=${npt}`:"");
            const r=await fetch(url);const d=await r.json();
            if(d.error)break;
            (d.items||[]).forEach(v=>{if(!seen.has(v.id)){seen.add(v.id);rawItems.push({vid:v.id,_catId:catId,_full:v});}});
            npt=d.nextPageToken||"";if(!npt)break;
          }
        }catch(e){}
      }
      /* ── 3단계: 영상 상세 정보 (search 결과만 — mostPopular는 이미 full) ── */
      setDiscoverStatus(`[3/4] ${rawItems.length}개 영상 상세 정보 로딩 중...`);
      const needDetail=rawItems.filter(it=>!it._full).map(it=>it.vid);
      const detailMap={};

      for(let i=0;i<needDetail.length;i+=50){
        setDiscoverStatus(`[3/4] 영상 상세 ${i+1}~${Math.min(i+50,needDetail.length)}/${needDetail.length} 로딩 중...`);
        const batch=needDetail.slice(i,i+50);

      }

      for(let i=0;i<chIds.length;i+=50){const batch=chIds.slice(i,i+50);const chs=await ytChs(batch,apiKey);chs.forEach(c=>{chMap[c.id]=parseInt(c.statistics?.subscriberCount)||0;});}
      /* ── 5단계: 조회수 5만 미만 필터 + 매핑 ── */

      const MIN_V=50000;
      const result=rawItems.filter(it=>detailMap[it.vid]&&parseInt(detailMap[it.vid].statistics?.viewCount||0)>=MIN_V).map((it,idx)=>{
        const v=detailMap[it.vid];const vid=it.vid;
        const views=parseInt(v.statistics?.viewCount)||0;const likes=parseInt(v.statistics?.likeCount)||0;const comments=parseInt(v.statistics?.commentCount)||0;
        const dSec=parseSec(v.contentDetails?.duration||"");const subs=chMap[v.snippet.channelId]||0;
        const ud=daysSince(v.snippet.publishedAt);const dailyViews=ud>0?Math.round(views/ud):views;
        const er=parseFloat(engR(likes,comments,views))||0;
        /* 바이럴 지수: 구독자 대비 조회수 비율 */
        const viralRatio=subs>0?views/subs:0;
        const viralLabel=viralRatio>=10?"초바이럴":viralRatio>=3?"바이럴":viralRatio>=1?"양호":viralRatio>=0.3?"보통":"낮음";
        const viralColor=viralRatio>=10?"#DC2626":viralRatio>=3?"#EA580C":viralRatio>=1?"#D97706":viralRatio>=0.3?"#94A3B8":"#CBD5E1";
        const hot=calcHotScore(dailyViews,er,ud,viralRatio);
        const hotScore=hot.score,hotLabel=hot.label,hotColor=hot.color;
        return{rank:idx+1,videoId:vid,title:v.snippet.title,channel:v.snippet.channelTitle,channelId:v.snippet.channelId,subs,thumbnail:`https://i.ytimg.com/vi/${vid}/mqdefault.jpg`,thumbHQ:`https://i.ytimg.com/vi/${vid}/hqdefault.jpg`,publishedAt:v.snippet.publishedAt,categoryId:it._catId,catLabel:catLabelMap[it._catId]||"기타",duration:parseDur(v.contentDetails?.duration||""),durationSec:dSec,videoType:getType(dSec),views,likes,comments,uploadDays:ud,dailyViews,engagementRate:engR(likes,comments,views),viralRatio,viralLabel,viralColor,hotScore,hotLabel,hotColor};
      });
      result.sort((a,b)=>b.views-a.views);
      setDiscoverVids(result);
    }catch(e){setDiscoverErr(cleanApiErr(e.message));}setDiscoverLoading(false);setDiscoverStatus("");
  };
  const CAT_MAP={"1":"엔터","2":"차/탈것","10":"음악","15":"동물","17":"스포츠","19":"여행","20":"게임","22":"일상","23":"코미디","24":"엔터","25":"뉴스","26":"패션","27":"교육","28":"과학","29":"사회"};
  const categories=useMemo(()=>{const m={};videos.forEach(v=>{const c=CAT_MAP[v.categoryId]||"기타";m[c]=(m[c]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[videos]);
  const[sortDir,setSortDir]=useState("desc");
  const toggleSort=(key)=>{if(sortBy===key){setSortDir(d=>d==="desc"?"asc":"desc");}else{setSortBy(key);setSortDir("desc");}};
  const toggleExclude=(cat)=>setExcludeCats(prev=>prev.includes(cat)?prev.filter(c=>c!==cat):[...prev,cat]);
  const filtered=useMemo(()=>{let list=catFilter==="all"?[...videos]:videos.filter(v=>(CAT_MAP[v.categoryId]||"기타")===catFilter);if(excludeCats.length)list=list.filter(v=>!excludeCats.includes(CAT_MAP[v.categoryId]||"기타"));if(durFilter==="shorts")list=list.filter(v=>v.durationSec<180);else if(durFilter==="long")list=list.filter(v=>v.durationSec>=180);const dir=sortDir==="desc"?-1:1;if(sortBy==="views")list.sort((a,b)=>dir*(a.views-b.views));else if(sortBy==="subs")list.sort((a,b)=>dir*(a.subs-b.subs));return list;},[videos,catFilter,excludeCats,durFilter,sortBy,sortDir]);
  /* ── 카테고리별 발굴 필터 ── */
  const[discoverDurFilter,setDiscoverDurFilter]=useState("all");
  const[discoverCatFilter,setDiscoverCatFilter]=useState("all");
  const discoverFiltered=useMemo(()=>{let list=[...discoverVids];
    if(discoverCatFilter!=="all")list=list.filter(v=>v.catLabel===discoverCatFilter);
    if(discoverDurFilter==="shorts")list=list.filter(v=>v.durationSec<180);else if(discoverDurFilter==="long")list=list.filter(v=>v.durationSec>=180);
    if(discoverSortBy==="views")list.sort((a,b)=>b.views-a.views);else if(discoverSortBy==="viral")list.sort((a,b)=>(b.viralRatio||0)-(a.viralRatio||0));else if(discoverSortBy==="hot")list.sort((a,b)=>b.hotScore-a.hotScore);else if(discoverSortBy==="engage")list.sort((a,b)=>parseFloat(b.engagementRate)-parseFloat(a.engagementRate));else if(discoverSortBy==="daily")list.sort((a,b)=>b.dailyViews-a.dailyViews);else if(discoverSortBy==="subsLow")list.sort((a,b)=>a.subs-b.subs);
    return list;},[discoverVids,discoverCatFilter,discoverDurFilter,discoverSortBy]);

  const SORTS=[{k:"rank",l:"인기순",c:"#D97706"},{k:"views",l:"조회수",c:"#1B3EC3"},{k:"subs",l:"구독자",c:"#1D4ED8"}];

              <button key={r.k} onClick={()=>setDiscoverRange(r.k)} style={{padding:"4px 12px",borderRadius:14,border:`1.5px solid ${discoverRange===r.k?"#1B3EC3":"#E2E8F0"}`,background:discoverRange===r.k?"#EFF6FF":"#fff",color:discoverRange===r.k?"#1B3EC3":"#94A3B8",fontWeight:discoverRange===r.k?700:500,fontSize:11,cursor:"pointer"}}>{r.l}</button>
            ))}
            <div style={{flex:1}}/>

        </div>

          <Dots text={`${selCats.length}개 카테고리 크롤링 중...`}/>
          {discoverStatus&&<div style={{background:"linear-gradient(135deg,#064E3B,#065F46)",borderRadius:10,padding:"14px 18px",margin:"8px 0 12px",color:"#D1FAE5",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:10,boxShadow:"0 2px 8px rgba(0,0,0,.15)"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:"#34D399",animation:"pulse 1s infinite"}}/>
            {discoverStatus}
          </div>}
        </div>}
        {discoverErr&&<ErrBox msg={discoverErr}/>}
        {discoverVids.length>0&&(
          <div>
            {/* 결과 요약 */}

              <div style={{fontSize:12,fontWeight:700,color:"#059669"}}>{discoverVids.length}개 영상 발굴 완료</div>
              <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}}>
                {discoverCats.map(([cat,cnt])=>(
                  <span key={cat} style={{fontSize:10,background:"#fff",padding:"2px 8px",borderRadius:8,color:"#059669",fontWeight:600,border:"1px solid #D1FAE5"}}>{cat} {cnt}개</span>
                ))}
              </div>
            </div>
            {/* 정렬 + 필터 */}
            <div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
              {[{k:"viral",l:"바이럴(구독자대비)",c:"#DC2626"},{k:"views",l:"조회수",c:"#1B3EC3"},{k:"hot",l:"노출확률",c:"#EA580C"},{k:"engage",l:"반응도",c:"#D97706"},{k:"daily",l:"일조회",c:"#1D4ED8"},{k:"subsLow",l:"소채널순",c:"#059669"}].map(s=>(
                <button key={s.k} onClick={()=>setDiscoverSortBy(s.k)} style={{padding:"5px 12px",borderRadius:20,border:`1.5px solid ${discoverSortBy===s.k?s.c:"#E2E8F0"}`,background:discoverSortBy===s.k?s.c+"15":"#fff",color:discoverSortBy===s.k?s.c:"#94A3B8",fontWeight:discoverSortBy===s.k?700:500,fontSize:11,cursor:"pointer"}}>{s.l}</button>
              ))}
              <div style={{width:1,height:16,background:"#E2E8F0",margin:"0 2px"}}/>
              {[{k:"all",l:"전체",c:"#64748B"},{k:"shorts",l:"숏폼",c:"#DC2626"},{k:"long",l:"롱폼",c:"#1B3EC3"}].map(f=>(
                <button key={f.k} onClick={()=>setDiscoverDurFilter(f.k)} style={{padding:"5px 10px",borderRadius:20,border:`1.5px solid ${discoverDurFilter===f.k?f.c:"#E2E8F0"}`,background:discoverDurFilter===f.k?f.c+"15":"#fff",color:discoverDurFilter===f.k?f.c:"#94A3B8",fontWeight:discoverDurFilter===f.k?700:500,fontSize:11,cursor:"pointer"}}>{f.l}</button>
              ))}
            </div>
            {/* 카테고리 포함 필터 */}
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
              <button onClick={()=>setDiscoverCatFilter("all")} style={{padding:"3px 10px",borderRadius:14,border:`1px solid ${discoverCatFilter==="all"?"#059669":"#E2E8F0"}`,background:discoverCatFilter==="all"?"#059669":"#fff",color:discoverCatFilter==="all"?"#fff":"#64748B",fontSize:10,fontWeight:600,cursor:"pointer"}}>전체 {discoverVids.length}</button>
              {discoverCats.map(([cat,cnt])=>(
                <button key={cat} onClick={()=>setDiscoverCatFilter(cat)} style={{padding:"3px 10px",borderRadius:14,border:`1px solid ${discoverCatFilter===cat?"#059669":"#E2E8F0"}`,background:discoverCatFilter===cat?"#F0FDF4":"#fff",color:discoverCatFilter===cat?"#059669":"#64748B",fontSize:10,fontWeight:500,cursor:"pointer"}}>{cat} {cnt}</button>

                {discoverFiltered.map((v,idx)=>renderVideoCard(v,idx,false,true))}

            ):(

        )}
